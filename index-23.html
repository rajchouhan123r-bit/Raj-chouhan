/* Section headings, carried down the page. Without them every question read as

async function readByMarks(pdf,pages,onProgress){

      await pg.render({canvasContext:ctx,viewport:vp}).promise;
      try{ pg.cleanup(); }catch(e){}
      var runs=markRunsFromBands(findMarkBands(ctx,TICK_SCALE,canvas.width,canvas.height));
      if(runs.length){
        var ptH=vp.height/TICK_SCALE, ptW=vp.width/TICK_SCALE;
        var rules=findRowRules(ctx,TICK_SCALE,canvas.width,canvas.height);

           that boxes them. Snapping to it gives the question its real top
           rather than a guess half way up the gap. */
        function ruleBetween(a,b){
          var hit=null;

          return hit;

        for(var k=0;k<runs.length;k++){
          var top, bot;
          if(k===0){
            var above=ruleBetween(Math.max(0,runs[0].y0-320),runs[0].y0-4);
            top=(above!=null)? above : Math.max(46,runs[0].y0-300);
          }else{
            var mid=(runs[k-1].y1+runs[k].y0)/2;

               diagram far below, a line of text just below — so the crop has to
               reach past it or the fourth option comes out cut in half. How far
               is the paper's own answer: the spacing between this question's
               four marks. */

            var r2=ruleBetween(runs[k].y1+2,runs[k+1].y0-4);
            bot=(r2!=null)? r2 : (runs[k].y1+runs[k+1].y0)/2;
          }
          if(bot-top<24) bot=Math.min(ptH-10,top+24);
          out.push({
            srcNum:0, srcLabel:'', text:'', options:['','','',''],
            section:'', page:pn, ans:LETTERS[runs[k].answer-1]||null,
            gap:'', hasGraphic:true, byMark:true,
            rect:{x0:20, y0:top, x1:Math.max(40,ptW-20), y1:bot}

      note:'Reading the marks on page '+pn});

  out.forEach(function(b,i){ b.srcNum=i+1; b.srcLabel='Q.'+(i+1); });

     has nothing to divide. A hundred questions in this format is an SSC CGL
     Tier 1, which is always these four in this order, twenty-five each — so
     that is what it is called, and the section ranges stay editable under
     Options for the papers that are not. */
  if(out.length===100){
    var names=['General Intelligence and Reasoning','General Awareness',
               'Quantitative Aptitude','English Comprehension'];
    out.forEach(function(b,i){
      b.section=names[Math.floor(i/25)];

}

  for(var i=0;i<pages.length;i+=size) groups.push(pages.slice(i,i+size));
  var errCount=0, done=0, split=0;
  function say(note,bad){
    onProgress({stage:'analyzing',current:done,total:pages.length,note:note,errored:!!bad});
  }
  var results=await pMap(groups,async function(g){
    if(APP.processAbort) return null;
    var nums=g.map(function(x){ return x.pageNum; });
    var got=null;
    try{
      got=await readPageGroup(pdf,nums,function(n){ say(n,true); });
    }catch(err){
      say('Pages '+nums.join(', ')+' failed: '+err.message,true);
    }

    var fromSolo=[];

       could not be asked for at all, are read again one at a time. */
    var again=got? got.rest : nums.slice();
    if(got){ done+=got.done.length; say('Read page'+(got.done.length>1?'s ':' ')+got.done.join(', ')); }

      if(again.length<nums.length || !got) split++;

        try{
          var solo=await readPageGroup(pdf,[again[k]],null);
          if(solo) solo.arr.forEach(function(it){
            if(!it) return;
            it.pg=again[k];                       // read on its own: the page is certain

      }
    }

       may have read them all and filed them under the first page. Both look the
       same from here, and the second one produced the same question twice, once
       under the wrong page. Where a page read on its own has already supplied a
       question number, the batch's copy of it goes. */

    fromSolo.forEach(function(it){ solid[Number(it.n)]=Number(it.pg); });

  });

  out.sort(function(a,b){ return (a.page-b.page)||0; });

/* ============ PIPELINE ============ */
/* Where a character in the joined-up document actually sits on paper. Used to
   turn "question 47" into a rectangle so its patch of the page can be cropped
   out and read as a picture. */
function locateRect(ranges,start,end){
  var page=null;
  for(var i=0;i<ranges.length;i++){
    if(start>=ranges[i].start && start<ranges[i].end){ page=ranges[i]; break; }
  }
  if(!page) return null;
  var info=page.info;
  if(!info || !info.lines || !info.lines.length) return null;
  var s=start-page.start, e=Math.min(end-page.start,info.text.length);
  var mine=[];
  info.lines.forEach(function(L){ if(L.end>s && L.start<e) mine.push(L); });
  if(!mine.length) return null;
  /* A question's span runs to wherever the next one starts, and on a
     two-column page that can step over a heading or a line in the other
     column — so the lines are filtered to the column this question is in.

     Which column that is has to be decided from the question's WIDEST line,
     not its first. Its first line is the label "Q.9", fourteen points wide at
     the margin; growing the box from that and then rejecting anything that did
     not overlap it threw away the question's own text, and the rectangle
     stopped at the label. */
  var ref=mine[0];
  mine.forEach(function(L){ if((L.x1-L.x0)>(ref.x1-ref.x0)) ref=L; });
  var col=null;
  (info.colBounds||[]).forEach(function(c){
    var mid=(ref.x0+ref.x1)/2;
    if(mid>=c.x0-2 && mid<=c.x1+2) col=c;
  });
  var box=null;
  mine.forEach(function(L){
    if(col){
      var mid=(L.x0+L.x1)/2;
      if(mid<col.x0-8 || mid>col.x1+8) return;      // the other column, or a sidebar
    }
    if(!box){ box={x0:L.x0,y0:L.y0,x1:L.x1,y1:L.y1}; return; }
    box.x0=Math.min(box.x0,L.x0); box.y0=Math.min(box.y0,L.y0);
    box.x1=Math.max(box.x1,L.x1); box.y1=Math.max(box.y1,L.y1);
  });
  if(!box) return null;
  /* The box is the question's own lines and everything between them, which is
     where a diagram sits: under the stem, above the options. Reaching past the
     last line to swallow the blank space below it looked reasonable and was
     not — that space is the NEXT question's diagram, so every question came
     out claiming its neighbour's figure. */
  return {page:page.pageNum,info:info,rect:box};
}
/* A band belongs to a box when it sits inside it vertically and shares most of
   its width. Testing x by "they touch anywhere" let a band in the left column
   answer for a question in the right one. */
function bandInsideBox(g,box){
  if(g.y0<box.y0-2 || g.y1>box.y1+2) return false;
  var overlap=Math.min(g.x1,box.x1)-Math.max(g.x0,box.x0);
  var width=Math.max(1,Math.min(g.x1-g.x0,box.x1-box.x0));
  return overlap>width*0.5;
}
/* Does this question sit against a blank band or a drawn area? That, rather
   than "one of its options came out empty", is what tells a diagram question
   apart from one the parser merely fumbled. */
function blockHasGraphic(loc){
  if(!loc || !loc.info) return false;
  var info=loc.info, r=loc.rect;
  if(!info.graphic) return false;
  var hit=false;
  (info.gaps||[]).forEach(function(g){ if(bandInsideBox(g,r)) hit=true; });
  /* A page that is mostly drawing and barely any text is a figure page whole. */
  if(!hit && info.imgOps>0 && info.text.length<600) hit=true;
  return hit;
}
/* ---- the answer key printed as ticks ----
   An SSC paper downloaded after the exam carries its official key, but not as
   text: each option has a small green tick or red cross drawn beside it. There
   is nothing for a regular expression to find, so a hundred questions whose
   answers were already on the page were being sent off to be worked out from
   scratch — slower, and a model's opinion in place of the real key.

   The marks are just coloured pixels in a known place, so they can be read here
   for nothing. Proof that a tick means "correct" rather than "what the
   candidate picked": questions marked "Not Answered", with no chosen option at
   all, still carry one — and where a candidate answered wrongly, the tick sits
   on a different option from the one they chose. */
var TICK_SCALE=1.6;
function markColours(ctx,scale,line){
  var x=(line.optX!=null? line.optX : line.x0);

  var x1=Math.max(x0+1,Math.round((x-1)*scale));
  var y0=Math.max(0,Math.round((line.y0-1)*scale));
  var y1=Math.max(y0+1,Math.round((line.y1+1)*scale));
  var d;
  try{ d=ctx.getImageData(x0,y0,x1-x0,y1-y0).data; }catch(e){ return {g:0,r:0,n:0}; }
  var g=0,r=0,n=d.length/4;

    if(G>90 && G-R>35 && G-B>35) g++;

}
var OPT_LINE_RE=/^(?:Ans\s*)?\(?([1-4])\s*[.)]/;
/* ---- the same key, on a paper with no text at all ----
   Some of these PDFs have had their fonts flattened to outlines, so there is no
   text layer to find the options by — nothing for the method above to measure
   against. The marking is still there though, and on these papers the option's
   whole line is coloured, not just the tick beside it: green for the right one,
   red for the other three.

   So the page is read as horizontal bands of colour instead. Four consecutive
   bands, one green among three reds, is one question — and that pattern is
   specific enough that a publisher's red logo at the top of the page cannot
   imitate it. */
function findMarkBands(ctx,scale,W,H){
  var d;
  try{ d=ctx.getImageData(0,0,W,H).data; }catch(e){ return []; }
  var raw=[], cur=null;
  for(var y=0;y<H;y++){
    var g=0,r=0;
    var row=y*W*4;
    for(var x=0;x<W;x++){
      var i=row+x*4, R=d[i], G=d[i+1], B=d[i+2];
      if(G>90 && G-R>55 && G-B>55) g++;
      /* Pale pink watermarks pass a looser test than this; a printed cross does
         not. */
      else if(R>100 && G<150 && B<150 && R-G>60 && R-B>60) r++;
    }
    var t=null;
    if(g>=2 && g>=r) t='G';
    else if(r>=2 && r>g) t='R';
    /* A blank row does NOT end the band. A tick is a thin antialiased stroke
       whose narrow middle drops below the threshold for a row or two; ending
       the band there broke every tick into fragments too short to survive the
       height filter, so the greens vanished and only the fat crosses were
       left. */
    if(!t) continue;
    if(cur && cur.t===t && (y-cur.y1)<=2){ cur.y1=y; cur.px+=(t==='G'?g:r); }
    else { cur={t:t,y0:y,y1:y,px:(t==='G'?g:r)}; raw.push(cur); }
  }
  var bands=raw.map(function(b){
    return {t:b.t, y0:b.y0/scale, y1:b.y1/scale, px:b.px};
  });
  return bands.filter(function(b){
    /* An option line is a line of text. A masthead is not. */
    var h=b.y1-b.y0+1;
    return h>=2 && h<=24 && b.px<6000;
  });
}
/* Four coloured option rows, one of them green, are one question's marking.
   Which four belong together is decided by the gaps, measured against the first
   gap in the group rather than against a fixed number of points — because the
   spacing inside a question is even whether its options are lines of text a
   line apart or full diagrams half a page apart, and a threshold that suits one
   is nonsense for the other.

   Walking the list four at a time instead was how one stray band handed every
   answer below it to the wrong question. */
function markRunsFromBands(bands){
  var groups=[], cur=null, firstGap=0;
  bands.forEach(function(b){
    if(!cur){ cur=[b]; groups.push(cur); return; }
    var gap=b.y0-cur[cur.length-1].y1;
    if(cur.length===1){ cur.push(b); firstGap=gap; return; }
    if(cur.length<8 && gap<=firstGap*1.6+8){ cur.push(b); return; }
    cur=[b]; groups.push(cur);
  });
  var runs=[];
  groups.forEach(function(g){
    g=tightenToFour(g);
    if(!g) return;
    var gi=-1, n=0;
    g.forEach(function(b,k){ if(b.t==='G'){ gi=k; n++; } });
    if(n!==1) return;                          // no tick, or more than one
    runs.push({y0:g[0].y0, y1:g[3].y1, answer:gi+1});
  });
  return runs;
}
/* An option that wraps onto a second line, or carries a fraction above its
   baseline, prints as two bands of its own colour a few points apart. Since a
   question always has four options, the extra bands are folded back in by
   joining the closest same-coloured neighbours until four are left — which
   needs no threshold at all, and so works on a page where the gap inside one
   option is wider than the gap between two others. */

  g=g.slice();
  while(g.length>4){
    var at=-1, best=Infinity;
    for(var i=1;i<g.length;i++){

      var gap=g[i].y0-g[i-1].y1;
      if(gap<best){ best=gap; at=i; }
    }
    if(at<0) return null;                      // all four colours differ: give up
    g[at-1]={t:g[at].t, y0:g[at-1].y0, y1:g[at].y1, px:g[at-1].px+g[at].px};
    g.splice(at,1);

}
/* Where a block sits down the page, for putting a page's questions back into

   know the order the reader returned them in, which is already top to bottom. */
function readOrderY(b){
  if(b.rect && b.rect.y0!=null) return b.rect.y0;
  if(b.spanStart!=null) return b.spanStart;
  return 0;
}
async function readMarkedKey(pdf,ranges,blocks,onProgress){
  var byPage={};
  blocks.forEach(function(b){ if(b.page) (byPage[b.page]=byPage[b.page]||[]).push(b); });
  var pageNums=Object.keys(byPage).map(Number).sort(function(a,b){ return a-b; });
  if(!pageNums.length) return 0;
  var infoByPage={};
  ranges.forEach(function(rg){ infoByPage[rg.pageNum]=rg; });
  var found=0, looked=0, sawKey=false;
  for(var i=0;i<pageNums.length && !APP.processAbort;i++){
    var pn=pageNums[i];
    var rg=infoByPage[pn];
    /* A paper whose fonts have been flattened to outlines has no lines to
       measure against, and used to be skipped here — which is exactly the
       paper whose key is only readable as colour. The page still renders. */
    var info=(rg && rg.info && rg.info.lines.length)? rg.info : null;
    var canvas=null, ctx=null;
    try{
      var page=await pdf.getPage(pn);
      var vp=page.getViewport({scale:TICK_SCALE});
      canvas=makeCanvas(vp.width,vp.height);
      ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      try{ page.cleanup(); }catch(e){}
    }catch(e){ if(canvas){ canvas.width=1; canvas.height=1; } continue; }

    if(info) byPage[pn].forEach(function(b){
      if(b.ans) return;                                   // already keyed from text
      if(b.spanStart==null) return;
      var s=b.spanStart-rg.start, e=b.spanEnd-rg.start;
      var marks=[];
      info.lines.forEach(function(L){
        if(L.end<=s || L.start>=e) return;
        var m=L.text.match(OPT_LINE_RE);
        if(!m) return;
        var c=markColours(ctx,TICK_SCALE,L);
        if(!c.n) return;
        marks.push({o:Number(m[1]), g:c.g/c.n, r:c.r/c.n});
      });
      if(marks.length<3) return;
      looked++;
      var ticked=marks.filter(function(m){ return m.g>0.03; });
      var crossed=marks.filter(function(m){ return m.r>0.03; });
      /* Exactly one tick, and the rest crossed. Anything else is not a marking
         and is left for the model rather than guessed at. */
      if(ticked.length===1 && crossed.length>=marks.length-1){
        b.ans=LETTERS[ticked[0].o-1]||null;
        if(b.ans){ found++; byLine++; sawKey=true; }
      }
    });
    /* Nothing found by position, because there were no option lines to measure
       against. Fall back to reading the whole page as bands of colour: on these
       papers the option TEXT is coloured, not just the tick glyph, so a run of
       four bands with one green in it is one question's marking. */
    /* Also worth doing when every question on the page already has an answer:
       those came from a model looking at a picture of the tick, and this is the
       tick itself. */
    var all=byPage[pn];
    if(!byLine){
      var runs=markRunsFromBands(findMarkBands(ctx,TICK_SCALE,canvas.width,canvas.height));
      /* Only when the page's markings and the page's questions agree in number.
         Guessing the alignment would put a wrong answer against a question,
         which is worse than leaving it blank. */
      if(runs.length===all.length){
        var ord=all.map(function(b,k){ return {b:b,k:k}; });
        ord.sort(function(a,b2){
          var ya=readOrderY(a.b), yb=readOrderY(b2.b);
          return (ya-yb) || (a.k-b2.k);          // keep the reading order given
        });
        /* Where the page already carries an answer, it is worth something as a
           check on whether these runs are lined up with these questions at all.
           A single odd one out is the reader of the page misreading a tick — the
           pixels under it are not in doubt, so the page wins. Half of them
           disagreeing is something else: the runs are against the wrong
           questions, and then nothing here can be trusted. */
        var agree=0, dis=0;
        ord.forEach(function(o,k){
          if(!o.b.ans) return;
          if(o.b.ans===LETTERS[runs[k].answer-1]) agree++; else dis++;
        });
        if(dis===0 || agree>dis){
          ord.forEach(function(o,k){
            var letter=LETTERS[runs[k].answer-1];
            if(!letter || o.b.ans===letter) return;
            o.b.ans=letter; found++;
          });
          looked+=all.length; sawKey=true;
        }

    if(onProgress) onProgress(i+1,pageNums.length,found);

       question pages with nothing on them settles it — and so does one page
       whose options were all measured and none of them marked. Pages where the
       marking was read and simply agreed with what was already there count as
       marking found, or a paper the model had already answered correctly would
       stop being checked after two pages. */
    if(!sawKey && (i>=5 || looked>=8)) break;
  }
  return found;
}
async function processPdf(file,onProgress,onAssembled){

  var pdf=loaded.pdf, pages=loaded.pages;

  pages.forEach(function(p){ pageByNum[p.pageNum]=p; });

  var canAsk=true;

  if(!scanned) blocks=parseBest(combined,ranges);

     reading a picture is not. Whatever the model manages afterwards is laid

    onProgress({stage:'analyzing',current:0,total:pages.length,note:'Reading the marks on the paper'});
    try{
      var mb=await readByMarks(pdf,pages,onProgress);
      if(mb.length>=8) markBlocks=mb;
    }catch(e){}
  }

  if(!blocks && canAsk && !APP.processAbort){
    if(scanned){
      onProgress({stage:'analyzing',current:0,total:pages.length,note:'No text in this PDF — reading the pages as pictures'});

        var vis=await extractViaVision(pdf,pages,onProgress);
        aiAllFailed=!!vis.allFailed;
        if(vis.blocks.length){ blocks=vis.blocks; viaAI=true; viaVision=true; }
      }catch(e){}
    }
    /* Sending the text of a page that has none is a wasted request per page. */
    var haveText=pages.some(function(p){ return p.text.length>=40; });
    if(!blocks && haveText){
      onProgress({stage:'analyzing',current:0,total:pages.length,note:'Unfamiliar layout, reading page by page'});
      try{
        var ai=await extractViaAI(pages,onProgress);
        aiAllFailed=aiAllFailed||!!ai.allFailed;
        if(ai.blocks.length){ blocks=ai.blocks; viaAI=true; }
      }catch(e){}
    }
    /* A text layer that parsed badly is still worth a look as a picture. */
    if(!blocks && !scanned && !APP.processAbort){
      onProgress({stage:'analyzing',current:0,total:pages.length,note:'Reading the pages as pictures instead'});
      try{
        var vis2=await extractViaVision(pdf,pages,onProgress);
        if(vis2.blocks.length){ blocks=vis2.blocks; viaAI=true; viaVision=true; }
      }catch(e){}
    }
  }
  /* The model got some of the way and stopped — most often because a day's
     free requests ran out half way down a thirty-page scan. The pages it never
     reached are not lost: the marks already found every question on them, so
     those pages are filled in from the marking and the paper comes out whole. */
  if(markBlocks){
    var haveAI={};
    (blocks||[]).forEach(function(b){ if(b.page) haveAI[b.page]=true; });
    var byMarkPage={};
    markBlocks.forEach(function(b){ (byMarkPage[b.page]=byMarkPage[b.page]||[]).push(b); });
    var filled=0, merged=[];
    pages.forEach(function(pg){
      var pn=pg.pageNum;
      if(haveAI[pn]){
        (blocks||[]).forEach(function(b){ if(b.page===pn) merged.push(b); });
      }else if(byMarkPage[pn]){
        byMarkPage[pn].forEach(function(b){ merged.push(b); filled++; });
      }
    });
    if(merged.length){
      if(filled) onProgress({stage:'analyzing',current:1,total:1,
        note:filled+' question(s) filled in from the paper’s own marking'});
      blocks=merged;
      viaVision=true;
      if(!blocks.some(function(b){ return !b.byMark; })) viaAI=false;
      markFilled=filled;
    }
  }
  /* Last resort: keep the pages themselves and let the paper be sat off the
     printed page. It is a rough split — the questions are spread evenly over
     the pages rather than located exactly — and the review screen says so, but
     a sittable paper beats a dead end. */
  if(!blocks && pages.length){
    onProgress({stage:'analyzing',current:1,total:1,note:'Building the paper from the pages themselves'});
    blocks=buildPageBlocks(pages.length,APP.pendingCount);
    pagesOnly=true;
  }
  if(!blocks){
    var e0=new Error(isStrayCopy()
      ? 'This PDF is a scan, so reading it needs a model — and a file opened from storage is blocked from reaching one. Open the real app (below) and try there.'
      : 'This PDF could not be read. Check settings → Run a diagnosis to see whether a key is working, or ask for a ready-made paper file instead.');
    e0.aiAllFailed=aiAllFailed;
    throw e0;
  }

  /* Give every block its rectangle on the page, and decide from the page
     itself — not from a failed parse — which ones carry a figure. */
  blocks.forEach(function(b){
    if(b.byMark) return;                    // its rectangle came off the page itself
    if(b.spanStart==null) return;
    var loc=locateRect(ranges,b.spanStart,b.spanEnd);
    if(!loc) return;
    b.rect=loc.rect;
    b.page=loc.page;
    if(b.hasGraphic===undefined) b.hasGraphic=blockHasGraphic(loc);
  });

  onProgress({stage:'analyzing',current:1,total:1,note:'Found '+blocks.length+' questions in document order'});
  /* Free, and it beats anything a model can work out: if the paper prints its
     own key as ticks, take it. */
  var ticked=0;
  if(!pagesOnly){
    try{
      ticked=await readMarkedKey(pdf,ranges,blocks,function(done,total){
        onProgress({stage:'analyzing',current:done,total:total,note:'Reading the answers marked on the paper'});
      });
    }catch(e){}
  }
  if(ticked) onProgress({stage:'analyzing',current:1,total:1,note:ticked+' answers read straight off the paper'});
  var built=assemble(blocks);
  /* Anything the vision pass already drew is carried straight across rather
     than being asked for a second time. */
  built.questions.forEach(function(q,i){
    var b=blocks[i];
    if(!b) return;
    if(b._figure || b._optionFigures || b._topic){
      applyFigureObj(q,{figure:b._figure,optionFigures:b._optionFigures,topic:b._topic});
    }
  });

  /* Handed over the moment the questions exist, so the answer pass can start on
     the ones with no diagram while the diagrams are still being read. */
  if(onAssembled){ try{ onAssembled(built); }catch(e){} }

  var doneCount=0, figSources={};
  built.pageImages={};
  var netOk=canAsk;
  /* A key that is saved and online deserves a real attempt even if the quick
     check was slow. Each request reports its own failure, and there is a Stop
     button, so the cost of trying is small and the cost of not trying is a
     paper with no answers. */
  if(!netOk && keyCount() && isOnline()){ netOk=true; aiMarkUp(); }

  /* Questions still worth sending a picture of: the ones with a diagram, and
     the ones whose text did not come out cleanly. */
  var figQs=built.questions.filter(function(q){
    return q.page && !q.figureDone && (q.hasGraphic || q.thin);
  });

  if(figQs.length && !APP.skipFigures && !APP.processAbort){
    /* Cutting the pictures out is local work costing milliseconds, so it
       happens whether or not there is a key to send them to. Without one they
       used not to be cut at all, which left the questions that most needed
       looking at with nothing to look at — no way to read them by eye, and
       nothing to repair from later when a key was added. */
    var byPage={};
    figQs.forEach(function(q){ (byPage[q.page]=byPage[q.page]||[]).push(q); });
    var groups=[];
    Object.keys(byPage).forEach(function(pg){
      var arr=byPage[pg].slice().sort(function(a,b){ return a.number-b.number; });
      /* Three or four to a group is a saving on REQUESTS: one picture, one
         call, four questions answered. It is a cost on PICTURES, because the
         crop each question then keeps is the rectangle around all four of
         them — which is why question one came with the page header and
         question two attached to it.

         So it depends entirely on where the picture is going. Off to a model:
         group them. Kept for you to look at: one question, one crop. */
      var size=(!AI.redrawFigures || arr.some(function(q){ return q.byMark; })) ? 1
              : (arr.every(function(q){ return q.rect; })? 3 : 4);
      for(var i=0;i<arr.length;i+=size) groups.push({page:Number(pg),qs:arr.slice(i,i+size)});
    });
    onProgress({stage:'figures',current:0,total:figQs.length,note:'Cutting out '+groups.length+' picture(s)'});
    /* Cut every picture out first, then send them all at once.
       Crops off one page share a rendered canvas, so cropping is done page by
       page — but that is local work measured in milliseconds. Leaving the
       network requests inside that loop meant one page's diagram had to come
       back before the next page's was even sent, which on a paper with
       diagrams spread over six pages was most of the import. */
    groups.sort(function(a,b){ return a.page-b.page; });
    for(var gi=0; gi<groups.length && !APP.processAbort && !APP.skipFigures; gi++){
      var g=groups[gi];
      var info=pageByNum[g.page]||null;
      if(gi>0 && groups[gi-1].page!==g.page) releaseBigCanvas();
      try{
        /* A group of one is a question, and a question can be fenced in by
           its neighbours; a group of several cannot be. */
        var rect=null;
        if(info){
          rect=(g.qs.length===1)? fencedRect(g.qs[0],info,byPage[g.page]||[])
                                : rectForGroup(g.qs,info);
        }
        /* A question read from the marks brought its own rectangle with it —
           there is no text layer to work one out from. */
        if(!rect && g.qs.length && g.qs[0].byMark && g.qs[0].rect) rect=g.qs[0].rect;
        /* Masked, always. A solved paper prints a tick beside the right
           option, so an unmasked crop hands over the answer — which is why the
           test screen refused to show these and every diagram question came up
           blank once redrawing was turned off. The key has already been read
           off the unmasked page by this point, so nothing is lost by taking
           the marks off the copy that gets kept. */
        if(rect){ g.img=await renderRegionImage(pdf,g.page,rect,true); g.cropped=true; }
        if(!g.img){ g.img=await renderPageImage(pdf,g.page); g.cropped=false; }
      }catch(e){}
      /* The same picture is kept beside the question, so the redraw button
         works later with no PDF to hand. */
      /* On a picture-read paper the "crop" is the whole page, so keeping it
         against each question stored the same picture four times over and
         filled the budget with copies. The page is kept once, below. */
      for(var k=0;k<g.qs.length;k++){
        if(g.img && (g.cropped || !viaVision)) figSources[g.qs[k].number]=g.img;
      }
    }
    releaseBigCanvas();
    /* On a paper read as pictures there is nothing to cut a question out by, so
       the "crop" is the whole page — the very image already sent while reading
       that page, and already answered. Asking again, once per question, spends
       a request per question to show the model something it has seen and told
       us about. On a thirty-page scan that is most of a day's free allowance
       for a second opinion nobody asked for.

       The picture is kept beside the question either way, so any one diagram
       can still be drawn on demand from the review screen — one request, for
       the question the user actually cares about. */
    var ask=groups.filter(function(g){
      /* ---- the diagram is already in your hands ----
         Cutting a diagram out of the page costs nothing: the page is already
         rendered on a canvas here, and a rectangle out of it is exact. Asking a
         model to look at that crop and REDRAW it as an SVG costs one request
         per figure question — thirty or forty on a reasoning paper, more than
         the pages and the answer key put together — and what comes back is an
         approximation of a picture we already had perfectly.

         So it is off unless asked for. The crop is kept beside the question and
         shown as the diagram, which is the real one off the real paper. Any
         single figure can still be redrawn from the review screen, one request,
         for the one question that needs it. */
      if(!AI.redrawFigures) return false;
      /* A question that came from the marks IS its picture, cut to its own
         borders off the page. There is nothing a redraw would add. */
      if(g.qs.length && g.qs.every(function(q){ return q.byMark; })) return false;
      return g.cropped || !viaVision;
    });
    var held=groups.length-ask.length;
    if(netOk && ask.length){
      var askQs=ask.reduce(function(n,g){ return n+g.qs.length; },0);
      onProgress({stage:'figures',current:0,total:askQs,note:ask.length+' picture(s) to read'});
      await pMap(ask,async function(g){
        if(APP.skipFigures || APP.processAbort || !g.img) return;
        try{ await buildFiguresFromImage(g.qs,g.img,g.cropped); }catch(e){}
        doneCount+=g.qs.length;
        onProgress({stage:'figures',current:doneCount,total:askQs,note:'Reading the diagrams'});
      },Math.max(2,Math.min(6,aiCapacity())));
    }
    if(held){
      onProgress({stage:'figures',current:doneCount,total:doneCount,
        note: AI.redrawFigures
          ? (held+' picture(s) kept as they are — already read once')
          : (held+' diagram(s) kept as cut from the paper — no requests spent')});
    }
    /* Anything that did come out as a proper drawing no longer needs its
       picture kept with the paper. */
    built.questions.forEach(function(q){ if(q.figureDone) delete figSources[q.number]; });
  }

  /* Keeping the page itself needs no network. When a question has no readable
     text, the page it came from is the only thing that makes it answerable. */
  var needPage={};
  built.questions.forEach(function(q){
    if(!q.page) return;
    if(q.figureDone) return;
    if(figSources[q.number]) return;      // its own crop is better and smaller
    var thin=!String(q.text||'').trim() || (q.options||[]).filter(function(o){return String(o||'').trim();}).length<2;
    if(thin || q.hasGraphic) needPage[q.page]=true;
  });
  /* On a paper read as pictures, every question is a picture — including the
     ones the reader managed to put words to, because those words are all there
     is to go on and a diagram it did not mention is invisible. Keep the page
     for every question, and the paper is answerable whatever the reader made
     of it. */
  var pictureRead=!!(viaVision||pagesOnly);
  if(pagesOnly){ for(var pn2=1; pn2<=pages.length; pn2++) needPage[pn2]=true; }
  else if(viaVision){
    built.questions.forEach(function(q){ if(q.page && !figSources[q.number]) needPage[q.page]=true; });
  }
  var pageNums=Object.keys(needPage).slice(0,60);
  if(pageNums.length){
    onProgress({stage:'figures',current:0,total:pageNums.length,note:'Keeping the pages'});
    /* Browser storage stops at about five megabytes and a kept page is roughly
       a hundred kilobytes, so an unbounded scan used to fill it and then fail
       to save the paper at all. Keep what fits, in order, and stop. */
    var imgBytes=0;
    for(var pj=0; pj<pageNums.length && !APP.processAbort; pj++){
      if(imgBytes>pageImageBudget(pictureRead)){ built.pagesDropped=(built.pagesDropped||0)+1; continue; }
      try{
        /* A paper read as pictures has to show its pages during the test —
           there is nothing else to show — so those pages go in with the
           printed key taken off them. */
        var b64=(viaVision||pagesOnly)
          ? await renderPageImageSafe(pdf,Number(pageNums[pj]))
          : await renderPageImage(pdf,Number(pageNums[pj]));
        built.pageImages[pageNums[pj]]=b64;
        imgBytes+=b64.length;
      }catch(e){}
      onProgress({stage:'figures',current:pj+1,total:pageNums.length,note:'Keeping the pages'});
    }
  }
  resetPdfCaches();   // no screenshot is ever shown or saved with the paper
  built.viaAI=viaAI;
  built.viaVision=viaVision;
  built.scanned=scanned;
  built.pagesOnly=pagesOnly;
  built.maskedPages=!!(viaVision||pagesOnly);
  built.figSources=figSources;
  /* After figSources and pageImages are both on `built`, and not before: this
     decides what to drop by asking whether a question has a picture, so
     running it while that list was still empty threw away every diagram
     question on the paper. */
  dropEmptyQuestions(built);
  /* Drop the pages that ended up with a proper drawing anyway. */
  if(!pictureRead) built.questions.forEach(function(q){
    if(q.figureDone && q.page && built.pageImages[q.page]){
      var stillNeeded=built.questions.some(function(o){
        return o.page===q.page && !o.figureDone && (!String(o.text||'').trim() || o.hasGraphic);
      });
      if(!stillNeeded) delete built.pageImages[q.page];
    }
  });
  built.figureCount=built.questions.filter(function(q){return q.figureDone;}).length;
  built.tickedKey=ticked;
  built.unreadCount=built.questions.filter(function(q){
    return !String(q.text||'').trim() || (q.options||[]).filter(function(o){return String(o||'').trim();}).length<2;
  }).length;
  return built;
}

/* ============ ANSWER KEY ============
   The job is to end up with a letter against every question, and it now gets
   there in two stages rather than one.

   Stage one asks only for the letters, in the cheapest form there is:
   "1C 2A 3D". A hundred questions is three hundred tokens of reply instead of
   four and a half thousand, which is the difference between four requests and
   forty — and a reply cut off half way still parses, because every pair before
   the cut is a complete answer. The paper is usable the moment this finishes.

   Stage two fills in the topic tags and the one-line reasons, in the
   background, and can be turned off. Nothing waits on it.

   What went wrong before: a failed batch was split into single questions asked
   one after another, each allowed 850 output tokens while 1536 of those were
   reserved for the model to think with — so every single one came back with no
   text at all, forever, and the screen sat at "0 of 86" for twenty-five minutes
   with nothing to show for it. Splitting is now halving, in parallel, the
   thinking budget can never exceed a third of the room, and every answer that
   lands is reported the moment it lands. */
function questionLine(q,n){
  var body=q.text||'(diagram-based question)';
  if(q.figure && q.figure.kind==='table'){
    body+='\nTable: '+(q.figure.headers||[]).join(' | ')+' :: '+(q.figure.rows||[]).map(function(r){return r.join(' | ');}).join(' ;; ');
  }else if(q.figure && q.figure.kind==='chart'){
    body+='\nChart ('+q.figure.chartType+') labels: '+(q.figure.labels||[]).join(', ')+'; '+
      (q.figure.series||[]).map(function(s){return s.name+': '+s.values.join(', ');}).join(' | ');
  }else if(q.figure){
    body+='\n(This question has a diagram, already read.)';
  }
  return n+'. '+body+'\nA) '+q.options[0]+'\nB) '+q.options[1]+'\nC) '+q.options[2]+'\nD) '+q.options[3];
}
function passageLines(items,passages,seen){
  var lines=[];
  items.forEach(function(q){
    if(q.passageId && passages[q.passageId] && !seen[q.passageId]){
      seen[q.passageId]=true;
      lines.push('[PASSAGE for the questions below]\n'+String(passages[q.passageId].text).slice(0,1400)+'\n[END PASSAGE]');
    }
  });
  return lines;
}
function buildKeyPrompt(items,passages){
  var seen={}, lines=[];
  items.forEach(function(q){
    passageLines([q],passages,seen).forEach(function(l){ lines.push(l); });
    lines.push(questionLine(q,q.number));
  });
  return [
    'You are marking an SSC CGL Tier 1 paper (reasoning, general awareness, quantitative aptitude, English). Indian exam context.',
    'Work each question out properly. Arithmetic must be checked, not estimated.',
    'Answer EVERY question listed. Reply with nothing but the answers, as number+letter pairs separated by spaces:',
    '1C 2A 3D 4B',
    'No JSON, no punctuation, no explanations, no headings, no blank lines. One pair per question, in the order given. If a question is unclear, still give your single best letter.',
    '', lines.join('\n\n')
  ].join('\n');
}
function buildTieBreakPrompt(items,passages,a,b){
  var seen={}, lines=[];
  items.forEach(function(q){
    passageLines([q],passages,seen).forEach(function(l){ lines.push(l); });
    lines.push(questionLine(q,q.number));
  });
  var rows=items.map(function(q){
    return q.number+': one solver says '+((a[q.number]||{}).a||'?')+', another says '+((b[q.number]||{}).a||'?');
  });
  return [
    'You are settling disputed answers on an SSC CGL Tier 1 paper. Indian exam context.',
    'Two independent solvers disagreed on these questions:',
    rows.join('\n'),
    'Work each one out from first principles. Do not simply pick one of the two.',
    'Reply with nothing but number+letter pairs separated by spaces, e.g. 7C 8A. No other text.',
    '', lines.join('\n\n')
  ].join('\n');
}
function buildExplainPrompt(items,passages){
  var seen={}, lines=[];
  items.forEach(function(q){
    passageLines([q],passages,seen).forEach(function(l){ lines.push(l); });
    lines.push(questionLine(q,q.number)+'\nCorrect answer: '+q.correct);
  });
  return [
    'These SSC CGL questions have already been marked and the correct answer is given for each.',
    'For every one, give a short topic tag and a one-line reason the given answer is right.',
    'Reply with one line per question and nothing else, in this exact shape:',
    '<number>|<topic, max 3 words>|<reason, max 20 words>',
    '', lines.join('\n\n')
  ].join('\n');
}
/* "12C 13A" — and anything that is not a pair is simply not a pair. A reply cut
   off mid-word costs one answer rather than all of them. */
function parseLetterPairs(raw,allowed){
  var out={}, m;
  var re=/(\d{1,3})\s*[.:)\-]?\s*([A-Da-d])(?![A-Za-z0-9])/g;
  var txt=String(raw||'');
  while((m=re.exec(txt))){
    var n=Number(m[1]);
    if(allowed && !allowed[n]) continue;
    out[n]=m[2].toUpperCase();
  }
  return out;
}
function parseExplainLines(raw,allowed){
  var out={};
  String(raw||'').split('\n').forEach(function(line){
    var m=line.match(/^\s*(\d{1,3})\s*\|\s*([^|]*)\|\s*(.*)$/);
    if(!m) return;
    var n=Number(m[1]);
    if(allowed && !allowed[n]) return;
    out[n]={t:m[2].trim().slice(0,32),e:m[3].trim().slice(0,160)};
  });
  return out;
}
/* Output room scaled to what is actually coming back, with the thinking budget
   kept to a third of it so a reply can never be squeezed out entirely. */
var KEY_THINK_BUDGET=900;
function keyTokensFor(n){ return clamp(400+n*14,600,8192); }
function keyThinkFor(n){ return Math.min(KEY_THINK_BUDGET,Math.floor(keyTokensFor(n)/3)); }

async function keyBatch(items,passages,into,opts){
  opts=opts||{};
  var allowed={}; items.forEach(function(q){ allowed[q.number]=true; });
  var prompt=opts.prompt || buildKeyPrompt(items,passages);
  var raw=await callAI(prompt,null,false,{
    maxTokens:keyTokensFor(items.length),
    thinkBudget:(opts.think===undefined? keyThinkFor(items.length) : opts.think),
    timeout:opts.timeout||60000, budget:opts.budget||90000,
    pin:opts.pin||null, avoid:opts.avoid||null
  });
  var got=parseLetterPairs(raw,allowed), n=0;
  Object.keys(got).forEach(function(k){
    if(into[k]) return;
    into[k]={a:got[k],t:'',e:''};
    n++;
  });
  if(!n) throw new Error('nothing usable came back');
  return n;
}
function isNetErr(e){
  if(e && e.budgetHit) return false;      // deliberate, and the paper still finishes
  return !!(e && /could not be reached|are offline|Stopped\.|No working API key|No API key/i.test(e.message||''));
}

/* One round over whatever is still missing. Batches run together, every answer
   is merged the moment its batch lands, and a batch that fails is halved rather
   than exploded into single questions one at a time. */
async function keyRound(questions,passages,results,batchSize,onProgress,opts){
  opts=opts||{};
  var batches=[];
  for(var i=0;i<questions.length;i+=batchSize) batches.push(questions.slice(i,i+batchSize));
  var dead=false;
  async function run(batch,depth){
    if(dead || APP.skipKey || APP.processAbort) return;
    try{
      await keyBatch(batch,passages,results,opts);
      if(onProgress) onProgress(Object.keys(results).length,questions.length);
    }catch(e){
      if(isNetErr(e)){ dead=true; return; }
      noteAiError(null,e);
      if(batch.length<=1 || depth>=3) return;
      /* Halve it and try both halves at once. Sixteen questions become two
         eights, not sixteen ones taken in turn. */
      var mid=Math.ceil(batch.length/2);
      await Promise.all([run(batch.slice(0,mid),depth+1),run(batch.slice(mid),depth+1)]);
    }
  }
  await pMap(batches,function(b){ return run(b,0); },Math.max(2,Math.min(8,aiCapacity())));
  return {netDead:dead};
}
/* Keeps going until every question has a letter, or there is nothing left that
   could produce one. Each round asks smaller batches than the last, which is
   what eventually gets the awkward ones. */
async function completeAnswerKey(questions,passages,onProgress){
  var results={};
  clearAiErrors();
  var cross=crossCheckOn() && questions.length>0;
  var sizes=[Math.max(8,Math.min(25,Math.ceil(questions.length/Math.max(2,keyCount())))),12,6,2,1];
  async function sweep(into,pin,report){
    var pending=questions.slice(), netDead=false;
    for(var r=0; r<sizes.length && pending.length && !APP.skipKey && !APP.processAbort && !netDead; r++){
      var res=await keyRound(pending,passages,into,sizes[r],report,{pin:pin});
      netDead=res.netDead;
      pending=questions.filter(function(q){ return !into[q.number]; });
      if(report) report(Object.keys(into).length,questions.length);
    }
    return netDead;
  }
  if(!cross){
    var nd=await sweep(results,null,onProgress);
    if(nd && !Object.keys(results).length) throw new Error(networkFailureMessage());
    return results;
  }
  /* Two sweeps at once, each pinned to its own key so they cannot land on the
     same one. Progress counts the first, which is the one the paper needs. */
  var pool=aiLanes();
  var second={};
  var both=await Promise.all([
    sweep(results,pool[0],onProgress),
    sweep(second,pool[1],null)
  ]);
  var netDead=both[0] && both[1];
  var disputed=[];
  questions.forEach(function(q){
    var a=results[q.number], b=second[q.number];
    if(!a && b){ results[q.number]=b; b.conf=1; return; }
    if(!a || !b){ if(a) a.conf=1; return; }
    if(a.a===b.a){ a.conf=2; }
    else { a.conf=0; disputed.push(q); }
  });
  if(disputed.length && !APP.skipKey && !APP.processAbort && !netDead){
    if(onProgress) onProgress(Object.keys(results).length,questions.length);
    var third={};
    var chunks=[];
    for(var i=0;i<disputed.length;i+=8) chunks.push(disputed.slice(i,i+8));
    await pMap(chunks,async function(chunk){
      if(APP.skipKey || APP.processAbort) return;
      try{
        await keyBatch(chunk,passages,third,{prompt:buildTieBreakPrompt(chunk,passages,results,second),think:KEY_THINK_BUDGET});
      }catch(e){ noteAiError(null,e); }
    },Math.max(2,Math.min(6,aiCapacity())));
    disputed.forEach(function(q){
      var t=third[q.number];
      if(!t) return;
      var agrees=(t.a===(results[q.number]||{}).a)||(t.a===(second[q.number]||{}).a);
      results[q.number]={a:t.a,t:'',e:'',conf: agrees? 2:1};
    });
  }
  if(netDead && !Object.keys(results).length) throw new Error(networkFailureMessage());
  return results;
}
/* Topics and one-line reasons, written straight onto the paper after it is
   already sittable. Nothing waits on this: it runs once the review screen is up
   and saves as it goes, so a failure here costs a nicety and never an answer. */
var _explainRun=0;
async function explainPaper(paper,onEach){
  if(!AI.explain || !paper) return 0;
  var run=++_explainRun;
  var need=paper.questions.filter(function(q){ return q.correct && (!q.explanation || !q.topic); });
  if(!need.length || !keyCount()) return 0;
  var chunks=[];
  for(var i=0;i<need.length;i+=20) chunks.push(need.slice(i,i+20));
  var filled=0;
  await pMap(chunks,async function(chunk){
    if(run!==_explainRun || APP.processAbort) return;
    var allowed={}; chunk.forEach(function(q){ allowed[q.number]=true; });
    try{
      var raw=await callAI(buildExplainPrompt(chunk,passagesOf(paper)),null,false,
        {maxTokens:clamp(300+chunk.length*40,600,4096),thinkBudget:0,timeout:50000,budget:70000});
      var got=parseExplainLines(raw,allowed);
      var byNum={}; paper.questions.forEach(function(q){ byNum[q.number]=q; });
      Object.keys(got).forEach(function(k){
        var q=byNum[k]; if(!q) return;
        if(!q.topic) q.topic=got[k].t;
        if(!q.explanation) q.explanation=got[k].e;
        filled++;
      });
      if(run===_explainRun){
        try{ await storSet('paper:'+paper.id,stripRuntime(paper)); }catch(e){}
        if(onEach) onEach(filled,need.length);
      }
    }catch(e){ noteAiError(null,e); }
  },Math.max(2,Math.min(4,aiCapacity())));
  return filled;
}
function passagesOf(paper){ return (paper && paper.passages)||{}; }
/* Started and forgotten: the review screen is already on show. */
function explainInBackground(paper){
  if(!AI.explain || !paper || !keyCount()) return;
  explainPaper(paper,function(){
    if(APP.paper===paper && (APP.screen==='review'||APP.screen==='results')){ APP._keepScroll=true; renderApp(); }
  }).catch(function(){});
}
/* ============ PROGRESS ACROSS EVERY PAPER ============
   The paid apps charge for this. Every attempt already stores what was
   answered, so weak topics can be worked out across the whole library. */
async function buildProgress(){
  var out={attempts:0,papers:0,scores:[],topics:{},sections:{},recent:[],totalTimeMs:0};
  for(var i=0;i<APP.library.length;i++){
    var entry=APP.library[i];
    var hist=(await storGet('history:'+entry.id))||[];
    if(!hist.length) continue;
    var paper=await storGet('paper:'+entry.id);
    if(!paper) continue;
    out.papers++;
    hist.forEach(function(rec){
      out.attempts++;
      out.totalTimeMs+=rec.elapsedMs||0;
      out.scores.push({at:rec.finishedAt,score:rec.score,max:rec.maxScore,name:entry.name});
      (paper.questions||[]).forEach(function(q,idx){
        var given=(rec.resp&&idx<rec.resp.length)? rec.resp.charAt(idx) : '-';
        if(given==='-'||!q.correct) return;
        var t=(q.topic||'').trim()||'Untagged';
        var bucket=out.topics[t]||(out.topics[t]={asked:0,right:0});
        bucket.asked++; if(given===q.correct) bucket.right++;
        var sn=sectionForNumber(paper.sections||[],q.number);
        var sb=out.sections[sn]||(out.sections[sn]={asked:0,right:0});
        sb.asked++; if(given===q.correct) sb.right++;
      });
    });
  }
  out.scores.sort(function(a,b){ return a.at-b.at; });
  out.recent=out.scores.slice(-10);
  return out;
}
async function openProgress(){
  APP.screen='progress'; APP.progress=null; renderApp();
  try{ APP.progress=await buildProgress(); }catch(e){ APP.progress={error:(e&&e.message)||'Could not read your history.'}; }
  renderApp();
}

  }).sort(function(a,b){ return a.acc-b.acc; });
  if(secs.length){

    secs.forEach(function(x){
      h+='<tr class="'+secClass(x.name)+'"><td style="font-weight:600;"><span class="sec-icon">'+secIcon(x.name)+'</span>'+esc(shortSec(x.name))+'</td>'+

  }).filter(function(x){ return x.name!=='Untagged' && x.asked>=2; });
  var weak=tops.slice().sort(function(a,b){ return (a.acc-b.acc)||(b.lost-a.lost); }).slice(0,10);

/* ============ PRACTICE MODES ============
   The paid apps sell "1167 tests". One paper already contains a sectional test,
   a wrong-answers drill and a marked-questions revision \u2014 they just need to be
   selectable. */
function lastRecord(){
  return (APP.history && APP.history.length)? APP.history[APP.history.length-1] : null;
}
function respAtIndex(rec,i){
  if(!rec || !rec.resp || i>=rec.resp.length) return null;
  var c=rec.resp.charAt(i);
  return c==='-'? null : c;
}
function qNumsFor(mode,arg){
  var paper=APP.paper, all=paper.questions;
  if(mode==='section'){
    var sec=paper.sections.filter(function(x){return x.name===arg;})[0];
    if(!sec) return null;
    return all.filter(function(q){ return q.number>=sec.start && q.number<=sec.end; }).map(function(q){return q.number;});
  }
  if(mode==='wrong'){
    var rec=lastRecord(); if(!rec) return null;
    return all.filter(function(q,i){
      var r=respAtIndex(rec,i);
      return r && q.correct && r!==q.correct;
    }).map(function(q){return q.number;});
  }
  if(mode==='skipped'){
    var rec2=lastRecord(); if(!rec2) return null;
    return all.filter(function(q,i){ return !respAtIndex(rec2,i); }).map(function(q){return q.number;});
  }
  if(mode==='figures'){
    return all.filter(function(q){ return q.figure || (q.optionFigures||[]).some(Boolean); }).map(function(q){return q.number;});
  }
  return null;
}
function modeLabel(mode,arg){
  if(mode==='section') return shortSec(arg)+' only';
  if(mode==='wrong') return 'Wrong last time';
  if(mode==='skipped') return 'Skipped last time';
  if(mode==='figures') return 'Diagram questions';
  return 'Full paper';
}
function suggestedMinutes(count,mode){
  if(mode==='full') return APP.reviewDraft? APP.reviewDraft.durationMinutes : 60;
  return Math.max(3,Math.round(count*0.6));
}
function setPracticeMode(mode,arg){
  var d=APP.reviewDraft; if(!d) return;
  if(mode==='full'){
    d.mode='full'; d.modeArg=null; d.qNums=null;
    d.durationMinutes=d.fullMinutes||60;
  }else{
    var nums=qNumsFor(mode,arg);
    if(!nums || !nums.length){
      toast(mode==='wrong'? 'Nothing wrong to redo \u2014 sit the paper first.'
           : mode==='skipped'? 'Nothing was skipped last time.'
           : mode==='figures'? 'This paper has no diagram questions.'
           : 'That section is empty.');
      return;
    }
    d.mode=mode; d.modeArg=arg||null; d.qNums=nums;
    d.durationMinutes=suggestedMinutes(nums.length,mode);
  }
  /* A different set of questions is a different set of sections. */
  syncSecMinutes(d,true);
  APP._keepScroll=true; renderApp();
}
/* The sections this attempt will actually contain, as section objects. It used
   to hand back objects for a full paper and bare strings for a drill, so the
   only thing that could safely be done with the result was count it. */
function attemptSectionsForDraft(d){
  var secs=(d && d.sections && d.sections.length)? d.sections : (APP.paper? APP.paper.sections : []);
  if(!d || !d.qNums || !d.qNums.length) return secs;
  var seen={}, out=[];
  d.qNums.forEach(function(n){
    var nm=sectionForNumber(secs,n);
    if(seen[nm]) return;
    seen[nm]=true;
    var s=secs.filter(function(x){ return x.name===nm; })[0];
    out.push(s||{name:nm,start:n,end:n});
  });
  return out.length? out : secs;
}
/* How many questions of this drill fall inside a section — what a sensible
   default time per section is worked out from. */
function draftCountInSection(d,sec){
  if(!APP.paper) return 0;
  var nums=(d && d.qNums && d.qNums.length)? d.qNums : APP.paper.questions.map(function(q){ return q.number; });
  var n=0;
  nums.forEach(function(x){ if(x>=sec.start && x<=sec.end) n++; });
  return n;
}
/* Minutes are split in proportion to how many questions each section holds,
   not equally: a 25-question section and a 5-question drill section getting the
   same clock was never right. Whatever the user then types wins over this. */
function evenSecMinutes(d,total){
  var secs=attemptSectionsForDraft(d);
  var counts=secs.map(function(s){ return Math.max(1,draftCountInSection(d,s)); });
  var sum=counts.reduce(function(a,b){ return a+b; },0)||1;
  var out={}, used=0;
  secs.forEach(function(s,i){
    var m=(i===secs.length-1)? Math.max(1,total-used) : Math.max(1,Math.round(total*counts[i]/sum));
    out[s.name]=m; used+=m;
  });
  return out;
}
function secMinutesFor(d,name){
  var v=Number((d.secMinutes||{})[name]);
  return (v>0)? Math.round(v) : 1;
}
/* Redraws only the two numbers that moved. Rebuilding the whole review screen
   on every keystroke stole focus out of the box being typed into. */
function refreshSecTotals(){
  var d=APP.reviewDraft;
  if(!d || !appEl) return;
  var t=document.getElementById('sec-total-readout');
  if(t) t.textContent=fmtMinutes(secMinutesTotal(d));
  var out=document.getElementById('duration-readout');
  if(out) out.textContent=fmtMinutes(d.durationMinutes);
  var sum=document.getElementById('review-summary-line');
  if(sum && APP.paper) sum.textContent=reviewSummaryLine(APP.paper,d,coverageCounts(APP.paper,d.answerMap));
}
function secMinutesTotal(d){
  var t=0;
  attemptSectionsForDraft(d).forEach(function(s){ t+=secMinutesFor(d,s.name); });
  return t;
}
/* Sections can be renamed or added under Options, so the per-section times are
   reconciled with whatever sections currently exist before they are shown. */
function syncSecMinutes(d,reset){
  var secs=attemptSectionsForDraft(d);
  var even=evenSecMinutes(d,d.durationMinutes||60);
  var next={};
  secs.forEach(function(s){
    next[s.name]=(!reset && d.secMinutes && d.secMinutes[s.name]>0)? Math.round(d.secMinutes[s.name]) : even[s.name];
  });
  d.secMinutes=next;
  return next;
}
function fmtMinutes(m){
  m=Number(m)||0;
  if(m<60) return m+' min';
  var h=Math.floor(m/60), r=m%60;
  return h+'h'+(r? (' '+r+'m'):'');
}
function setDuration(mins){
  var d=APP.reviewDraft; if(!d) return;
  d.durationMinutes=clamp(Number(mins)||60,5,300);
  if(d.mode==='full') d.fullMinutes=d.durationMinutes;
  /* The total moved, so the per-section clocks are re-spread to match. Times
     typed in by hand are what set the total in the first place, so this only
     runs the other way round. */
  syncSecMinutes(d,true);
  APP._keepScroll=true; renderApp();
}
/* The other direction: a section's own box was typed into, so the total is
   whatever the sections now add up to. */
function setSectionMinutes(name,mins){
  var d=APP.reviewDraft; if(!d) return false;
  d.secMinutes=d.secMinutes||{};
  d.secMinutes[name]=clamp(Math.round(Number(mins)||0),1,240);
  d.durationMinutes=clamp(secMinutesTotal(d),1,600);
  if(d.mode==='full') d.fullMinutes=d.durationMinutes;
  return true;
}
function draftCount(){
  var d=APP.reviewDraft;
  if(!d) return 0;
  return (d.qNums && d.qNums.length)? d.qNums.length : APP.paper.questions.length;
}

/* ============ FILLING THE KEY LATER ============
   A paper can be sat with no answers at all. The attempt is stored complete;
   the key can arrive afterwards and the score is worked out then. */
/* An answer taken from the paper's printed key and an answer a model worked out
   are not the same thing, and telling them apart matters more than anything else
   on the result screen. */
function sourceMeta(src,by){
  switch(src){
    case 'pdf':    return {label:'From the paper\u2019s printed key',trusted:true};
    case 'manual': return {label:'Set by you',trusted:true};
    case 'import': return {label:'From an imported key',trusted:true};
    case 'model':  return {label:'Worked out by '+(by||'a model')+' \u2014 not an official key',trusted:false};
    case 'gemini': return {label:'Worked out by Gemini \u2014 not an official key',trusted:false};
    case 'ai':     return {label:'Worked out by Claude \u2014 not an official key',trusted:false};
    default:       return {label:'Source not recorded',trusted:false};
  }
}
/* Which services actually produced this paper's answers, recorded with the
   paper so the result screen can still say so months later. */
function answerSourceName(){
  var s=providerSummary();
  return s || 'a model';
}
function sourceBadge(q){
  var m=sourceMeta(q.source,q.by);
  var extra='';
  /* An answer two keys reached separately is worth a good deal more than one
     model's single opinion, and the difference is worth showing. */
  if(!m.trusted && q.agree===2) extra='<span class="src-badge agreed">Two keys agreed</span>';
  else if(!m.trusted && q.agree===1) extra='<span class="src-badge unverified">The two keys disagreed \u2014 check this one</span>';
  return '<span class="src-badge'+(m.trusted?'':' unverified')+'">'+esc(m.label)+'</span>'+extra;
}
function unverifiedCount(paper){
  var n=0;
  (paper.questions||[]).forEach(function(q){ if(q.correct && !sourceMeta(q.source,q.by).trusted) n++; });
  return n;
}
async function fixAnswer(qnum,letter){
  var paper=APP.paper;
  var q=paper.questions.filter(function(x){ return x.number===Number(qnum); })[0];
  if(!q || LETTERS.indexOf(letter)<0) return;
  q.correct=letter; q.source='manual';
  await storSet('paper:'+paper.id,stripRuntime(paper));
  var a=APP.attempt;
  if(a && a.submitted && !a.unscored){
    var r=computeResults(paper,a);
    /* Rescore in place rather than logging a second attempt: the paper was sat
       once, only the marking changed. */
    if(APP.history.length){
      var last=APP.history[APP.history.length-1];
      if(last && last.finishedAt===a.finishedAt){
        APP.history[APP.history.length-1]=historyRecord(r,a,paper);
        var e=findLib(paper.id);
        if(e){
          e.lastScore=r.score;
          if(e.scores && e.scores.length) e.scores[e.scores.length-1]=r.score;
          e.bestScore=(e.scores && e.scores.length)? Math.max.apply(null,e.scores) : r.score;
        }
        persistHistory(paper.id);
      }
    }
  }
  toast('Q'+qnum+' key set to '+letter+'. It stays this way.');
  APP._keepScroll=true;
  renderApp();
}
function keyCounts(paper){
  var withKey=0;
  (paper.questions||[]).forEach(function(q){ if(q.correct) withKey++; });
  return {withKey:withKey,total:(paper.questions||[]).length,missing:(paper.questions||[]).length-withKey};
}
function canFetchAnswers(){
  if(keyCount()) return isOnline();
  return !API_UNAVAILABLE;
}
function whyNoAnswers(){
  if(keyCount() && !isOnline()) return 'You are offline. Your answers are saved \u2014 come back when you have a connection and tap this again.';
  if(!keyCount()){
    var blocked=AI.keys.filter(function(l){ return l.blocked; }).length;
    var dead=AI.keys.filter(function(l){ return l.dead; }).length;
    if(dead && !blocked) return dead+' saved key(s) were refused. Open settings and check them.';
    if(blocked) return 'The browser could not reach the service those keys belong to. A Gemini or Claude key works from a web page.';
    return 'No answer engine is set up. Add a free Gemini API key in settings and this will work from any browser.';
  }
  return '';
}
/* The ring is redrawn without rebuilding the header, so it slides rather than
   snapping, and a quarter of the paper landing is worth a moment's notice. */
function updateProgressRing(){
  var a=APP.attempt, paper=APP.paper;
  if(!a || !paper) return;
  var total=attemptQs(a).length, done=answeredCount();
  var C=2*Math.PI*15;
  var el=document.getElementById('ring-fill');
  if(el) el.setAttribute('stroke-dashoffset',(C*(1-(total? done/total:0))).toFixed(1));
  var num=document.getElementById('ring-num');
  if(num) num.textContent=done;
  var quarter=total? Math.floor((done/total)*4) : 0;
  if(quarter>APP.lastMilestone && done>0){
    APP.lastMilestone=quarter;
    var w=document.getElementById('progress-ring');
    if(w){ w.classList.remove('milestone'); void w.offsetWidth; w.classList.add('milestone'); }
    if(quarter===2){ toast('Half the paper answered'); buzz(30); }
    else if(quarter===4){ toast('Every question answered'); buzz([60,50,60]); }
  }
}
function updateKeyFillUi(){
  var k=APP.keyFill; if(!k) return;
  var drawing=(k.what==='diagrams');
  var el=document.getElementById(drawing? 'figfill-progress':'keyfill-progress');
  if(el) el.textContent=k.done+' of '+k.total+(drawing? ' drawn':' answered');
  var bar=document.getElementById(drawing? 'figfill-bar':'keyfill-bar');
  if(bar) bar.style.width=pct(k.done,k.total)+'%';
}
/* Drawing happens here, before the paper starts, in page-sized batches. */
async function drawMissingFigures(){
  var paper=APP.paper;
  if(!paper) return;
  var need=paper.questions.filter(function(q){ return q.needsFigure && !q.figureDone && storedImageFor(q); });
  var noSource=paper.questions.filter(function(q){ return q.needsFigure && !q.figureDone && !storedImageFor(q); }).length;
  if(!need.length){
    toast(noSource? ('No page picture was kept for '+noSource+' of them \u2014 add the PDF again to redraw those.')
                  : 'Every diagram is already drawn.');
    return;
  }
  if(!canFetchAnswers()){ APP.keyFill={running:false,error:whyNoAnswers()}; renderApp(); return; }

  /* One request per page picture, four questions at a time. */
  var byImg={};
  need.forEach(function(q){
    var key=q.page? ('p'+q.page) : ('q'+q.number);
    (byImg[key]=byImg[key]||[]).push(q);
  });
  var groups=[];
  Object.keys(byImg).forEach(function(k){
    var arr=byImg[k];
    for(var i=0;i<arr.length;i+=4) groups.push(arr.slice(i,i+4));
  });

  APP.keyFill={running:true,done:0,total:need.length,engine:engineName(),what:'diagrams'};
  renderApp();
  var drawn=0, lastErr='', stop=false;
  /* One picture at a time left every key but the first one idle. The scheduler
     already holds each key's rate down, so handing it the whole list only
     overlaps the waiting. */
  await pMap(groups,async function(grp){
    if(stop) return;
    try{
      drawn+=await buildFiguresFromImage(grp,storedImageFor(grp[0]),storedImageIsCrop(grp[0]));
    }catch(err){
      lastErr=(err && err.message)||String(err);
      /* A dead connection will not fix itself on the next page. */
      if(/could not be reached|are offline|refused|Stopped|No working API key/i.test(lastErr)) stop=true;
    }
    APP.keyFill.done=Math.min(drawn,need.length);
    updateKeyFillUi();
  },Math.max(1,Math.min(4,aiCapacity())));
  try{ await storSet('paper:'+paper.id,stripRuntime(paper)); }catch(e){}
  APP.keyFill={running:false,done:drawn,total:need.length,
    error: drawn? '' : (lastErr || 'Nothing came back. Check settings \u2192 Run a diagnosis.')};
  if(drawn) toast(drawn+' of '+need.length+' drawn.'+(noSource? (' '+noSource+' had no page picture.'):''));
  renderApp();
}
async function runKeyFill(useDraft){
  var paper=APP.paper;
  if(!paper) return 0;
  var draft = useDraft? APP.reviewDraft : null;
  var need=paper.questions.filter(function(q){ return draft? !draft.answerMap[q.number] : !q.correct; });
  if(!need.length){ toast('Every question already has an answer.'); return 0; }
  if(!canFetchAnswers()){ toast(whyNoAnswers()); return 0; }
  APP.keyFill={running:true,done:0,total:need.length,engine:engineName()};
  renderApp();
  var got=0;
  try{
    var keys=await completeAnswerKey(need,paper.passages||{},function(done,total,phase){
      APP.keyFill={running:true,done:done,total:total,engine:engineName(),phase:phase||''};
      updateKeyFillUi();
    });
    need.forEach(function(q){
      var k=keys[q.number]; if(!k) return;
      got++;
      q.correct=k.a; q.source='model'; q.by=answerSourceName();
      if(k.conf!=null) q.agree=k.conf;
      if(!q.topic) q.topic=k.t||'';
      if(!q.explanation) q.explanation=k.e||'';
      if(draft){ draft.answerMap[q.number]=k.a; draft.answerSource[q.number]=q.source; }
    });
    await storSet('paper:'+paper.id,stripRuntime(paper));
    APP.keyFill={running:false,done:got,total:need.length};
    toast(got? (got+' of '+need.length+' answered by '+engineName()+'.') : 'Nothing came back. Try again in a minute.');
  }catch(err){
    APP.keyFill={running:false,error:(err && err.message)||String(err)};
  }
  renderApp();
  return got;
}
/* Reads a key out of pasted text: "1-A 2-C", a bare run of letters, or the
   scrambled code that ships with a paper. */
function parseKeyText(raw,count){
  var txt=String(raw||'').trim();
  if(!txt) return null;
  var compact=txt.replace(/\s+/g,'');
  if(/^[A-Za-z0-9+/=]{16,}$/.test(compact) && !/^[A-Da-d]+$/.test(compact)){
    try{ var dec=atob(compact); if(dec && /[A-Da-d1-4]/.test(dec)) txt=dec; }catch(e){}
  }
  var map={}, n=0, m;
  var pairRe=/(\d{1,3})\s*[).:=\-\u2013]?\s*([A-Da-d]|[1-4])(?![0-9A-Za-z])/g;
  while((m=pairRe.exec(txt))){
    var qn=Number(m[1]); if(!(qn>=1 && qn<=count)) continue;
    var v=m[2].toUpperCase();
    if(/[1-4]/.test(v)) v=LETTERS[Number(v)-1];
    map[qn]=v; n++;
  }
  if(n>=Math.max(4,Math.floor(count*0.4))) return {map:map,n:n};
  var letters=txt.toUpperCase().replace(/[^A-D]/g,'').split('');
  if(letters.length===count){
    map={}; letters.forEach(function(L,i){ map[i+1]=L; });
    return {map:map,n:count};
  }
  return n? {map:map,n:n} : null;
}

/* ============ WHICH QUESTIONS ARE IN THIS ATTEMPT ============
   An attempt used to be the whole paper. It is now an ordered list of question
   numbers, so one paper can be practised as a full mock, a single section, or
   just the ones that went wrong last time. Default is still everything. */
function attemptQs(a){
  a=a||APP.attempt;
  var paper=APP.paper;
  if(!a || !paper) return [];
  if(!a.qNums || !a.qNums.length) return paper.questions;
  var byNum={};
  paper.questions.forEach(function(q){ byNum[q.number]=q; });
  var out=[];
  a.qNums.forEach(function(n){ if(byNum[n]) out.push(byNum[n]); });
  return out.length? out : paper.questions;
}
function qAtIndex(i,a){ var list=attemptQs(a); return list[clamp(i,0,list.length-1)]; }
function curQ(){ var a=APP.attempt; return a? qAtIndex(a.currentIndex,a) : null; }
function attemptSections(a){
  a=a||APP.attempt;
  var paper=APP.paper, seen={}, out=[];
  attemptQs(a).forEach(function(q){
    var nm=sectionForNumber(paper.sections,q.number);
    if(!seen[nm]){ seen[nm]=true; out.push(paper.sections.filter(function(s){return s.name===nm;})[0]||{name:nm,start:q.number,end:q.number}); }
  });
  return out.length? out : paper.sections;
}
function isPartial(a){
  a=a||APP.attempt;
  return !!(a && a.qNums && APP.paper && a.qNums.length<APP.paper.questions.length);
}

/* ============ SECTIONS / SCORING ============ */
function defaultSections(){
  return [
    {name:'Reasoning',start:1,end:25},
    {name:'General Awareness',start:26,end:50},
    {name:'Quantitative Aptitude',start:51,end:75},
    {name:'English',start:76,end:100}
  ];
}
function sectionForNumber(sections,n){
  for(var i=0;i<sections.length;i++){ var s=sections[i]; if(n>=s.start&&n<=s.end) return s.name; }
  return 'Unassigned';
}

/* ============ CHART / FIGURE RENDERING ============ */
var CHART_COLORS=['var(--govt-blue)','var(--brass)','var(--success)','var(--danger)','var(--marked)'];
function svgChart(f){
  var W=340,H=200,PL=38,PR=10,PT=14,PB=34;
  var labels=f.labels||[], series=f.series||[];
  if(f.chartType==='pie'){
    var vals=(series[0]&&series[0].values)||[];
    var total=vals.reduce(function(a,b){return a+b;},0)||1;
    var cx=100,cy=100,r=76,ang=-Math.PI/2,out='';
    vals.forEach(function(v,i){
      var a2=ang+(v/total)*Math.PI*2;
      var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      var large=(a2-ang)>Math.PI?1:0;
      out+='<path d="M'+cx+','+cy+' L'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+r+','+r+' 0 '+large+',1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z" fill="'+CHART_COLORS[i%5]+'" stroke="var(--surface)" stroke-width="1.5"/>';
      var mid=(ang+a2)/2;
      out+='<text x="'+(cx+r*0.65*Math.cos(mid)).toFixed(1)+'" y="'+(cy+r*0.65*Math.sin(mid)).toFixed(1)+'" font-size="11" fill="#fff" text-anchor="middle" font-family="sans-serif">'+esc(v)+'</text>';
      ang=a2;
    });
    var leg='';
    labels.forEach(function(l,i){
      leg+='<g transform="translate(210,'+(28+i*20)+')"><rect width="11" height="11" rx="2" fill="'+CHART_COLORS[i%5]+'"/><text x="17" y="10" font-size="11.5" fill="var(--ink)" font-family="sans-serif">'+esc(l)+'</text></g>';
    });
    return '<svg viewBox="0 0 340 200" style="max-width:100%;height:auto;">'+out+leg+'</svg>';
  }
  var all=[]; series.forEach(function(s){ (s.values||[]).forEach(function(v){ all.push(v); }); });
  var max=Math.max.apply(null,all.concat([1]));
  var min=Math.min.apply(null,all.concat([0])); if(min>0) min=0;
  var span=(max-min)||1;
  var iw=W-PL-PR, ih=H-PT-PB;
  var x=function(i,n){ return PL+(iw/Math.max(n,1))*(i+0.5); };
  var y=function(v){ return PT+ih-((v-min)/span)*ih; };
  var g='';
  for(var t=0;t<=4;t++){
    var gv=min+(span/4)*t, gy=y(gv);
    g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
       '<text x="'+(PL-5)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="9.5" fill="var(--ink-muted)" text-anchor="end" font-family="sans-serif">'+num(gv)+'</text>';
  }
  var n=labels.length||((series[0]&&series[0].values.length)||0);
  if(f.chartType==='line'){
    series.forEach(function(s,si){
      var pts=(s.values||[]).map(function(v,i){ return x(i,n).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
      g+='<polyline points="'+pts+'" fill="none" stroke="'+CHART_COLORS[si%5]+'" stroke-width="2.2" stroke-linejoin="round"/>';
      (s.values||[]).forEach(function(v,i){ g+='<circle cx="'+x(i,n).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3" fill="'+CHART_COLORS[si%5]+'"/>'; });
    });
  }else{
    var groupW=iw/Math.max(n,1), barW=Math.max(6,(groupW*0.62)/Math.max(series.length,1));
    series.forEach(function(s,si){
      (s.values||[]).forEach(function(v,i){
        var bx=PL+groupW*i+(groupW-barW*series.length)/2+barW*si;
        var by=y(Math.max(v,0)), bh=Math.abs(y(v)-y(0));
        var barFill=(f.barColors && f.barColors[i])? f.barColors[i] : CHART_COLORS[si%5];
        g+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" fill="'+barFill+'" rx="2"/>';
      });
    });
  }
  labels.forEach(function(l,i){
    g+='<text x="'+x(i,n).toFixed(1)+'" y="'+(H-PB+15)+'" font-size="10" fill="var(--ink-muted)" text-anchor="middle" font-family="sans-serif">'+esc(String(l).slice(0,10))+'</text>';
  });
  if(series.length>1){
    series.forEach(function(s,si){
      g+='<g transform="translate('+(PL+si*88)+','+(H-8)+')"><rect width="9" height="9" y="-8" rx="2" fill="'+CHART_COLORS[si%5]+'"/><text x="13" font-size="10.5" fill="var(--ink-muted)" font-family="sans-serif">'+esc(s.name||('Series '+(si+1)))+'</text></g>';
    });
  }
  return '<svg viewBox="0 0 '+W+' '+(H+(series.length>1?10:0))+'" style="max-width:100%;height:auto;">'+g+'</svg>';
}
function pageImageFor(q){
  var pi=(APP.paper && APP.paper.pageImages)||{};
  return (q && q.page && pi[q.page])? pi[q.page] : null;
}
/* Is there a picture of this question on screen right now — its own crop or
   the page it came from? The wording under a blank option depends on it, and
   "could not be read" is the wrong thing to say when the question is sitting
   right there above it. */
function picShownFor(q){
  var paper=APP.paper||{};
  if(paper.figSources && q && paper.figSources[q.number]) return true;
  if(!pageImageFor(q)) return false;
  return !!(paper.pagesOnly || paper.maskedPages) || APP.screen!=='test';
}
/* Solved papers print the correct option on the page — a tick beside it, a
   "Chosen Option" box, often the next question too. Showing that page during a
   test hands over the answer, so it is only ever shown after submitting. */
function renderPageFallback(q){
  /* A paper built purely from page pictures has nowhere else to put the
     question \u2014 hiding the page during the test left a hundred blank screens,
     which is exactly what the review screen promises will not happen. Every
     other paper keeps the page hidden until submission, because a solved PDF
     prints the answer beside the question. */
  var paper=APP.paper||{};
  var safe=!!paper.maskedPages;              // the key has been taken off these
  if(APP.screen==='test' && !paper.pagesOnly && !safe) return '';
  var img=pageImageFor(q);
  if(!img) return '';
  return '<div class="figure-card" style="padding:8px;">'+
    '<img class="page-shot" src="data:image/jpeg;base64,'+img+'" alt="Page '+q.page+' of the paper" loading="lazy" decoding="async">'+
    '<div class="figure-cap">Page '+q.page+' as printed \u2014 pinch to zoom.'+
    (APP.screen==='test'? (safe? ' The ticks and crosses have been taken off.' : '')
                        : (safe? '' : ' It may show the marked answer.'))+'</div></div>';
}
/* The question's own patch of the page, cut out locally and with the printed
   answer taken off. This is the diagram — not an approximation of one — and it
   cost nothing to make. */
function renderCropFigure(q){
  var paper=APP.paper;
  if(!paper || !paper.figSources) return '';
  var img=paper.figSources[q.number];
  if(!img) return '';
  return '<div class="figure-card" style="padding:8px;">'+
    '<img class="page-shot" src="data:image/jpeg;base64,'+img+'" alt="Question '+q.number+' as printed" loading="lazy" decoding="async">'+
    '<div class="figure-cap">As printed on page '+(q.page||'?')+' \u2014 pinch to zoom.</div></div>';
}
function renderFigure(q){
  if(!q.figure){
    /* Before anything else: if this question's own crop is here, that IS the
       diagram, and it is better than any redrawing of it. */
    var crop=renderCropFigure(q);
    if(crop) return crop;
    var shot=renderPageFallback(q);
    if(q.needsFigure && !q.figureDone){
      /* Never during the paper. Waiting on a redraw with the clock running is
         the last thing anyone needs, so drawing happens before or after. */
      var duringTest=(APP.screen==='test');
      if(duringTest){
        if(shot) return shot;      // a page-picture paper: the page IS the question
        return '<div class="figure-card"><p class="muted" style="margin:6px 0;">'+
          'This question\u2019s diagram wasn\u2019t drawn, so it can\u2019t be shown here. '+
          (pageImageFor(q)? 'The page it came from prints the answer, so it stays hidden until you submit.' : '')+
          '</p><p class="tiny">Skip it, or mark it for review.</p></div>';
      }
      return (shot||'')+
        (shot? '' : '<div class="figure-card"><p class="muted" style="margin:6px 0;">No diagram and no page picture for this one.</p></div>')+
        ((!duringTest && canFetchAnswers())
          ? '<button class="btn btn-secondary btn-sm fig-regen" data-action="regen-figure" data-qnum="'+q.number+'" style="margin-top:8px;">'+ICON.refresh+' Draw it properly</button>'
          : '');
    }
    return shot;
  }
  var f=q.figure, inner='';
  if(f.kind==='svg') inner=f.svg;
  else if(f.kind==='chart') inner=svgChart(f);
  else if(f.kind==='table'){
    inner='<table class="fig-table"><thead><tr>'+(f.headers||[]).map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
      (f.rows||[]).map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>'; }).join('')+'</tbody></table>';
  }
  return '<div class="figure-card" style="color:var(--ink);">'+inner+
    (f.caption?'<div class="figure-cap">'+esc(f.caption)+'</div>':'')+'</div>';
}
function renderPassage(q,forceOpen){
  if(!q.passageId || !APP.paper.passages) return '';
  var p=APP.paper.passages[q.passageId];
  if(!p) return '';
  var open = forceOpen || APP.passageOpen[q.passageId]!==false;

    (open? '<div class="passage-body">'+esc(p.text)+'</div>':'')+
    '</div>';
}

function sparkline(scores,max){
  if(!scores || scores.length<2) return '';

  return '<div class="spark" aria-hidden="true">'+scores.slice(-10).map(function(v){
    var hgt=Math.max(2,Math.round((Math.max(v,0)/(top||1))*24));
    return '<i class="'+(v===best?'best':'')+'" style="height:'+hgt+'px;"></i>';
  }).join('')+'</div>';
}

function maskKey(k){
  if(!k) return '';
  if(k.length<=10) return k.slice(0,3)+'\u2026';
  return k.slice(0,6)+'\u2026'+k.slice(-4);
}
