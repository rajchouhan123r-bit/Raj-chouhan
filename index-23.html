function renderResultsUnscored(){
  var paper=APP.paper, attempt=APP.attempt;
  /* The questions actually sat, not the whole paper — a section drill was
     reporting eighty untouched questions as "left blank". */
  var qsSat=attemptQs(attempt);
  var secsSat=attemptSections(attempt);
  var total=qsSat.length;
  var answered=0, blank=0, marked=0, timeTotal=0;
  var bySec={};
  secsSat.forEach(function(s){ bySec[s.name]={answered:0,total:0,timeMs:0}; });
  qsSat.forEach(function(q){
    var sec=sectionForNumber(paper.sections,q.number);
    if(!bySec[sec]) bySec[sec]={answered:0,total:0,timeMs:0};
    var t=(attempt.timePerQ||{})[q.number]||0;
    bySec[sec].total++; bySec[sec].timeMs+=t; timeTotal+=t;
    if((attempt.responses||{})[q.number]){ answered++; bySec[sec].answered++; } else blank++;
    if(((attempt.status||{})[q.number]||'').indexOf('marked')>=0) marked++;
  });
  var kf=APP.keyFill;
  var h='<div class="top-header"><button class="icon-btn" data-action="go-home" aria-label="Back">'+ICON.chevL+'</button>'+
        '<div class="row"><button class="icon-btn" data-action="go-settings" aria-label="Answer settings">'+ICON.gear+'</button>'+viewToggleBtn()+themeToggleBtn()+'</div></div>';
  h+='<div class="container stagger">';
  h+='<div class="score-hero"><p class="eyebrow">'+esc(paper.name)+'</p>'+
     '<div class="score-num" style="font-size:34px;">Not scored yet</div>'+
     '<p class="muted" style="margin-top:8px;">Paper finished and saved. This one had no answer key, so there is nothing to mark against yet.</p></div>';

  h+='<div class="card"><h3>Get the answers</h3>';
  if(kf && kf.running){
    h+='<p class="muted">'+esc(kf.engine||'The model')+' is working through the paper. It is paced to stay inside the free rate limit, so give it a couple of minutes.</p>'+
       '<div class="progress-track" style="margin:12px 0 6px;"><div class="progress-fill" id="keyfill-bar" style="width:'+pct(kf.done,kf.total)+'%;"></div></div>'+
       '<span class="tiny" id="keyfill-progress">'+kf.done+' of '+kf.total+' answered</span>';
  }else if(canFetchAnswers()){
    h+='<p class="muted">'+esc(engineName())+' will work out all '+total+' answers, then your score and a full breakdown appear here.</p>'+
       '<div style="height:10px"></div>'+
       '<button class="btn btn-primary btn-block" data-action="score-attempt">'+ICON.sparkle+' Answer the paper and score me</button>';
  }else{
    h+='<div class="notice notice-warn" style="margin-bottom:10px;">'+esc(whyNoAnswers())+'</div>'+
       '<button class="btn btn-secondary btn-block" data-action="go-settings">Open answer settings</button>';
  }
  if(kf && kf.error) h+='<p class="tiny" style="margin-top:8px;color:var(--danger);">'+esc(kf.error)+'</p>';
  h+='<details style="margin-top:14px;"><summary style="cursor:pointer;font-weight:600;font-size:13.5px;color:var(--govt-blue);">Or type the key in yourself</summary>'+
     '<p class="tiny" style="margin-top:8px;">Accepts "1-A 2-C 3-B", one letter per question in order, or a key code. The paper is already done, so this is just marking.</p>'+
     '<textarea id="manual-key-input" rows="4" placeholder="1-A 2-C 3-B \u2026"></textarea>'+
     '<div style="height:8px"></div>'+
     '<button class="btn btn-secondary btn-block" data-action="apply-pasted-key">Load this key and score me</button></details>';
  h+='</div>';

  h+='<div class="stat-row">'+
     '<div class="stat"><div class="stat-val">'+answered+'</div><div class="muted">Answered</div></div>'+
     '<div class="stat"><div class="stat-val">'+blank+'</div><div class="muted">Left blank</div></div>'+
     '<div class="stat"><div class="stat-val">'+marked+'</div><div class="muted">Marked</div></div>'+
     '</div>';
  h+='<div class="kpi-grid">'+
     '<div class="kpi"><div class="kpi-val">'+fmtDur(attempt.elapsedMs||0)+'</div><div class="kpi-lab">Of '+attempt.durationMinutes+' minutes used</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+fmtDur(answered? timeTotal/answered : 0)+'</div><div class="kpi-lab">Average on an answered question</div></div>'+
     '</div>';

  h+='<div class="card"><h3>Section by section</h3><table class="sec-table"><thead><tr>'+
     '<th>Section</th><th class="num">Answered</th><th class="num">Blank</th><th class="num">Time</th></tr></thead><tbody>';
  secsSat.forEach(function(sc){
    var b=bySec[sc.name]||{answered:0,total:0,timeMs:0};
    h+='<tr class="'+secClass(sc.name)+'"><td style="font-weight:600;"><span class="sec-icon">'+secIcon(sc.name)+'</span>'+esc(shortSec(sc.name))+'</td><td class="num">'+b.answered+'</td>'+
       '<td class="num">'+(b.total-b.answered)+'</td><td class="num">'+fmtDur(b.timeMs)+'</td></tr>';
  });
  h+='</tbody></table></div>';

  h+='<div class="card card-flat"><h3>What you picked</h3><table class="review-table"><thead><tr><th>Q#</th><th>Your answer</th><th class="num">Time</th></tr></thead><tbody>';
  qsSat.forEach(function(q){
    var r=(attempt.responses||{})[q.number];
    h+='<tr><td>'+q.number+'</td><td><span class="ans-pill neutral">'+(r||'\u2014')+'</span></td>'+
       '<td class="num">'+fmtDur((attempt.timePerQ||{})[q.number]||0)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<button class="btn btn-secondary btn-block" data-action="save-summary">'+ICON.download+' Save this attempt as a text file</button>'+
     '<div style="height:8px"></div><button class="btn btn-ghost btn-block" data-action="go-home">Back to papers</button>';
  h+='</div>';
  return h;
}

function renderResults(){
  var paper=APP.paper, attempt=APP.attempt;
  if(!keyCounts(paper).withKey) return renderResultsUnscored();
  var r=computeResults(paper,attempt);
  var insights=buildInsights(r,attempt,paper);
  var showA=APP.showAnswers!==false;
  var checkedCount=Object.keys(attempt.revealed||{}).length;
  var used=attempt.elapsedMs||0;
  var h='<div class="top-header"><button class="icon-btn" data-action="go-home" aria-label="Back">'+ICON.chevL+'</button>'+
        '<div class="row"><button class="btn btn-secondary btn-sm" data-action="copy-summary">Copy summary</button>'+viewToggleBtn()+themeToggleBtn()+'</div></div>';
  h+='<div class="container stagger">';

  h+='<div class="score-hero"><p class="eyebrow">'+esc(paper.name)+'</p>'+
     (isPartial(attempt)? '<p class="tiny" style="margin-bottom:6px;">'+esc(modeLabel(attempt.mode,attempt.modeArg))+' \u00b7 '+attemptQs(attempt).length+' questions</p>':'')+
     '<div class="score-num"><span id="score-count" data-target="'+r.score+'">0</span><span class="score-den"> / '+r.maxScore+'</span></div>'+
     '<p class="muted" style="margin-top:6px;">'+pct(Math.max(r.score,0),r.maxScore)+'% of the paper \u00b7 '+fmtDur(used)+' of '+attempt.durationMinutes+' min used</p>'+
     (r.excluded? '<p class="tiny">'+r.excluded+' question(s) had no answer key and were left out of the total.</p>':'')+
     (checkedCount? '<p class="tiny">Practice mode \u2014 you checked '+checkedCount+' answer(s) while the clock was running.</p>':'')+
     (isPersonalBest(r)? '<div class="best-badge" style="margin-top:8px;"><span class="pill good">'+ICON.sparkle+' Personal best</span></div>':'')+
     (APP.prevRecord? '<p class="muted" style="margin-top:2px;">Last time: '+num(APP.prevRecord.score)+' \u00b7 <span class="'+(r.score>=APP.prevRecord.score?'delta-up':'delta-down')+'">'+(r.score>=APP.prevRecord.score?'+':'\u2212')+num(Math.abs(r.score-APP.prevRecord.score))+'</span></p>':'')+
     '</div>';

  var totalMarksMoved=r.gained+r.lost||1;
  var unver=unverifiedCount(paper);
  if(unver>0){
    h+='<div class="notice notice-warn"><strong>'+unver+' of these answers were worked out by a model, not taken from an official key.</strong> '+
       'They are marked in the review below. Check any that surprise you \u2014 correcting one keeps it corrected and re-marks this attempt.</div>';
  }
  if(r.excluded>0){
    var kfp=APP.keyFill;
    h+='<div class="notice notice-warn">'+r.excluded+' question(s) have no answer key, so they sit outside this score. '+
       (kfp && kfp.running
         ? '<div class="progress-track" style="margin:10px 0 6px;"><div class="progress-fill" id="keyfill-bar" style="width:'+pct(kfp.done,kfp.total)+'%;"></div></div><span class="tiny" id="keyfill-progress">'+kfp.done+' of '+kfp.total+' answered</span>'
         : (canFetchAnswers()
            ? '<div style="height:8px"></div><button class="btn btn-secondary btn-sm" data-action="score-attempt">'+ICON.sparkle+' Fill them in with '+engineName()+'</button>'
            : '<p class="tiny" style="margin:8px 0 0;">'+esc(whyNoAnswers())+'</p>'))+
       '</div>';
  }
  h+='<div class="card"><h3>Where the marks went</h3>'+
     '<div class="meter" style="height:14px;">'+
     '<span style="width:'+(r.gained/totalMarksMoved*100)+'%;background:var(--success);"></span>'+
     '<span style="width:'+(r.lost/totalMarksMoved*100)+'%;background:var(--danger);"></span></div>'+
     '<div class="row-between" style="margin-top:8px;"><span class="tiny">Earned +'+num(r.gained)+'</span>'+
     '<span class="tiny">Lost to negative marking &minus;'+num(r.lost)+'</span></div>'+
     (r.lost>0? '<p class="muted" style="margin-top:10px;">Skipping every wrong answer instead would have scored '+num(r.gained)+'.</p>':'')+
     '</div>';

  h+='<div class="stat-row">'+
     '<div class="stat"><div><span class="stat-dot" style="background:var(--answered);"></span></div><div class="stat-val">'+r.correct+'</div><div class="muted">Correct</div></div>'+
     '<div class="stat"><div><span class="stat-dot" style="background:var(--not-answered);"></span></div><div class="stat-val">'+r.wrong+'</div><div class="muted">Wrong</div></div>'+
     '<div class="stat"><div><span class="stat-dot" style="background:var(--not-visited);"></span></div><div class="stat-val">'+r.unattempted+'</div><div class="muted">Skipped</div></div>'+
     '</div>';

  h+='<div class="kpi-grid">'+
     '<div class="kpi"><div class="kpi-val">'+r.accuracy+'%</div><div class="kpi-lab">Accuracy on '+r.attempted+' attempts</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+r.attemptRate+'%</div><div class="kpi-lab">Of the paper attempted</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+fmtDur(r.avgAttempted)+'</div><div class="kpi-lab">Average on a question you answered</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+fmtDur(r.timeSkipped)+'</div><div class="kpi-lab">Spent on ones you then skipped</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+r.unseen+'</div><div class="kpi-lab">Never opened</div></div>'+
     '<div class="kpi"><div class="kpi-val">'+fmtDur(attempt.pausedMs||0)+'</div><div class="kpi-lab">Paused ('+(attempt.pauseCount||0)+'\u00d7)'+((attempt.awayMs||0)>2000? ' &middot; away '+fmtDur(attempt.awayMs):'')+'</div></div>'+
     '</div>';

  /* Only the sections this attempt actually covered. A twelve-question drill
     was printing three empty rows for the sections it never touched. */
  var resultSections=attemptSections(attempt);
  /* What each section was given, where it ran on its own clock. Time spent
     against time allowed is the whole point of practising sectionally. */
  var allot=(attempt.sectional && attempt.secMs)? attempt.secMs : {};
  h+='<div class="card"><h3>Section by section</h3><table class="sec-table"><thead><tr>'+
     '<th>Section</th><th class="num">R</th><th class="num">W</th><th class="num">Skip</th><th class="num">Acc</th><th class="num">Time</th><th class="num">Score</th></tr></thead><tbody>';
  resultSections.forEach(function(s){
    var b=r.bySection[s.name]||{correct:0,wrong:0,unattempted:0,score:0,timeMs:0};
    var acc=pct(b.correct,b.correct+b.wrong);
    h+='<tr class="'+secClass(s.name)+'"><td><div style="font-weight:600;"><span class="sec-icon">'+secIcon(s.name)+'</span>'+esc(s.name)+'</div>'+hbar(Math.max(b.score,0),b.total*MARK_CORRECT,secColorOf(s.name))+'</td>'+
       '<td class="num">'+b.correct+'</td><td class="num">'+b.wrong+'</td><td class="num">'+b.unattempted+'</td>'+
       '<td class="num">'+acc+'%</td><td class="num">'+fmtDur(b.timeMs)+
       (allot[s.name]? '<div class="tiny">of '+fmtMinutes(Math.round(allot[s.name]/60000))+'</div>':'')+'</td>'+
       '<td class="num" style="font-weight:700;">'+num(b.score)+'</td></tr>';
  });
  h+='</tbody></table>'+
     (Object.keys(allot).length
       ? '<p class="tiny" style="margin-top:8px;">Each section ran on its own clock. '+
         resultSections.filter(function(s){ return allot[s.name] && (r.bySection[s.name]||{timeMs:0}).timeMs < allot[s.name]*0.75; })
           .map(function(s){ return esc(shortSec(s.name))+' finished with '+esc(fmtDur(allot[s.name]-(r.bySection[s.name]||{timeMs:0}).timeMs))+' unspent'; }).join('; ')+
         '.</p>'
       : '')+
     '</div>';

  var secNames=resultSections.map(function(s){return s.name;});
  h+='<div class="card"><h3>Time spent per section</h3>'+
     svgChart({chartType:'bar',labels:uniqueShortSecs(secNames),
       barColors:secNames.map(secColorOf),
       series:[{name:'Minutes',values:secNames.map(function(n){ return Math.round(((r.bySection[n]||{timeMs:0}).timeMs/60000)*10)/10; })}]})+
     '<p class="muted" style="margin-top:6px;">Right answers averaged '+fmtDur(r.avgCorrect)+'; wrong ones '+fmtDur(r.avgWrong)+'.</p></div>';

  var topics=Object.keys(r.byTopic).map(function(n){ var b=r.byTopic[n]; return {name:n,b:b,acc:pct(b.correct,b.correct+b.wrong),att:b.correct+b.wrong}; })
    .filter(function(t){return t.b.total>0;}).sort(function(a,b){return (a.acc-b.acc)||(b.b.total-a.b.total);});
  if(topics.length>1){
    h+='<div class="card"><h3>Topic breakdown</h3><table class="sec-table"><thead><tr><th>Topic</th><th class="num">Asked</th><th class="num">Right</th><th class="num">Accuracy</th></tr></thead><tbody>';
    topics.slice(0,14).forEach(function(t){
      var color = t.acc>=70?'var(--success)':(t.acc>=45?'var(--brass)':'var(--danger)');
      h+='<tr><td>'+esc(t.name)+'</td><td class="num">'+t.b.total+'</td><td class="num">'+t.b.correct+'</td>'+
         '<td class="num" style="color:'+color+';font-weight:700;">'+(t.att?t.acc+'%':'\u2014')+'</td></tr>';
    });
    h+='</tbody></table><p class="tiny" style="margin-top:8px;">Sorted weakest first.</p></div>';
  }

  h+='<div class="card"><h3>What this attempt is telling you</h3>';
  insights.forEach(function(i){
    var ch=i.k==='good'?'\u2713':(i.k==='bad'?'!':'\u2022');
    h+='<div class="insight"><div class="insight-ic '+i.k+'">'+ch+'</div><div class="insight-txt">'+esc(i.t)+'</div></div>';
  });
  h+='</div>';

  if(r.slowest.length){
    h+='<div class="card"><h3>Longest five questions</h3><table class="sec-table"><tbody>';
    r.slowest.forEach(function(i){
      h+='<tr><td style="width:44px;font-weight:700;">Q'+i.q.number+'</td><td class="tiny">'+esc(i.topic)+'</td>'+
         '<td class="num">'+fmtDur(i.time)+'</td><td class="num">'+
         (i.outcome==='correct'?'<span class="ans-pill ok">right</span>':(i.outcome==='wrong'?'<span class="ans-pill bad">wrong</span>':'<span class="ans-pill neutral">skipped</span>'))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(APP.history && APP.history.length>1){
    h+='<div class="card"><h3>Your attempts at this paper</h3>';
    APP.history.slice().reverse().slice(0,6).forEach(function(rec,i){
      h+='<div class="hist-row"><span class="hist-score">'+num(rec.score)+'</span>'+
         '<span class="tiny" style="flex:1;">'+fmtDate(rec.finishedAt)+' &middot; '+rec.correct+'R '+rec.wrong+'W '+rec.unattempted+'S &middot; '+rec.accuracy+'% &middot; '+fmtDur(rec.elapsedMs)+'</span>'+
         (i===0?'<span class="pill live">latest</span>':'')+'</div>';
    });
    h+='</div>';
  }

  var filters=[['all','All '+paper.questions.length],['wrong','Wrong '+r.wrong],['skip','Skipped '+r.unattempted],['marked','Marked'],['slow','Over 90s']];
  h+='<h3 style="margin-top:18px;">Question review</h3>'+
     '<div class="row" style="margin-bottom:10px;">'+
     '<button class="btn btn-secondary btn-sm" data-action="toggle-show-answers" style="flex:1.7;">'+(showA?'Hide the answers':'Show the answers')+'</button>'+
     '<button class="btn btn-secondary btn-sm" data-action="expand-all-answers" style="flex:1;">Open all</button>'+
     '<button class="btn btn-secondary btn-sm" data-action="collapse-all-answers" style="flex:1;">Close all</button>'+
     '</div>'+
     '<p class="tiny" style="margin-bottom:10px;">'+(showA
        ? 'Tap any question to see the correct option and the working.'
        : 'Answers are hidden. You still see what you picked and whether it was right \u2014 useful before a retake.')+'</p>'+
     '<div class="chips">';
  filters.forEach(function(f){
    h+='<button class="chip'+(APP.reviewFilter===f[0]?' active':'')+'" data-action="set-filter" data-filter="'+f[0]+'">'+esc(f[1])+'</button>';
  });
  h+='</div><div class="card card-flat">';
  /* Only a slice is built at a time. Rendering all 100 with their figures on
     every filter tap is what made this screen crawl on a phone. */
  var matching=r.items.filter(function(it){
    if(APP.reviewFilter==='wrong') return it.outcome==='wrong';
    if(APP.reviewFilter==='skip') return it.outcome==='skip';
    if(APP.reviewFilter==='marked') return it.status.indexOf('marked')>=0;
    if(APP.reviewFilter==='slow') return it.time>90000;
    return true;
  });
  var limit=APP.reviewLimit||25;
  var shown=0;
  matching.slice(0,limit).forEach(function(it){
    var q=it.q;
    shown++;
    var icon = it.outcome==='correct'?'ok':(it.outcome==='wrong'?'bad':'skip');
    var iconChar = it.outcome==='correct'?'\u2713':(it.outcome==='wrong'?'\u2715':'\u2013');
    var open=!!APP.openDetails[q.number];
    h+='<div class="review-item"><div class="row" data-action="toggle-answer-detail" data-qnum="'+q.number+'" role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'" style="cursor:pointer;">'+
       '<div class="result-icon '+icon+'">'+iconChar+'</div>'+
       '<div style="flex:1;min-width:0;"><div class="qtext-trunc" style="max-width:100%;">Q'+q.number+'. '+(q.text?esc(q.text):'Diagram question')+'</div>'+
       '<div class="tiny">'+esc(it.topic)+' \u00b7 '+fmtDur(it.time)+
       (showA && q.correct && !sourceMeta(q.source).trusted? '<span class="unverified-dot" title="Worked out by a model"></span>':'')+'</div></div>'+
       '<div class="tiny">'+(it.resp||'\u2014')+'</div></div>';
    /* Built only when it is open. Every collapsed row used to carry its whole
       body \u2014 passage, redrawn figure, four options, the lot \u2014 assembled and
       parsed just to be hidden, which is what made each filter tap on a
       finished paper crawl. */
    if(!open){ h+='</div>'; return; }
    h+='<div class="review-detail" id="detail-'+q.number+'">'+
       renderPassage(q,true)+renderFigure(q)+
       '<div style="font-family:var(--serif);">'+esc(q.text||'')+'</div>'+
       '<div style="margin-top:8px;">'+q.options.map(function(o,i){
          var L=LETTERS[i];
          var cls = (showA && q.correct===L)?'ok':(it.resp===L?'bad':'neutral');
          var body = q.optionFigures[i]? '<span class="option-fig" style="display:inline-block;width:90px;vertical-align:middle;color:var(--ink);">'+q.optionFigures[i]+'</span>' : esc(o);
          return '<div style="margin:4px 0;font-size:13.5px;"><span class="ans-pill '+cls+'">'+L+'</span> '+body+'</div>';
        }).join('')+'</div>'+
       '<div style="margin-top:10px;font-size:13px;">Your answer <strong>'+(it.resp||'none')+'</strong> \u00b7 correct <strong>'+(showA?(q.correct||'not set'):'hidden')+'</strong> \u00b7 '+fmtDur(it.time)+'</div>'+
       (prevAnswerLine(q,it)||'')+
       (showA && q.explanation? '<div style="margin-top:6px;font-size:13px;color:var(--ink-muted);">'+esc(q.explanation)+'</div>':'')+
       (showA? '<div style="margin-top:10px;">'+sourceBadge(q)+'</div>'+
               (sourceMeta(q.source).trusted? '' :
                 '<div class="fix-row"><span class="tiny" style="width:100%;">Disagree? Set the real answer and it stays set:</span>'+
                 LETTERS.map(function(L){
                   return '<button class="fix-btn'+(q.correct===L?' is-current':'')+'" data-action="fix-answer" data-qnum="'+q.number+'" data-letter="'+L+'">'+L+'</button>';
                 }).join('')+'</div>')
             : '')+
       '</div></div>';
  });
  if(!shown) h+='<p class="muted" style="text-align:center;padding:14px 0;">Nothing in this filter.</p>';
  h+='</div>';
  if(matching.length>shown){
    h+='<button class="btn btn-secondary btn-block" data-action="show-more-review" style="margin-top:10px;">Show 25 more ('+(matching.length-shown)+' left)</button>';
  }

  h+='<div style="height:12px"></div><button class="btn btn-primary btn-block" data-action="retake-paper">Retake this paper</button>'+
     '<div style="height:8px"></div><button class="btn btn-secondary btn-block" data-action="save-summary">'+ICON.download+' Save this result as a text file</button>'+
     '<div style="height:8px"></div><button class="btn btn-ghost btn-block" data-action="go-home">Back to papers</button>';
  h+='</div>';
  return h;
}
function summaryText(){
  var paper=APP.paper;
  if(!keyCounts(paper).withKey){
    var a=APP.attempt, lines=[paper.name,'Attempt finished '+fmtDate(a.finishedAt||Date.now())+' — not scored, no answer key yet',
      'Time '+fmtDur(a.elapsedMs||0)+' of '+a.durationMinutes+' min',''];
    paper.questions.forEach(function(q){ lines.push('Q'+q.number+': '+((a.responses||{})[q.number]||'-')); });
    return lines.join('\n');
  }
  var r=computeResults(paper,APP.attempt);
  var lines=[paper.name,
    'Attempted on '+fmtDate(APP.attempt.finishedAt||Date.now()),
    'Score '+num(r.score)+'/'+r.maxScore+'  |  '+r.correct+'R '+r.wrong+'W '+r.unattempted+'S',
    'Accuracy '+r.accuracy+'%  |  Attempted '+r.attemptRate+'%  |  Never opened '+r.unseen,
    'Time '+fmtDur(APP.attempt.elapsedMs||0)+' of '+APP.attempt.durationMinutes+' min  |  Paused '+fmtDur(APP.attempt.pausedMs||0),''];
  paper.sections.forEach(function(s){
    var b=r.bySection[s.name]||{};
    lines.push(s.name+': '+num(b.score||0)+'  ('+(b.correct||0)+'R/'+(b.wrong||0)+'W/'+(b.unattempted||0)+'S, '+fmtDur(b.timeMs||0)+')');
  });
  if(APP.prevRecord) lines.push('','Previous attempt: '+num(APP.prevRecord.score)+'  (change '+(r.score>=APP.prevRecord.score?'+':'-')+num(Math.abs(r.score-APP.prevRecord.score))+')');
  var wrongs=r.items.filter(function(i){return i.outcome==='wrong';}).map(function(i){return 'Q'+i.q.number+' (you '+i.resp+', key '+i.q.correct+')'+(i.topic&&i.topic!=='Untagged'?' - '+i.topic:'');});
  if(wrongs.length) lines.push('','Wrong: ',wrongs.join('\n'));
  return lines.join('\n');
}

/* ============ ASKING ANDROID FOR PERMANENT STORAGE ============
   Installed apps can ask the system to mark their storage as permanent, so it
   is never cleared to reclaim space. This is the one real "grant" available,
   and it is the difference between losing an attempt and keeping it forever. */
var STORAGE_STATE={persisted:null,quotaMB:null,usedMB:null};
async function checkStoragePersistence(){
  try{
    if(navigator.storage && navigator.storage.persisted){
      STORAGE_STATE.persisted=await navigator.storage.persisted();
    }
    if(navigator.storage && navigator.storage.estimate){
      var est=await navigator.storage.estimate();
      if(est){
        STORAGE_STATE.quotaMB=est.quota? Math.round(est.quota/1048576) : null;
        STORAGE_STATE.usedMB=est.usage? Math.round(est.usage/1048576*10)/10 : null;
      }
    }
  }catch(e){}
  return STORAGE_STATE;
}
async function requestPersistence(silent){
  try{
    if(!navigator.storage || !navigator.storage.persist){
      if(!silent) toast('This browser can\u2019t make storage permanent.');
      return false;
    }
    var already=await navigator.storage.persisted();
    if(already){ STORAGE_STATE.persisted=true; if(!silent) toast('Storage is already permanent.'); return true; }
    var granted=await navigator.storage.persist();
    STORAGE_STATE.persisted=granted;
    if(!silent){
      toast(granted? 'Granted \u2014 your papers and scores can no longer be cleared automatically.'
                   : 'Android said no for now. It usually grants this once the app is installed and used a few times.');
    }
    return granted;
  }catch(e){ return false; }
}
function renderStorageGrant(){
  var st=STORAGE_STATE;
  if(st.persisted===null) return '';
  var quota=st.quotaMB? (' \u00b7 '+(st.usedMB||0)+' MB used of about '+st.quotaMB+' MB available') : '';
  if(st.persisted){
    return '<div class="card"><h3>Storage permission</h3>'+
      '<p class="muted"><span class="status-dot on"></span>Permanent. Android will not clear your papers or scores to reclaim space.'+esc(quota)+'</p></div>';
  }
  return '<div class="card"><h3>Storage permission</h3>'+
    '<p class="muted" style="margin-bottom:10px;"><span class="status-dot off"></span>Not permanent yet. Android may clear this app\u2019s data if the phone runs low on space.'+esc(quota)+'</p>'+
    '<button class="btn btn-secondary btn-block" data-action="request-persist">Ask Android to keep it permanently</button>'+
    '<p class="tiny" style="margin-top:8px;">Granted more readily once the app is installed to your home screen.</p></div>';
}

/* ============ WHERE IS THIS RUNNING ============
   The same code behaves very differently depending on how it was opened, and
   pretending otherwise just leaves people tapping a button that cannot work.
   A preview pane inside another app has no file picker at all. */
function hostKind(){
  var proto=location.protocol;
  var framed=false;
  try{ framed = window.top !== window.self; }catch(e){ framed=true; }  // cross-origin frame
  if(framed || proto==='blob:' || proto==='data:' || proto==='about:') return 'preview';
  if(proto==='content:') return 'downloads';
  if(proto==='file:') return 'file';
  return 'hosted';
}
function hostNote(){
  switch(hostKind()){
    case 'preview': return {
      title:'Opened inside another app',
      body:'This is a preview pane, not a browser tab. It has no file picker, so nothing happens when you tap Browse \u2014 there is no bug to fix. Paste the paper text below instead, or open the file properly in Chrome.'
    };
    case 'downloads': return {
      title:'Opened from the Downloads list',
      body:'Chrome gives this a content:// address, which blocks requests to Google and hands out storage that gets wiped. The picker is unreliable here too.'
    };
    case 'file': return {
      title:'Opened as a local file',
      body:'Browsers block local files from making outside requests, so answers cannot be fetched. Everything offline still works.'
    };
    default: return null;
  }
}
function pickerLikelyWorks(){ return hostKind()!=='preview'; }

/* ============ PAPER FILES ============
   A paper file (.json) carries the questions, the key and the drawn figures.
   Loading one needs no internet and no model call, which is the whole point:
   new sets can be dropped into this same app offline. */
function sanitizeFigure(f){
  if(!f || typeof f!=='object') return null;
  if(f.kind==='svg'){
    var clean=sanitizeSvg(f.svg);
    return clean? {kind:'svg',svg:clean,caption:String(f.caption||'')} : null;
  }
  if(f.kind==='table' && Array.isArray(f.rows)){
    return {kind:'table',headers:(f.headers||[]).map(String),
      rows:f.rows.map(function(r){return (r||[]).map(String);}),caption:String(f.caption||'')};
  }
  if(f.kind==='chart' && Array.isArray(f.series)){
    return {kind:'chart',chartType:(['bar','line','pie'].indexOf(f.chartType)>-1?f.chartType:'bar'),
      labels:(f.labels||[]).map(String),
      series:f.series.map(function(x){return {name:String(x&&x.name||''),values:((x&&x.values)||[]).map(Number)};}),
      caption:String(f.caption||'')};
  }
  return null;
}
/* ============ READING ANY JSON ============
   The importer below wants one exact shape: {questions:[{text,options,correct}]}.
   Every question bank on the internet has its own, and a key costs requests you
   may not have — so a file you already own should never need one. This layer
   sits in front and reshapes whatever it is handed.

   It handles the shapes these files actually come in:
     the array anywhere in the tree, not just at obj.questions
     {data:{...}}, {result:{...}}, {quiz:{...}}, or a bare top-level array
     {sections:[{name,questions:[...]}]}, flattened with the section names kept
     options as strings, as objects, as an {A:..,B:..} map, or as a/b/c/d keys
     answers as a letter, an index (0- or 1-based), the option's own text, an
       id matching an option, or an isCorrect flag on the option itself
     a separate answer key: {answers:{1:"A"}} or [{q:1,ans:"C"}]
     HTML in the text, which is stripped rather than shown as tags

   Nothing here guesses silently: it returns a report of what it found and what
   it could not, and that is shown before anything is saved. */

function stripHtml(v){
  var t=String(v==null? '' : v);
  if(t.indexOf('<')<0 && t.indexOf('&')<0) return t.trim();
  t=t.replace(/<\s*br\s*\/?\s*>/gi,'\n')
     .replace(/<\s*\/\s*(p|div|li|tr|h[1-6])\s*>/gi,'\n')
     .replace(/<[^>]*>/g,' ');
  var d=document.createElement('textarea');
  d.innerHTML=t;
  t=d.value;
  return t.replace(/[ \t ]+/g,' ')
          /* "<b>5x5</b>?" leaves a space in front of the question mark, and a
             paper full of "What is this ?" reads as broken even though every
             word in it is right. */
          .replace(/ +([,.;:!?%)\]}])/g,'$1')
          .replace(/([(\[{]) +/g,'$1')
          .replace(/ +\n/g,'\n').replace(/\n +/g,'\n')
          .replace(/\n{3,}/g,'\n\n').trim();
}
function hasImgTag(v){ return /<\s*img\b/i.test(String(v==null?'':v)); }
/* Case- and separator-insensitive: question_text, questionText and QuestionText
   are one name as far as this is concerned. */
function keyOf(o,names){
  if(!o || typeof o!=='object') return null;
  var flat={};
  Object.keys(o).forEach(function(k){ flat[k.toLowerCase().replace(/[^a-z0-9]/g,'')]=k; });
  for(var i=0;i<names.length;i++){
    var want=names[i].toLowerCase().replace(/[^a-z0-9]/g,'');
    if(flat[want]!==undefined) return flat[want];
  }
  return null;
}
function valOf(o,names){
  var k=keyOf(o,names);
  return k==null? undefined : o[k];
}
var Q_TEXT   =['text','question','questiontext','questionTitle','q','stem','title','ques','problem','body','content','questionbody','question_en','questionname'];
var Q_OPTS   =['options','choices','opts','alternatives','optionlist','answers','answeroptions','choiceList','option'];
var Q_ANS    =['correct','answer','correctanswer','correctoption','correct_option','ans','answerkey','rightanswer','right','key','solution','correctindex','answerindex','correctans','correctchoice','answerid','correctoptionid'];
var Q_EXPL   =['explanation','solution','reason','answerdescription','explain','sol','description','rationale','hint'];
var Q_SEC    =['section','sectionname','subject','category','part','subjectname','paper','group'];
var Q_TOPIC  =['topic','tag','chapter','subtopic','concept','skill'];
var Q_NUM    =['number','num','qno','qnum','questionnumber','serial','index','position','sno','id'];
var Q_PASS   =['passage','comprehension','paragraph','context','directions','casestudy'];
var OPT_TEXT =['text','option','value','label','title','answer','content','name','optiontext','desc'];
var OPT_ID   =['id','key','option_id','optionid','code','letter','slot'];
var OPT_OK   =['iscorrect','correct','isright','right','isanswer','answer','is_correct'];

/* Does this object look like a question? Scored rather than tested, because
   almost every field is optional in some bank or other. */
function questionish(o){
  /* A bank exported from a spreadsheet arrives as rows: the question, then its
     options, then the answer. No field names at all, so it is recognised by
     shape — a long-ish first cell followed by several short ones. */
  if(Array.isArray(o)){
    if(o.length<3 || o.length>8) return 0;
    var strs=o.filter(function(x){ return typeof x==='string' || typeof x==='number'; });
    if(strs.length<o.length) return 0;
    return String(o[0]).length>=8 ? 5 : 0;
  }
  if(!o || typeof o!=='object') return 0;
  var s=0;
  if(valOf(o,Q_TEXT)!==undefined) s+=3;
  var op=valOf(o,Q_OPTS);
  if(Array.isArray(op) && op.length>=2) s+=3;
  else if(op && typeof op==='object') s+=2;
  else if(keyOf(o,['a'])!==null && keyOf(o,['b'])!==null) s+=3;
  else if(keyOf(o,['option1'])!==null || keyOf(o,['optiona'])!==null || keyOf(o,['opt1'])!==null) s+=3;
  if(valOf(o,Q_ANS)!==undefined) s+=2;
  if(valOf(o,Q_EXPL)!==undefined) s+=1;
  return s;
}
/* The best candidate array anywhere in the tree. Depth-limited, because a deep
   walk over a large bank is the sort of thing that hangs a phone. */
function findQuestionArray(root){
  var best=null, bestScore=0;
  var seen=0;
  (function walk(node,depth,path){
    if(seen>4000 || depth>6 || !node || typeof node!=='object') return;
    seen++;
    if(Array.isArray(node)){
      if(node.length){
        var sample=node.slice(0,8);
        var tot=0, n=0;
        sample.forEach(function(x){ var q=questionish(x); if(q){ tot+=q; n++; } });
        if(n){
          /* Average fit, weighted by how much of the array fits and by size —
             a bank of 100 beats a stray array of 2 that scores the same. */
          var score=(tot/n)*(n/sample.length)*Math.min(3,1+Math.log10(node.length+1));
          if(score>bestScore){ bestScore=score; best={arr:node,path:path}; }
        }
      }
      node.slice(0,40).forEach(function(x,i){ walk(x,depth+1,path+'['+i+']'); });
      return;
    }
    Object.keys(node).forEach(function(k){ walk(node[k],depth+1,path? (path+'.'+k):k); });
  })(root,0,'');
  return best;
}
/* Sections that carry their own question lists get flattened, and each keeps
   its name so the section ranges below come out right. */
function flattenSections(root){
  var holder=null;
  ['sections','parts','subjects','papers','groups','categories'].some(function(k){
    var v=valOf(root,[k]);
    if(Array.isArray(v) && v.length && v.some(function(x){
      return x && typeof x==='object' && Array.isArray(valOf(x,['questions','items','mcqs','quiz','qs']));
    })){ holder=v; return true; }
    return false;
  });
  if(!holder) return null;
  var out=[];
  holder.forEach(function(sc){
    var name=stripHtml(valOf(sc,Q_SEC.concat(['name','title']))||'Section');
    var arr=valOf(sc,['questions','items','mcqs','quiz','qs'])||[];
    arr.forEach(function(q){
      if(!q || typeof q!=='object') return;
      var copy={};
      Object.keys(q).forEach(function(k){ copy[k]=q[k]; });
      if(valOf(copy,Q_SEC)===undefined) copy.__section=name;
      out.push(copy);
    });
  });
  return out.length? out : null;
}
/* Options, from whichever of the half-dozen shapes this file uses. Returns the
   texts and, if the file marks it there, which one is right. */
function readOptions(q){
  var texts=[], flagged=-1, ids=[];
  var raw=valOf(q,Q_OPTS);

  if(Array.isArray(raw)){
    raw.forEach(function(o,i){
      if(o==null) return;
      if(typeof o==='object'){
        var t=valOf(o,OPT_TEXT);
        if(t===undefined) t=Object.keys(o).length===1? o[Object.keys(o)[0]] : '';
        texts.push(stripHtml(t));
        ids.push(String(valOf(o,OPT_ID)!==undefined? valOf(o,OPT_ID) : i));
        var ok=valOf(o,OPT_OK);
        if(ok===true||ok===1||ok==='1'||ok==='true'||ok==='Y'||ok==='yes') flagged=texts.length-1;
      }else{
        texts.push(stripHtml(o));
        ids.push(String(i));
      }
    });
  }else if(raw && typeof raw==='object'){
    /* {A:"..",B:".."} or {"1":"..","2":".."} — key order decides the letters */
    Object.keys(raw).sort().forEach(function(k,i){
      texts.push(stripHtml(raw[k]));
      ids.push(String(k));
    });
  }
  if(!texts.length){
    /* a/b/c/d, option_a.., optionA.., opt1.., option1.., choice1.. */
    var sets=[['a','b','c','d'],['optiona','optionb','optionc','optiond'],
              ['option1','option2','option3','option4'],['opt1','opt2','opt3','opt4'],
              ['choice1','choice2','choice3','choice4'],['ans1','ans2','ans3','ans4']];
    for(var si=0; si<sets.length && !texts.length; si++){
      var got=[], allThere=true;
      sets[si].forEach(function(nm,i){
        var v=valOf(q,[nm]);
        if(v===undefined){ if(i<2) allThere=false; return; }
        got.push(stripHtml(v));
      });
      if(allThere && got.length>=2){ texts=got; ids=sets[si].slice(0,got.length); }
    }
  }
  return {texts:texts,flagged:flagged,ids:ids};
}
/* Which option is right, from whatever the file put in whichever field. */
function readAnswer(q,opts,zeroBased){
  if(opts.flagged>=0) return opts.flagged;
  var raw=valOf(q,Q_ANS);
  if(raw===undefined || raw===null || raw==='') return -1;
  if(typeof raw==='object'){
    /* {answer:{text:"..."}} or {answer:{id:2}} */
    var inner=valOf(raw,OPT_TEXT);
    if(inner===undefined) inner=valOf(raw,OPT_ID);
    raw=inner;
    if(raw===undefined) return -1;
  }
  if(Array.isArray(raw)) raw=raw.length? raw[0] : '';
  var t=stripHtml(raw);
  if(!t) return -1;

  /* a letter, however it is dressed: "A", "(b)", "Option C", "d." */
  var m=t.match(/^[\s(\[]*(?:option\s*)?([A-Za-z])[\s).\]]*$/);
  if(m){
    var idx='abcdefghij'.indexOf(m[1].toLowerCase());
    if(idx>=0 && idx<Math.max(4,opts.texts.length)) return idx;
  }
  /* a number: 1-based unless the file uses 0 anywhere */
  if(/^\d+$/.test(t)){
    var n=Number(t);
    var i0=zeroBased? n : n-1;
    if(i0>=0 && i0<opts.texts.length) return i0;
  }
  /* an id that matches one of the options */
  for(var j=0;j<opts.ids.length;j++){ if(opts.ids[j]===t) return j; }
  /* the option's own text, exactly or near enough */
  var norm=function(x){ return String(x).toLowerCase().replace(/\s+/g,' ').replace(/[^a-z0-9 ]/g,'').trim(); };
  var nt=norm(t);
  for(var k=0;k<opts.texts.length;k++){ if(norm(opts.texts[k])===nt && nt) return k; }
  for(var k2=0;k2<opts.texts.length;k2++){
    var no=norm(opts.texts[k2]);
    if(no && nt && (no.indexOf(nt)===0 || nt.indexOf(no)===0)) return k2;
  }
  return -1;
}
/* A key kept away from the questions: {answers:{1:"A"}}, [{q:1,ans:"C"}],
   or a plain ["A","C","B",...] the same length as the paper. */
function readLooseKey(root,count){
  var out={};
  var cand=valOf(root,['answers','answerkey','answer_key','key','solutions','keys']);
  if(cand===undefined) return out;
  if(Array.isArray(cand)){
    if(cand.length && typeof cand[0]!=='object' && cand.length>=Math.min(4,count)){
      cand.forEach(function(v,i){ out[i+1]=stripHtml(v); });
      return out;
    }
    cand.forEach(function(o){
      if(!o || typeof o!=='object') return;
      var n=Number(stripHtml(valOf(o,Q_NUM)));
      var a=valOf(o,Q_ANS);
      if(n>=1 && a!==undefined) out[n]=stripHtml(a);
    });
    return out;
  }
  if(typeof cand==='object'){
    Object.keys(cand).forEach(function(k){
      var n=Number(String(k).replace(/[^\d]/g,''));
      if(n>=1) out[n]=stripHtml(cand[k]);
    });
  }
  return out;
}

function adaptAnyJson(root,fallbackName){
  var report={source:'', found:0, withOptions:0, withAnswer:0, sections:[], notes:[], dropped:0};
  if(!root || typeof root!=='object') throw new Error('That file is not JSON I can read.');

  /* Already our own shape? Leave it entirely alone. */
  if(Array.isArray(root.questions) && root.questions.length &&
     root.questions[0] && Array.isArray(root.questions[0].options) && root.questions[0].text!==undefined){
    report.source='its own format';
    report.found=root.questions.length;
    report.native=true;
    return {obj:root,report:report};
  }

  var arr=flattenSections(root);
  if(arr) report.source='sections';
  if(!arr){
    if(Array.isArray(root)){ arr=root; report.source='a plain list'; }
    else{
      var hit=findQuestionArray(root);
      if(hit){ arr=hit.arr; report.source=hit.path? ('“'+hit.path+'”') : 'the file'; }
    }
  }
  if(!arr || !arr.length) throw new Error('I could not find any questions in that file. It should contain a list of questions, each with its text and its options.');

  /* Does the file count options from zero? One question doing so settles it for
     the whole file — mixing the two conventions inside one bank does not
     happen, and guessing per question would scatter wrong answers about. */
  var zeroBased=false;
  arr.slice(0,200).forEach(function(q){
    if(!q || typeof q!=='object') return;
    var a=valOf(q,Q_ANS);
    if(typeof a==='number' && a===0) zeroBased=true;
    if(typeof a==='string' && a.trim()==='0') zeroBased=true;
  });
  if(zeroBased) report.notes.push('answers are numbered from 0');

  var looseKey=readLooseKey(root,arr.length);
  if(Object.keys(looseKey).length) report.notes.push('a separate answer key was used');

  var out=[], secCounts={};
  arr.forEach(function(q,i){
    if(typeof q==='string'){ q={text:q}; }
    if(Array.isArray(q)){
      /* ["question", "A", "B", "C", "D", "answer"] */
      q={text:q[0],options:q.slice(1,5),answer:q[5]};
    }
    if(!q || typeof q!=='object'){ report.dropped++; return; }

    var textRaw=valOf(q,Q_TEXT);
    var text=stripHtml(textRaw);
    var opts=readOptions(q);
    if(!text && !opts.texts.length){ report.dropped++; return; }

    var ai=readAnswer(q,opts,zeroBased);
    if(ai<0){
      var num=Number(stripHtml(valOf(q,Q_NUM)))||(i+1);
      if(looseKey[num]!==undefined){
        ai=readAnswer({answer:looseKey[num]},opts,zeroBased);
      }
    }
    var sec=stripHtml(q.__section||valOf(q,Q_SEC)||'')||'General';
    secCounts[sec]=(secCounts[sec]||0)+1;

    var texts=opts.texts.slice(0,4);
    while(texts.length<4) texts.push('');
    if(opts.texts.length) report.withOptions++;
    if(ai>=0 && ai<4) report.withAnswer++;

    out.push({
      text:text,
      options:texts,
      correct: (ai>=0 && ai<4)? LETTERS[ai] : '',
      sectionName:sec,
      topic:stripHtml(valOf(q,Q_TOPIC)||'').slice(0,40),
      explanation:stripHtml(valOf(q,Q_EXPL)||'').slice(0,400),
      srcNum:Number(stripHtml(valOf(q,Q_NUM)))||(i+1),
      /* A question whose text was an image is still worth keeping — it just
         cannot be read as words, and the review screen says so. */
      needsFigure:hasImgTag(textRaw)||!text,
      passageText:stripHtml(valOf(q,Q_PASS)||'')
    });
  });
  if(!out.length) throw new Error('I found a list in that file but nothing in it looked like a question.');

  /* Passages, where the file repeats the same one on each question. */
  var passages={}, pseq=0, byText={};
  out.forEach(function(q){
    if(!q.passageText || q.passageText.length<80) { delete q.passageText; return; }
    var k=byText[q.passageText];
    if(!k){ k='p'+(++pseq); byText[q.passageText]=k; passages[k]={id:k,text:q.passageText,count:0}; }
    passages[k].count++;
    q.passageId=k;
    delete q.passageText;
  });

  /* Sections become ranges over the questions in the order they came. */
  var sections=[], cur=null;
  out.forEach(function(q,i){
    if(!cur || cur.name!==q.sectionName){
      if(cur) sections.push(cur);
      cur={name:q.sectionName,start:i+1,end:i+1};
    }else cur.end=i+1;
  });
  if(cur) sections.push(cur);
  /* Names that alternate rather than run in blocks give one section per
     question, which is not a section list — better to have none. */
  if(sections.length>12) sections=[];

  report.found=out.length;
  report.sections=Object.keys(secCounts).map(function(k){ return k+' '+secCounts[k]; });

  var dur=Number(stripHtml(valOf(root,['durationminutes','duration','timelimit','time','minutes'])||''))||0;
  if(dur>600) dur=Math.round(dur/60);          // it was seconds
  if(dur<5||dur>300) dur=0;

  return {obj:{
    name:stripHtml(valOf(root,['name','title','papername','testname','quizname'])||'')||fallbackName||'Imported paper',
    questions:out,
    sections:sections,
    passages:passages,
    durationMinutes:dur||undefined
  },report:report};
}

function adaptReportText(rep){
  if(rep.native) return '';
  var bits=[rep.found+' question(s) read from '+rep.source];
  if(rep.withOptions<rep.found) bits.push((rep.found-rep.withOptions)+' had no options');
  bits.push(rep.withAnswer+' with an answer');
  if(rep.dropped) bits.push(rep.dropped+' entr'+(rep.dropped===1?'y':'ies')+' skipped');
  rep.notes.forEach(function(n){ bits.push(n); });
  return bits.join(' · ');
}

function paperFromImport(obj,fallbackName){
  if(!obj || typeof obj!=='object') throw new Error('That file is not a paper file.');
  var qs=obj.questions;

    q=q||{};
    var opts=Array.isArray(q.options)? q.options.slice(0,4).map(function(o){return o==null?'':String(o);}) : [];
    while(opts.length<4) opts.push('');
    var corr=String(q.correct||q.answer||'').trim().toUpperCase();
    if(['1','2','3','4'].indexOf(corr)>-1) corr=LETTERS[Number(corr)-1];
    if(LETTERS.indexOf(corr)<0){ corr=null; noKey++; }
    var ofs=Array.isArray(q.optionFigures)? q.optionFigures.map(function(f){ return f? (sanitizeSvg(String(f))||null) : null; }) : [];

      number:i+1, docOrder:i,
      srcLabel:String(q.srcLabel||('Q.'+(q.srcNum||q.number||(i+1)))),
      srcNum:Number(q.srcNum||q.number||(i+1))||(i+1),
      sectionName:String(q.sectionName||q.section||'General'), page:null,
      text:String(q.text||q.q||''), options:opts,
      optionFigures:ofs.slice(0,4), figure:fig,
      passageId:q.passageId||null,
      needsFigure:!!q.needsFigure, figureDone:!!fig || ofs.some(Boolean),
      hasGraphic:!!(q.hasGraphic||q.needsFigure), thin:!!q.thin, accepted:!!q.accepted, byMark:!!q.byMark,
      correct:corr, source:corr? (q.source||'import') : 'unset',
      agree:(q.agree===0||q.agree===1||q.agree===2)? q.agree : undefined,

    id:'paper_'+Date.now()+'_'+Math.floor(Math.random()*900+100),
    name:String(obj.name||fallbackName||'Imported paper').slice(0,90),
    createdAt:Date.now(), questions:questions, sections:sections, passages:passages,
    durationMinutes:dur,

/* ============ ATTEMPT HISTORY ============ */
function historyRecord(r,attempt,paper){
  var bySec={};
  paper.sections.forEach(function(sc){
    var b=r.bySection[sc.name]||{};
    bySec[sc.name]={score:b.score||0,correct:b.correct||0,wrong:b.wrong||0,unattempted:b.unattempted||0};
  });
  /* 100 characters, one per question. Cheap enough to keep for every attempt,
     and it is the thing you actually want when you re-sit a paper. */
  var resp=paper.questions.map(function(q){ return (attempt.responses||{})[q.number]||'-'; }).join('');
  return {resp:resp,finishedAt:attempt.finishedAt||Date.now(),score:r.score,maxScore:r.maxScore,
    correct:r.correct,wrong:r.wrong,unattempted:r.unattempted,accuracy:r.accuracy,
    attemptRate:r.attemptRate,elapsedMs:attempt.elapsedMs||0,bySection:bySec};
}
function recordAttempt(r,attempt,paper){
  /* Only a full attempt belongs in the score history — a 20-question drill
     scored out of 40 would wreck the trend line and the "best" figure. */
  if(isPartial(attempt)){
    var e0=findLib(paper.id);
    if(e0){ e0.inProgress=false; e0.pendingScore=false; storSet('library_index',APP.library); }
    return null;
  }
  var rec=historyRecord(r,attempt,paper);
  APP.prevRecord=APP.history.length? APP.history[APP.history.length-1] : null;
  APP.history=APP.history.concat([rec]).slice(-40);
  var e=findLib(paper.id);
  if(e){
    e.lastScore=r.score;
    e.scores=(e.scores||[]).concat([r.score]).slice(-10);
    e.bestScore=(e.bestScore==null)? r.score : Math.max(e.bestScore,r.score);
    e.attempts=(e.attempts||0)+1;
    e.inProgress=false;
    e.durationMinutes=paper.durationMinutes||e.durationMinutes;
  }
  persistHistory(paper.id);
  return rec;
}
async function persistHistory(paperId){

function normalizePaper(paper){

  if((paper.questions||[]).length===100){
    var runt=paper.sections.some(function(sc){ return (Number(sc.end)-Number(sc.start)+1)<6; });
    if(runt || paper.sections.length>4) paper.sections=defaultSections();
  }
  (paper.questions||[]).forEach(function(q,i){
    if(q.docOrder==null) q.docOrder=i;
    if(!Array.isArray(q.options)) q.options=['','','',''];
    while(q.options.length<4) q.options.push('');
    if(!Array.isArray(q.optionFigures)) q.optionFigures=[null,null,null,null];
    if(q.figure===undefined) q.figure=null;

var PROC={figDone:0,figTotal:0,keyDone:0,keyTotal:0,pages:0,pageTotal:0,stage:'reading',note:''};

/* ============ NEVER CONVERT THE SAME PDF TWICE ============
   Converting a PDF is the expensive part — it is where every request goes.
   Doing it a second time for a paper you already have buys nothing and costs
   another day's allowance, and it happens constantly: the same paper on the
   phone and the laptop, storage cleared, the app reinstalled, a file re-sent
   by a friend.

   So the file is fingerprinted before anything else runs. If that exact PDF has
   been converted before, the paper it produced is opened straight from the
   library — instantly, with no requests at all. */
async function fileFingerprint(file){
  var buf=await readFileAsArrayBuffer(file);
  try{
    if(crypto && crypto.subtle && crypto.subtle.digest){
      var d=await crypto.subtle.digest('SHA-256',buf);
      var b=new Uint8Array(d), out='';
      for(var i=0;i<12;i++) out+=('0'+b[i].toString(16)).slice(-2);
      return {hash:'s'+out, buf:buf};
    }
  }catch(e){}
  /* No crypto.subtle on an insecure origin. A cheap hash over the size and a
     scattering of bytes is not a security claim — it only has to tell two
     question papers apart, and it does. */
  var v=new Uint8Array(buf), h=2166136261, n=v.length;
  var step=Math.max(1,Math.floor(n/4096));
  for(var j=0;j<n;j+=step){ h^=v[j]; h=(h*16777619)>>>0; }
  return {hash:'f'+n.toString(36)+'_'+h.toString(36), buf:buf};
}
function libByFingerprint(hash){
  if(!hash) return null;
  for(var i=0;i<APP.library.length;i++){
    if(APP.library[i].srcHash===hash) return APP.library[i];
  }
  return null;
}

async function startProcessing(){
  if(!APP.pendingFile) return;
  if(APP.pendingKind==='json'){
    APP.screen='processing'; APP.processing={stage:'reading',current:1,total:1,note:'Loading the paper file'};
    renderApp();
    try{ await loadPendingPaperFile(); }
    catch(err){ APP.processing={stage:'error',error:(err&&err.message)||String(err)}; renderApp(); }
    return;
  }
  /* Hashing a twenty-megabyte scan takes a moment, and doing it before the
     screen changed left the app looking frozen on the file picker with nothing
     to say for itself. The screen goes up first. */
  APP.screen='processing';
  APP.processing={stage:'reading',current:0,total:0,note:'Checking whether you have read this PDF before'};
  renderApp();
  var fp=null;
  try{ fp=await fileFingerprint(APP.pendingFile); }catch(e){}
  if(fp){
    var already=libByFingerprint(fp.hash);
    if(already){
      APP.pendingFile=null; APP.pendingPaper=null;
      var had=await loadPaper(already.id);
      if(had){
        APP.processing=null;
        APP.paper=had; APP.history=await storGet('history:'+already.id)||[];
        APP.reviewDraft=makeReviewDraft(had);
        APP.screen='review'; renderApp();
        toast('You have read this PDF before \u2014 opened from your library, no requests spent.');
        return;
      }
      /* The library remembered this PDF but the paper itself is gone — a
         half-deleted entry. Read it again rather than dead-ending. */
      APP.library=APP.library.filter(function(x){ return x.id!==already.id; });
      storSet('library_index',APP.library);
    }
  }

  resetProc(); clearAiErrors();
  reqBudgetStart(AI.reqCap);
  APP.screen='processing'; APP.processing={stage:'reading',current:0,total:0,note:'Reading the pages'};
  renderApp();
  holdWake();
  var startedAt=Date.now();
  try{
    APP.skipFigures=false; APP.skipKey=false; APP.processAbort=false; APP.processStartedAt=startedAt;
    APP._srcHash=fp? fp.hash : '';
    /* Reading and parsing the PDF needs no network at all. Waiting on a

    APP._aiProbe=probeAI().then(function(v){ return v; },function(){ return false; });

    /* The two slow halves of an import — sending pictures of the diagrams, and
       working out the answers — need nothing from each other. They used to run
       one after the other, so every key sat idle through the first half. The
       answer pass now starts the moment the questions are known, on the
       questions that have no diagram, and the diagram pass runs alongside it. */

      else { PROC.stage=p.stage; PROC.pages=p.current||0; PROC.pageTotal=p.total||0; }
      PROC.note=p.note||'';

    },function(b){
      passages=b.passages||{};
      /* Written to disk here, not at the end. A phone that kills a backgrounded
         tab half way through used to lose everything; now the paper is already
         in the library and the answer key can be finished from the review
         screen whenever. */
      provisional={id:paperId,name:APP.pendingFileName||'Untitled paper',createdAt:Date.now(),
        questions:b.questions,sections:b.sections,passages:b.passages,apiAvailable:true,
        pagesOnly:!!b.pagesOnly,scanned:!!b.scanned,viaVision:!!b.viaVision,maskedPages:!!b.maskedPages,
        durationMinutes:60,figureCount:0,passageCount:b.passageCount,missing:b.missing,partial:true};
      _provisionalId=paperId;
      storSet('paper:'+paperId,provisional).then(function(){
        if(APP.processAbort) return;
        if(!findLib(paperId)){
          APP.library.push(libEntry(provisional));
          storSet('library_index',APP.library);
        }
      });
      if(!canFetchAnswers()) return;
      earlyQs=b.questions.filter(function(q){ return !q.correct && !q.hasGraphic && !q.thin; });
      if(!earlyQs.length) return;
      PROC.keyTotal=earlyQs.length; PROC.stage='working'; paintProc();
      earlyRun=completeAnswerKey(earlyQs,passages,keyProgress)
        .then(function(r){ Object.keys(r).forEach(function(k){ keyResults[k]=r[k]; }); keyProgress(); })
        .catch(function(e){ noteAiError(null,e); });
    });
    if(APP.processAbort){ return; }
    var apiOk=await APP._aiProbe;
    if(!built.questions || !built.questions.length){

    }
    if(!apiOk && keyCount() && isOnline()){ apiOk=true; aiMarkUp(); }   // try anyway; failures report themselves

      q.topic=q.topic||k.t||''; q.explanation=q.explanation||k.e||'';
      if(k.conf!=null) q.agree=k.conf;

    if(!apiOk && stillMissing){
      toast('Built without answers — '+(isOnline()? 'no key could be reached.' : 'you are offline.')+' Score it later from the result screen.');
    }
    if(fromPaper){
      toast(built.tickedKey
        ? (built.tickedKey+' answers read from the ticks marked on the paper \u2014 that is the official key, not a guess.')
        : (fromPaper+' answer(s) came from the key printed in the PDF.'));
    }

    var id=paperId;
    var paper={id:id,name:APP.pendingFileName||'Untitled paper',createdAt:Date.now(),

    notifyDone(paper.name+' is ready',
      paper.questions.length+' questions · '+keyed+' answered · read in '+took);
    /* ---- bank the conversion ----
       This paper cost real requests to produce and it will never cost them
       again — but only if the file survives. Storage gets cleared, phones get
       replaced, apps get reinstalled, and each of those used to mean paying
       for the same PDF a second time. Written to Downloads the moment it is
       built, it can be loaded back on any device, for ever, with no key. */
    if(AI.autoExport){
      try{

    if(built.pagesDropped){
      toast(built.pagesDropped+' page picture(s) were left out to stay inside the storage limit.');
    }

function enterQuestion(qnum){

/* Picking an option used to rebuild the whole test screen — header, section
   tabs, passage, figure, every option, footer — for a change that touches four
   class names. On a question carrying a redrawn diagram that was a visible
   stutter on every single tap, a hundred times a paper. Now the four things
   that actually changed are written straight to the DOM, and a full render is
   only used if the expected elements are not there. */
function paintAnswerState(){
  var a=APP.attempt, q=curQ();
  if(!a || !q || APP.screen!=='test') return false;
  /* In practice mode a checked question also shows "you picked X" against the
     key, so changing the answer has to redraw that too — the shortcut is only
     safe while nothing else on screen depends on the response. */
  if(a.answerMode==='practice' && (a.revealed||{})[q.number]) return false;
  var rows=appEl.querySelectorAll('.option-row[data-letter]');
  if(!rows.length) return false;
  var resp=a.responses[q.number]||null;
  Array.prototype.forEach.call(rows,function(row){
    var on=(row.getAttribute('data-letter')===resp);
    row.classList.toggle('selected',on);
    row.setAttribute('aria-checked',on?'true':'false');
  });
  var clear=document.getElementById('clear-answer-btn');
  if(clear) clear.classList.toggle('hidden',!resp);
  updateProgressRing();
  updateSectionCounts();
  updatePaletteState();
  return true;
}
/* The desktop palette is on screen the whole time, so its squares have to
   follow the answer as it is picked rather than waiting for a full redraw. */
function updatePaletteState(){
  var a=APP.attempt; if(!a || !appEl) return;
  var nodes=appEl.querySelectorAll('.palette-btn[data-qnum]');
  if(!nodes.length) return;
  Array.prototype.forEach.call(nodes,function(btn){
    var n=Number(btn.getAttribute('data-qnum'));
    var st=(a.status[n]||'not_visited').replace(/_/g,'-');
    ['not-visited','not-answered','answered','marked','answered-marked'].forEach(function(c){
      btn.classList.toggle(c,c===st);

  });
}
function updateSectionCounts(){
  var a=APP.attempt, paper=APP.paper;
  if(!a || !paper) return;
  var nodes=appEl.querySelectorAll('[data-sec-count]');
  if(!nodes.length) return;
  var qs=attemptQs(a), tally={};
  qs.forEach(function(q){
    var nm=sectionForNumber(paper.sections,q.number);
    var t=tally[nm]||(tally[nm]={done:0,total:0});
    t.total++; if(a.responses[q.number]) t.done++;
  });
  Array.prototype.forEach.call(nodes,function(el){
    var nm=el.getAttribute('data-sec-count'), t=tally[nm];
    if(t) el.textContent=t.done+'/'+t.total+(isSectionLocked(nm)?' · done':'');
  });
}

function beginAttempt(){
  var paper=APP.paper, d=APP.reviewDraft;
  var total=paper.questions.length, usedNames={}, renamed={};
  paper.sections=d.sections.map(function(s){
    var st=clamp(Number(s.start)||1,1,total), en=clamp(Number(s.end)||total,1,total);
    if(en<st){ var t=st; st=en; en=t; }
    var raw=String(s.name||'Section').trim()||'Section';
    var nm=raw;
    if(usedNames[raw]){ usedNames[raw]++; nm=raw+' ('+usedNames[raw]+')'; } else usedNames[raw]=1;
    renamed[nm]=raw;                 // duplicate names get a suffix here, so the
    return {name:nm,start:st,end:en}; // per-section clocks have to follow them
  });

     which are the pre-suffix ones. */
  var secMinutes=null;
  if(d.sectional){
    secMinutes={};
    paper.sections.forEach(function(s){
      var src=(d.secMinutes||{});
      secMinutes[s.name]=clamp(Math.round(Number(src[s.name] || src[renamed[s.name]] || 0)||0),1,240);
    });

    if(anyZero){
      var even=evenSecMinutes(d,d.durationMinutes||60);

        if(!secMinutes[s.name]) secMinutes[s.name]=Math.max(1,Math.round(even[s.name]||even[renamed[s.name]]||5));

     15 + 20 + 15 + 10 runs for an hour whatever the slider last said. */
  var totalMinutes=d.sectional
    ? Object.keys(secMinutes).reduce(function(a,k){ return a+secMinutes[k]; },0)
    : d.durationMinutes;

  d.durationMinutes=totalMinutes;
  if(!d.qNums || !d.qNums.length) paper.durationMinutes=totalMinutes;
  paper.lastAnswerMode=d.answerMode;

  paper.lastSecMinutes=secMinutes;

  paper.questions.forEach(function(q){ status[q.number]='not_visited'; });
  APP.attempt={paperId:paper.id,startedAt:Date.now(),durationMinutes:totalMinutes,
    elapsedMs:0,runningSince:Date.now(),paused:false,pausedSince:null,pausedMs:0,pauseCount:0,awayMs:0,
    currentIndex:0,responses:{},status:status,timePerQ:{},visits:{},changes:{},qEnteredAt:Date.now(),
    answerMode:(d.answerMode==='practice'?'practice':'hidden'),revealed:{},

/* ============ SECTIONAL TIMING ============
   SSC's current interface gives each section its own clock, so time saved on
   English can no longer rescue Quant. Practising without that trains a habit
   the real exam punishes. */
function initSectionalClocks(){
  var a=APP.attempt, secs=attemptSections(a);
  var chosen=a.secMinutes||{};
  var haveAny=secs.some(function(sc){ return Number(chosen[sc.name])>0; });
  a.secMs={};
  if(haveAny){
    secs.forEach(function(sc){
      a.secMs[sc.name]=Math.max(60000,Math.round((Number(chosen[sc.name])||1)*60000));
    });
  }else{
    /* Nothing was set, so fall back to the old behaviour: the total, split. */
    var per=Math.floor(((a.durationMinutes||60)*60000)/Math.max(1,secs.length));
    secs.forEach(function(sc){ a.secMs[sc.name]=per; });
  }
  a.secElapsed={}; a.secLocked={};
  a.secOrder=secs.map(function(sc){ return sc.name; });
}
function currentSectionName(){
  var q=curQ();
  return q? sectionForNumber(APP.paper.sections,q.number) : null;
}
function sectionElapsed(name){
  var a=APP.attempt;
  var base=(a.secElapsed||{})[name]||0;
  if(!a.paused && !a.submitted && a.qEnteredAt && currentSectionName()===name){
    base+=Date.now()-a.qEnteredAt;
  }
  return base;
}
function sectionRemaining(name){
  var a=APP.attempt;
  return Math.max(0,((a.secMs||{})[name]||0)-sectionElapsed(name));

/* Section time is folded in by commitQuestionTime, which every move already

   only ever have double-counted if it had been. */
function firstIndexInSection(name){
  var list=attemptQs();

  }
  return -1;

function isSectionLocked(name){
  var a=APP.attempt;

function askFinishSection(){

  }).length;

    title:'Finish '+shortSec(nm)+'?',
    message:esc(fmtTime(left))+' still on its clock'+(unanswered? (' and '+unanswered+' question(s) unanswered') : '')+
      '. The section closes for good and you move to the next one — the unused time cannot be carried over.',
    confirmLabel:'Finish section', action:'do-finish-section', data:{secName:nm}
  };

function finishSectionNow(name){
  var a=APP.attempt;
  if(!a || !a.sectional) return;
  name=name||currentSectionName();
  if(!name) return;
  commitQuestionTime();
  lockSectionAndAdvance(name,true);
}
/* Time up on a section: lock it and move on. If they are all locked the paper
   is over, which is exactly what the real interface does. */
function lockSectionAndAdvance(name,byHand){
  var a=APP.attempt;
  a.secLocked=a.secLocked||{};
  if(a.secLocked[name]) return;
  a.secLocked[name]=true;
  saveAttemptDebounced();
  var order=a.secOrder||attemptSections(a).map(function(s){return s.name;});
  var next=null;
  for(var i=0;i<order.length;i++){ if(!a.secLocked[order[i]]){ next=order[i]; break; } }
  var how=byHand? 'Finished ' : 'Time up on ';
  if(!next){ toast(how+'the last section.'); submitTest(); return; }
  var idx=firstIndexInSection(next);
  buzz([200,100,200]);
  toast(how+shortSec(name)+'. Moving to '+shortSec(next)+'.');
  announce(how+shortSec(name));
  if(idx>=0){ goToIndex(idx); } else { renderApp(); }
}
/* ============ SCREEN WAKE LOCK ============
   A 60-minute paper on a phone used to go dark mid-question. */
var _wakeLock=null;
async function acquireWakeLock(){
  try{
    if(_wakeLock || !navigator.wakeLock) return;
    _wakeLock=await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release',function(){ _wakeLock=null; });
  }catch(e){ _wakeLock=null; }
}
function releaseWakeLock(){
  if(_importWake) return;              // an import still needs the screen awake
  try{ if(_wakeLock){ _wakeLock.release(); _wakeLock=null; } }catch(e){ _wakeLock=null; }
}
var _importWake=false;

/* ============ WORKING WHILE YOU DO SOMETHING ELSE ============
   Reading a paper takes a minute or two and there is nothing to watch. The
   screen is held awake so a phone does not sleep half way through and kill the
   requests, the work carries on when the tab goes to the background, and when
   it finishes the phone says so. */
var NOTIFY_TAG='cgl-import';
function notifySupported(){ return typeof Notification!=='undefined'; }
function notifyState(){
  if(!notifySupported()) return 'unsupported';
  return Notification.permission;     // 'granted' | 'denied' | 'default'
}
async function askNotifyPermission(){
  if(!notifySupported()) return 'unsupported';
  if(Notification.permission!=='default') return Notification.permission;
  try{ return await Notification.requestPermission(); }
  catch(e){ return Notification.permission; }
}
/* Through the service worker where there is one, because a notification posted
   that way still arrives when the tab is in the background — which is the whole
   point of having it. */
async function notifyDone(title,body){
  if(!AI.notify || !notifySupported() || Notification.permission!=='granted') return false;
  var opts={body:body,tag:NOTIFY_TAG,renotify:true,icon:'./icon-192.png',badge:'./icon-192.png'};
  try{
    if('serviceWorker' in navigator){
      var reg=await navigator.serviceWorker.getRegistration();
      if(reg && reg.showNotification){ await reg.showNotification(title,opts); return true; }
    }
  }catch(e){}
  try{ new Notification(title,opts); return true; }catch(e){}
  return false;
}
/* The clock and the import both want the screen kept on, and whichever finishes
   first must not drop it out from under the other. */
async function holdWake(){
  _importWake=true;
  await acquireWakeLock();
}
function releaseWake(){
  _importWake=false;
  var a=APP.attempt;
  if(!a || a.submitted || a.paused || APP.screen!=='test') releaseWakeLock();
}
/* Chrome throttles a background tab's timers hard, which is fine — the requests
   already in flight carry on regardless, and the scheduler wakes on each reply
   rather than on a clock. This just re-pumps on the way back so nothing sits
   waiting for a timer that was slowed to a crawl. */
function wakeScheduler(){ try{ _aiPump(); }catch(e){} }

/* ============ TIMER ============ */
var _timerInterval=null;
function startTimerLoop(){
  if(_timerInterval) return;
  _timerInterval=setInterval(function(){
    var a=APP.attempt;
    if(!a || a.submitted || a.paused || APP.screen!=='test'){ return; }
    var rem=remainingMs(a);
    if(a.sectional){
      var nm=currentSectionName();
      var srem=sectionRemaining(nm);
      if(srem<=0){ lockSectionAndAdvance(nm); return; }
      var sel=document.getElementById('timer-display');
      if(sel){ sel.textContent=fmtTime(srem); sel.classList.toggle('danger',srem<=60000); }
      var totEl=document.getElementById('total-timer-display');
      if(totEl) totEl.textContent=fmtTime(rem);
      /* Warnings are per section here. A "5 minutes left" against the whole
         paper means nothing when each section has its own clock. */
      if(!a['_w5'+nm] && srem<=5*60000 && srem>60000){ a['_w5'+nm]=true; buzz([120,80,120]); toast('5 minutes left in '+shortSec(nm)); announce('5 minutes left in '+shortSec(nm)); }
      if(!a['_w'+nm] && srem<=60000){ a['_w'+nm]=true; buzz(200); toast('1 minute left in '+shortSec(nm)); }
    }else{
      if(rem<=0){ buzz([300,120,300]); submitTest(); return; }
      var el=document.getElementById('timer-display');
      if(el){ el.textContent=fmtTime(rem); el.classList.toggle('danger',rem<=5*60000); }
      if(!a._warn5 && rem<=5*60000){ a._warn5=true; buzz([120,80,120]); toast('5 minutes left'); announce('5 minutes left'); }
      else if(!a._warn1 && rem<=60000){ a._warn1=true; buzz(250); toast('1 minute left'); }
    }
    var qel=document.getElementById('qtimer-display');
    if(qel){ var qms=currentQuestionMs(); qel.textContent=fmtMS(qms); qel.classList.toggle('over',qms>90000); }
  },1000);
}
function stopTimerLoop(){ if(_timerInterval){ clearInterval(_timerInterval); _timerInterval=null; } }

/* ============ PHONE OR LAPTOP ============
   The same file is used on a phone held in one hand and on a laptop with a
   keyboard, and one column of 720 pixels is right for exactly one of those. On
   a wide screen the paper reads better with the palette permanently beside it
   — which is also how the real exam terminal is laid out — so there is nothing
   to open and close and no scrolling to find question 63.

   Auto follows the window, and the two fixed settings are there because a
   phone in landscape and a small laptop window both guess wrong. */
var VIEW_ORDER=['auto','phone','desktop'];
var VIEW_LABEL={auto:'Automatic',phone:'Phone',desktop:'Desktop'};
var DESKTOP_MIN_WIDTH=1000;
function resolvedView(){
  if(APP.viewMode==='desktop') return 'desktop';
  if(APP.viewMode==='phone') return 'phone';
  var w=0;
  try{ w=window.innerWidth||document.documentElement.clientWidth||0; }catch(e){}
  return w>=DESKTOP_MIN_WIDTH? 'desktop':'phone';
}
function isDesktopView(){ return resolvedView()==='desktop'; }
function applyViewMode(){
  var v=resolvedView();
  document.documentElement.setAttribute('data-view',v);
  return v;
}
async function setViewMode(mode){
  if(VIEW_ORDER.indexOf(mode)<0) return;
  var before=resolvedView();
  APP.viewMode=mode;
  await storSet('viewMode',mode);
  var after=applyViewMode();
  if(before!==after) APP.drawerOpen=false;
  APP._keepScroll=true; renderApp();
}
function cycleViewMode(){
  /* Skips straight between the two real layouts rather than parking on
     Automatic, which from a tap looks like nothing happened. */
  var next = isDesktopView()? 'phone':'desktop';
  setViewMode(next);
  toast(VIEW_LABEL[next]+' layout'+(next==='desktop'? ' \u2014 palette stays on screen' : ' \u2014 one column')+'. Settings has an automatic option.');
}
function viewToggleBtn(){
  var d=isDesktopView();
  return '<button class="icon-btn" data-action="toggle-view" aria-label="Switch to the '+(d?'phone':'desktop')+' layout" title="'+(d?'Phone layout':'Desktop layout')+'">'+(d? ICON.phone : ICON.monitor)+'</button>';
}
async function initViewMode(){
  var stored=await storGet('viewMode');
  APP.viewMode=(VIEW_ORDER.indexOf(stored)>-1)? stored : 'auto';
  applyViewMode();
  var t=null;
  window.addEventListener('resize',function(){
    if(APP.viewMode!=='auto') return;
    if(t) clearTimeout(t);
    t=setTimeout(function(){
      t=null;
      var before=document.documentElement.getAttribute('data-view');
      var after=applyViewMode();
      if(before!==after){ APP._keepScroll=true; renderApp(); }
    },180);
  });
}

/* ============ THEME ============ */
async function toggleTheme(){
  var i=THEME_ORDER.indexOf(APP.theme);
  APP.theme=THEME_ORDER[(i<0?0:i+1)%THEME_ORDER.length];
  applyTheme(APP.theme);
  storSet('theme',APP.theme);
  toast(THEME_LABEL[APP.theme]+(APP.theme==='warm'?' \u2014 blue light pulled out':''));
  APP._keepScroll=true; renderApp();
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta){
    var bg=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
    if(bg) meta.setAttribute('content',bg);
  }
}
async function initTheme(){
  var stored=await storGet('theme');
  if(THEME_ORDER.indexOf(stored)<0) stored=null;
  var theme=stored || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  APP.theme=theme;
  applyTheme(theme);
}
