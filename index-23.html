/* How hard the page pictures are rendered before they are sent off to be read.
   Small, soft renders are cheap to upload but a model cannot read a graph axis
   off them, which is most of why diagrams came back wrong. */
var SCAN_QUALITIES=[
  {id:'fast',     label:'Fast',     width:1150, jpeg:0.62, cropWidth:1250, cropJpeg:0.70,
   note:'Smallest pictures, quickest replies. Fine for plain text papers, weakest on small diagram labels.'},
  {id:'balanced', label:'Balanced', width:1500, jpeg:0.74, cropWidth:1700, cropJpeg:0.82,
   note:'The default. Each question’s own patch of the page is cropped out and sent enlarged, so diagram labels and graph axes are legible.'},
  {id:'best',     label:'Best',     width:1900, jpeg:0.85, cropWidth:2200, cropJpeg:0.90,
   note:'Largest pictures. Noticeably slower per page and heavier on data, but the best chance on faint scans and dense figures.'}
];
function scanQ(){
  return SCAN_QUALITIES.filter(function(s){ return s.id===AI.scanQuality; })[0] || SCAN_QUALITIES[1];
}
/* Splits whatever was pasted into individual keys: one per line, or separated
   by commas or spaces. Pasting three keys at once is the normal case. */
function splitKeyInput(raw){
  return String(raw||'').split(/[\s,;]+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length>=20; });
}
async function testLane(lane){
  var r=await probeLane(lane,18000);
  if(!r.ok){
    lane.ok=false;
    lane.lastError=r.error||('Replied '+r.status+'.');
    if(r.status===401||r.status===403||r.status===400) lane.dead=true;
    if(r.blocked) lane.blocked=true;
    return false;
  }
  lane.ok=true; lane.dead=false; lane.blocked=false; lane.lastError=''; lane.coolUntil=0;
  var models=r.models||[];
  if(models.length){
    lane.models=models.filter(function(m){ return !DEAD_MODELS[m]; });
    /* A retired model is still in the listing — it exists, it is just shut to
       us — so "is it in the list" was true for a name that could not be used,
       and refreshing the key left it exactly as stuck as it was. */
    if(!lane.model || DEAD_MODELS[lane.model] || lane.models.indexOf(lane.model)<0){
      lane.model=pickDefaultModel(lane.models,lane.provider);
    }
  }else if(!lane.model || DEAD_MODELS[lane.model]){
    lane.model=pickDefaultModel(lane.models||[],lane.provider);
  }
  return true;
}
async function saveGeminiKeyFromInput(){
  var el=document.getElementById('gemini-key-input');
  var found=splitKeyInput(el && el.value);
  if(!found.length){ APP.settingsMsg={ok:false,text:'Paste a key first. Several at once is fine — put each on its own line.'}; renderApp(); return; }
  var chosen=(APP.keyProvider&&APP.keyProvider!=='auto')? APP.keyProvider : '';
  var added=[], dup=0, unknown=0;
  found.forEach(function(k){
    var pid=chosen||detectProvider(k);
    if(pid==='ambiguous'){ unknown++; return; }
    if(!pid){ unknown++; return; }
    var before=AI.keys.length;
    var lane=addKeyToPool(k,{provider:pid});
    if(lane && AI.keys.length>before) added.push(lane); else dup++;
  });
  if(unknown && !added.length){
    APP.settingsMsg={ok:false,text:unknown===1
      ? 'That key could belong to more than one service. Pick which one above, then add it again.'
      : unknown+' keys could belong to more than one service. Pick which one above, then add them again.'};
    renderApp(); return;
  }
  AI.cleared=false;
  if(!added.length){
    APP.settingsMsg={ok:false,text:dup? 'That key is already saved.' : 'Nothing that looked like a key was found.'};
    await saveAiSettings(); renderApp(); return;
  }
  if(el) el.value='';
  if(!isOnline()){
    APP.settingsMsg={ok:false,text:added.length+' key(s) saved. You are offline, so they could not be tested — they will be used next time you are online.'};
    await saveAiSettings(); renderApp(); return;
  }
  APP.settingsBusy=true; APP.settingsMsg=null; AI.lastError=''; renderApp();
  var results=await Promise.all(added.map(testLane));
  var good=results.filter(Boolean).length;
  AI.ok=healthyLanes().length>0;
  var total=keyCount();
  APP.settingsMsg = good
    ? {ok:true,text:good+' of '+added.length+' new key(s) working. '+total+' key(s) in use'+
        (total>1? ' across '+providerSummary()+' — requests are split across all of them.':'.')}
    : {ok:false,text:(added[0].lastError||'That key did not work.')};
  await saveAiSettings();
  APP.settingsBusy=false; renderApp();
}

function renderAiErrors(list){
  list=list||AI_ERRORS;

/* What the keys are doing this second. A shared free tier spends most of its
   time waiting on purpose, and a screen showing nothing at all while it does is
   indistinguishable from one that has crashed — which is what it looked like. */
function poolLine(){
  if(!keyCount()) return '';
  var now=Date.now(), busy=0, resting=0;
  aiLanes().forEach(function(l){
    busy+=l.running;
    if(now<l.coolUntil) resting++;
  });
  var bits=[];
  if(busy) bits.push(busy+' in flight');
  if(_aiWaiting.length) bits.push(_aiWaiting.length+' queued');
  if(resting) bits.push(resting+' resting');
  return bits.join(' · ');
}

/* ============ CHECKING WHAT WAS READ ============
   A reader that quietly gets a question wrong is worse than one that fails
   loudly: the paper looks finished, and the mistake only shows up mid-test with
   a clock running. Everything extracted is therefore checked against what a
   question is supposed to look like, and anything that does not add up is said
   so plainly and can be repaired before the paper is sat.

   None of these tests need a model or a network. They are what the paper itself
   can be asked: does every question have a stem, four options and a key; does
   the numbering run unbroken; is a label used twice; is anything absurdly long
   or short for a question. */
function questionIssues(q,ctx){
  var issues=[];
  var text=String(q.text||'').trim();
  var opts=(q.options||[]).map(function(o){ return String(o||'').trim(); });
  var filled=opts.filter(Boolean).length;
  var hasFig=!!(q.figure || (q.optionFigures||[]).some(Boolean));
  var hasPic=!!(ctx && ctx.pictures && ctx.pictures[q.number]);

  if(!text && !hasFig && !hasPic) issues.push({k:'no-text',t:'No question text could be read, and no picture was kept for it.'});
  else if(!text && !hasFig) issues.push({k:'text-in-picture',t:'This question is shown as the picture cut from the paper rather than as text.'});
  /* A question kept as its own picture has its options in that picture. They
     were never going to be "read" and there is nothing to repair — flagging
     them as missing made a perfectly sittable paper look broken, which is
     where "17 questions did not come out properly" came from on papers that
     were entirely usable. */
  if(filled===0 && !hasFig && !hasPic) issues.push({k:'no-options',t:'None of the four options could be read.'});
  else if(filled<4 && !hasFig && !hasPic) issues.push({k:'few-options',t:'Only '+filled+' of the 4 options came out.'});
  if(text && text.length<8 && !hasFig) issues.push({k:'short-stem',t:'The question text is suspiciously short.'});
  if(text.length>1800) issues.push({k:'long-stem',t:'The question text is very long — it may have run into the next question.'});
  /* Options that are all the same, or that repeat the stem, mean the split
     landed in the wrong place. */
  if(filled>=2){
    var uniq={}; opts.forEach(function(o){ if(o) uniq[o]=1; });
    if(Object.keys(uniq).length===1) issues.push({k:'same-options',t:'All the options came out identical.'});
  }
  /* Within its own section. These papers restart at Q.1 in every section, so
     four questions labelled "Q.1" is the normal case, not a fault. */
  if(ctx && ctx.dupLabels[q.sectionName+'|'+q.srcLabel]>1){
    issues.push({k:'duplicate',t:'Another question in '+shortSec(q.sectionName)+' carries the same label, '+q.srcLabel+'.'});
  }
  if(!q.correct) issues.push({k:'no-key',t:'No answer for this one yet.'});
  return issues;
}
/* Worst issue wins: a question with no options at all is not merely "check". */
/* "Still a picture" is a note, not a fault. With the picture and an answer the
   question can be sat and scored exactly like any other; the only thing you
   cannot do is search its text. */
var ISSUE_WEIGHT={'no-text':3,'no-options':3,'same-options':3,'duplicate':3,
                  'text-in-picture':1,'few-options':2,'short-stem':2,'long-stem':2,'no-key':1};
function auditPaper(paper,ctx){
  ctx=ctx||{};
  var qs=paper.questions||[];
  ctx.dupLabels={};
  qs.forEach(function(q){
    var k=q.sectionName+'|'+q.srcLabel;
    ctx.dupLabels[k]=(ctx.dupLabels[k]||0)+1;
  });
  ctx.pictures=ctx.pictures||{};
  var bad=0, check=0;
  qs.forEach(function(q){
    var issues=questionIssues(q,ctx);
    q.issues=issues.map(function(i){ return i.k; });
    var worst=0;
    issues.forEach(function(i){ worst=Math.max(worst,ISSUE_WEIGHT[i.k]||1); });
    q.grade = worst>=3? 'bad' : (worst===2? 'check' : 'good');
    if(q.grade==='bad') bad++; else if(q.grade==='check') check++;
  });

  var warnings=[];
  /* Gaps in the paper's own numbering are the clearest sign a question was
     skipped entirely — it cannot be flagged on a question that is not there. */
  var bySec={};
  qs.forEach(function(q){ (bySec[q.sectionName]=bySec[q.sectionName]||[]).push(Number(q.srcNum)||0); });
  var missing=[];
  Object.keys(bySec).forEach(function(s){
    var nums=bySec[s].filter(function(n){ return n>0; }).sort(function(a,b){ return a-b; });
    if(!nums.length) return;
    var top=nums[nums.length-1];
    if(top>nums.length+6) return;                  // numbering is not 1..n here
    for(var n=1;n<=top;n++){ if(nums.indexOf(n)<0) missing.push(shortSec(s)+' '+n); }
  });
  if(missing.length){
    warnings.push({level:'bad',t:missing.length+' question'+(missing.length===1?'':'s')+
      ' the paper numbers but the reader never found: '+missing.slice(0,10).join(', ')+(missing.length>10?'…':'')});
  }
  if(paper.questions.length && paper.questions.length!==100){
    warnings.push({level:'warn',t:'This paper has '+paper.questions.length+' questions, not the usual 100.'});
  }
  var keyed=qs.filter(function(q){ return q.correct; }).length;
  if(!keyed) warnings.push({level:'bad',t:'No answers at all. The paper can still be sat and scored later.'});
  else if(keyed<qs.length) warnings.push({level:'warn',t:(qs.length-keyed)+' question(s) have no answer yet.'});
  if(bad) warnings.push({level:'bad',t:bad+' question'+(bad===1?'':'s')+' did not come out properly.'});
  if(check) warnings.push({level:'warn',t:check+' question'+(check===1?'':'s')+' are worth a look.'});
  if(paper.pagesOnly) warnings.push({level:'bad',t:'The text could not be read at all, so each question just shows its page.'});

  return {bad:bad, check:check, good:qs.length-bad-check, keyed:keyed,
          missing:missing, warnings:warnings};
}
/* The one line that says whether this paper is fit to sit. */
function readingVerdict(a,total){
  if(!total) return {tone:'bad',t:'Nothing was read.'};
  if(a.bad || a.missing.length) return {tone:'bad',t:a.bad+a.missing.length+' problem(s) worth fixing before you sit it'};
  if(a.check) return {tone:'warn',t:a.check+' question(s) worth a look'};
  return {tone:'ok',t:'All '+total+' questions read cleanly'};
}

/* ============ CHECK THE READING ============
   What the reader made of the paper, laid out so it can be disagreed with.
   Every question it is unsure about is shown next to the piece of the page it
   came from, which is the only way to tell a misreading from a hard question.
   Three ways out of each one: have it read again from the picture, type the
   right thing in, or say it is fine as it is. */
var ISSUE_LABEL={
  'no-text':'No text and no picture',
  'text-in-picture':'Shown as a picture',
  'no-options':'No options',
  'few-options':'Missing options',
  'short-stem':'Very short',
  'long-stem':'Very long',
  'same-options':'Options identical',
  'duplicate':'Duplicate label',
  'no-key':'No answer'
};
function verifyFilterCounts(paper){

/* Reads one question again from its own picture and replaces what was there. */
async function verifyReread(qnum){
  var paper=APP.paper; if(!paper) return false;
  var q=paper.questions.filter(function(x){ return x.number===Number(qnum); })[0];
  if(!q) return false;
  var pic=(paper.figSources||{})[q.number] || ((q.page && (paper.pageImages||{})[q.page])||null);
  if(!pic){ toast('No picture was kept for that one.'); return false; }
  if(!canFetchAnswers()){ toast(whyNoAnswers()); return false; }
  try{
    var raw=await callAI(buildFigurePrompt(q,storedImageIsCrop(q)),pic,true,{thinkBudget:0,maxTokens:4096});
    var obj=extractJsonLoose(raw);
    if(!obj) return false;
    applyFigureObj(q,obj);
    return true;
  }catch(e){ noteAiError(null,e); return false; }
}
async function verifyRereadOne(qnum){
  APP.verifyBusy=Number(qnum); APP._keepScroll=true; renderApp();
  var ok=await verifyReread(qnum);
  APP.verifyBusy=null;
  await regradeAndSave();
  toast(ok? 'Read again.' : 'That did not come back any better.');
  APP._anchor='#vq-'+qnum; renderApp();
}
async function verifyRereadAll(){
  var paper=APP.paper; if(!paper) return;
  var need=paper.questions.filter(function(q){
    return q.grade!=='good' && ((paper.figSources||{})[q.number] || (q.page && (paper.pageImages||{})[q.page]));
  });
  if(!need.length){ toast('Nothing left with a picture to read.'); return; }
  if(!canFetchAnswers()){ toast(whyNoAnswers()); return; }
  APP.verifyBusy='all'; renderApp();
  var done=0;
  await pMap(need,async function(q){
    if(await verifyReread(q.number)) done++;
  },Math.max(2,Math.min(5,aiCapacity())));
  APP.verifyBusy=null;
  await regradeAndSave();
  toast(done+' of '+need.length+' read again.');
  renderApp();
}
/* Whatever was typed into the boxes, taken as the truth. */
function verifySaveTyped(qnum){
  var paper=APP.paper; if(!paper) return;
  var q=paper.questions.filter(function(x){ return x.number===Number(qnum); })[0];
  if(!q) return;
  var t=appEl.querySelector('[data-vq-text="'+qnum+'"]');
  if(t) q.text=t.value.trim();
  for(var i=0;i<4;i++){
    var el=appEl.querySelector('[data-vq-opt="'+qnum+'"][data-vq-i="'+i+'"]');
    if(el) q.options[i]=el.value.trim();
  }
  if(q.text || q.options.some(Boolean)) q.thin=false;
  regradeAndSave().then(function(){
    toast('Q'+qnum+' saved.');
    APP._anchor='#vq-'+qnum; renderApp();
  });
}
function verifyAccept(qnum){
  var paper=APP.paper; if(!paper) return;
  var q=paper.questions.filter(function(x){ return x.number===Number(qnum); })[0];
  if(!q) return;
  q.accepted=true; q.grade='good'; q.issues=[];
  regradeAndSave(true).then(function(){
    APP.audit=auditPaper(paper,{pictures:paper.figSources||{}});
    /* An accepted question stays accepted even though the audit would flag it
       again — the person looking at the page outranks the reader. */
    paper.questions.forEach(function(x){ if(x.accepted){ x.grade='good'; x.issues=[]; } });
    APP._anchor='#vq-'+qnum; renderApp();
  });
}
async function regradeAndSave(skipAudit){
  var paper=APP.paper; if(!paper) return;
  if(!skipAudit){
    APP.audit=auditPaper(paper,{pictures:paper.figSources||{}});
    paper.questions.forEach(function(x){ if(x.accepted){ x.grade='good'; x.issues=[]; } });
  }
  if(APP.reviewDraft){
    paper.questions.forEach(function(q){
      APP.reviewDraft.answerMap[q.number]=q.correct||null;
      APP.reviewDraft.answerSource[q.number]=q.source||'unset';
    });
  }
  try{ await storSet('paper:'+paper.id,stripRuntime(paper)); }catch(e){}
}

/* ============ REVIEW (pre-test) ============ */
function makeReviewDraft(paper){
  var answerMap={}, answerSource={};
  paper.questions.forEach(function(q){ answerMap[q.number]=q.correct||null; answerSource[q.number]=q.source||'unset'; });
  return {
    sections: paper.sections.map(function(s){return {name:s.name,start:s.start,end:s.end};}),
    durationMinutes: paper.durationMinutes||60,
    answerMap:answerMap, answerSource:answerSource,
    keying:false, keyProgress:null, declared:true, answerMode:(paper.lastAnswerMode==='practice'?'practice':'hidden'),
    mode:'full', modeArg:null, qNums:null, fullMinutes:(paper.durationMinutes||60), sectional:!!paper.lastSectional,
    secMinutes:(paper.lastSecMinutes && typeof paper.lastSecMinutes==='object')? JSON.parse(JSON.stringify(paper.lastSecMinutes)) : null
  };
}
function coverageCounts(paper,answerMap){
  var withKey=0;
  paper.questions.forEach(function(q){ if(answerMap[q.number]) withKey++; });
  return {withKey:withKey,total:paper.questions.length};
}
function sectionCoverageMsg(sections,total){
  var covered=new Array(total+1).fill(false), overlap=false;
  sections.forEach(function(s){
    for(var n=s.start;n<=s.end;n++){ if(n>=1&&n<=total){ if(covered[n]) overlap=true; covered[n]=true; } }
  });
  var gaps=0; for(var i=1;i<=total;i++){ if(!covered[i]) gaps++; }
  if(overlap) return 'Some question numbers sit in more than one section.';
  if(gaps>0) return gaps+' question(s) fall outside every section and won\u2019t appear in the section scores.';
  return 'Sections cover all '+total+' questions, no overlap.';
}

    ' \u00b7 '+fmtMinutes(d.sectional? secMinutesTotal(d) : d.durationMinutes)+(d.sectional? ' across sections':'')+' \u00b7 '+
    (d.answerMode==='practice'?'answers on demand':'answers hidden')+' \u00b7 '+
    (cov.withKey===cov.total? 'key ready' : (cov.withKey? (cov.withKey+'/'+cov.total+' keyed') : 'no key yet'));

/* ============ TEST ============ */
function isPaused(){ return !!(APP.attempt && APP.attempt.paused); }
function elapsedMs(a){
  if(!a) return 0;
  return a.elapsedMs + (a.runningSince? (Date.now()-a.runningSince):0);
}
/* On a sectional paper the honest "time left in the paper" is what the sections
   still open have between them — not the total minus elapsed. Those two used to
   drift apart the moment a section closed with time unspent, so a paper could
   submit itself while a section still had ten minutes on its clock, or run past
   the end of every section. */
function remainingMs(a){
  if(a && a.sectional && a.secMs){
    var secs=attemptSections(a), left=0;
    secs.forEach(function(s){
      if(isSectionLocked(s.name)) return;
      left+=sectionRemaining(s.name);
    });
    return left;
  }
  return a.durationMinutes*60000 - elapsedMs(a);
}

function answeredCount(){
  var a=APP.attempt, n=0;
  if(!a) return 0;
  attemptQs(a).forEach(function(q){ if(a.responses[q.number]) n++; });
  return n;
}
function currentQuestionMs(){
  var a=APP.attempt; if(!a) return 0;
  var q=curQ(); if(!q) return 0;
  var base=(a.timePerQ||{})[q.number]||0;
  if(!a.paused && a.qEnteredAt) base+=Date.now()-a.qEnteredAt;
  return base;
}
function renderTestTopBar(){
  var paper=APP.paper, attempt=APP.attempt;
  var q=curQ();
  var curSection=sectionForNumber(paper.sections,q.number);
  var rem=remainingMs(attempt);
  /* A drill is not the whole paper. Counting its progress against all hundred
     questions left the ring stuck near empty and "Q3 of 100 · 97 left" on a
     twelve-question revision set. */
  var qs=attemptQs(attempt);
  var total=qs.length, done=answeredCount();
  var qms=currentQuestionMs();
  var frac=total? done/total : 0;
  var C=2*Math.PI*15;
  var h='<div class="test-top"><div class="test-top-inner row-between">'+
    '<div class="row" style="gap:9px;">'+
    '<div class="ring-wrap" id="progress-ring">'+
      '<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">'+
      '<circle class="ring-track" cx="19" cy="19" r="15" fill="none" stroke-width="4"/>'+
      '<circle class="ring-fill" id="ring-fill" cx="19" cy="19" r="15" fill="none" stroke-width="4" '+
        'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"/>'+
      '</svg><span class="ring-num" id="ring-num">'+done+'</span></div>'+
    '<div class="head-stat">Q<b>'+q.number+'</b> of '+total+'<br>'+(total-done)+' left</div>'+
    '</div>'+
    '<div class="row">'+
    '<span class="qtimer'+(qms>90000?' over':'')+'" id="qtimer-display" aria-label="Time on this question">'+fmtMS(qms)+'</span>'+
    (attempt.sectional
      ? '<span class="timer-stack"><span class="timer'+(sectionRemaining(curSection)<=60000?' danger':'')+'" id="timer-display" aria-label="Time left in this section">'+fmtTime(sectionRemaining(curSection))+'</span>'+
        '<span class="timer-sub" id="total-timer-display" aria-label="Time left in the whole paper">'+fmtTime(rem)+'</span></span>'
      : '<span class="timer'+(rem<=5*60000?' danger':'')+'" id="timer-display">'+fmtTime(rem)+'</span>')+
    '<button class="icon-btn" data-action="pause-test" aria-label="Pause the test">'+ICON.pause+'</button>'+
    '</div></div>';
  h+='<div class="section-tabs">';
  attemptSections(attempt).forEach(function(s){
    var secDone=0, secTot=0;
    qs.forEach(function(qq){
      if(qq.number>=s.start && qq.number<=s.end){ secTot++; if(attempt.responses[qq.number]) secDone++; }
    });
    var lk=isSectionLocked(s.name);
    h+='<button class="section-tab '+secClass(s.name)+(s.name===curSection?' active':'')+(lk?' locked':'')+'" data-action="jump-section" data-sec-name="'+esc(s.name)+'"'+(lk?' aria-disabled="true"':'')+'>'+
       '<span class="sec-icon">'+secIcon(s.name)+'</span>'+esc(shortSec(s.name))+'&nbsp;<span class="sec-count" data-sec-count="'+esc(s.name)+'" style="opacity:.7;">'+secDone+'/'+secTot+(lk?' \u00b7 done':'')+'</span></button>';
  });
  h+='</div>';
  h+='<div class="mini-bar"><span style="width:'+pct(done,total)+'%;"></span></div>';
  h+='</div>';
  return h;
}
function renderPauseScreen(){
  var a=APP.attempt;
  return '<div class="pause-wrap"><div class="pause-inner">'+
    '<p class="eyebrow">Paused</p>'+
    '<div class="pause-clock">'+fmtTime(remainingMs(a))+'</div>'+

  h+=renderPassage(q);

  h+='<div class="q-text">'+(q.text? esc(q.text)
      : '<span style="color:var(--ink-muted);font-style:italic;">'+(picShownFor(q)? 'Read this question from the picture above, then pick an option.' : 'This question\u2019s text could not be read from the PDF.')+'</span>')+'</div>';

  });
  h+='</div>';
  /* Always present, hidden when there is nothing to clear. Adding and removing

     (isLast

/* The palette is the same thing in both layouts: a bottom sheet on a phone, a

function paletteInner(inDrawer){
  var paper=APP.paper, attempt=APP.attempt;
  if(!paper || !attempt) return '';
  var counts={answered:0,not_answered:0,marked:0,answered_marked:0,not_visited:0};
  attemptQs(attempt).forEach(function(q){ counts[attempt.status[q.number]||'not_visited']++; });
  var cur=curQ();
  var h='<div class="row-between" style="margin-bottom:10px;"><h3 style="margin:0;">Question palette</h3>'+
    (inDrawer? '<button class="icon-btn" data-action="close-drawer" aria-label="Close">'+ICON.close+'</button>' : '')+'</div>'+
    '<div class="legend">'+
    legendItem('not-visited','Not visited ('+counts.not_visited+')')+
    legendItem('not-answered','Not answered ('+counts.not_answered+')')+
    legendItem('answered','Answered ('+counts.answered+')')+
    legendItem('marked','Marked ('+(counts.marked+counts.answered_marked)+')')+
    '</div>';
  h+='<div class="drawer-tools">'+
    '<button class="btn btn-secondary btn-sm" data-action="next-unanswered" style="flex:1;">'+ICON.skip+' Next unanswered</button>'+
    '<button class="btn btn-secondary btn-sm" data-action="next-marked" style="flex:1;">Next marked</button>'+
    '</div>'+
    /* Sectional papers need a way to bank the section and move on. Without it,
       finishing English in ten of its fifteen minutes meant sitting and
       waiting for a clock that cannot be given to anything else. */
    ((attempt.sectional && cur)
      ? '<div class="drawer-tools"><button class="btn btn-secondary btn-sm" data-action="finish-section" style="flex:1;">Finish '+esc(shortSec(sectionForNumber(paper.sections,cur.number)))+' and move on</button></div>'
      : '')+
    '<div class="drawer-tools">'+
    '<span class="tiny" style="flex:1;">Text size</span>'+
    '<button class="fs-btn" data-action="font-smaller" aria-label="Smaller text">A&minus;</button>'+
    '<button class="fs-btn" data-action="font-bigger" aria-label="Bigger text">A+</button>'+
    themeToggleBtn()+viewToggleBtn()+
    '</div>';
  /* goToIndex counts within the attempt, so the palette has to hand it that
     index. It was handing over docOrder — the position in the whole paper —
     which in any drill sent you to a different question than the one tapped. */
  var order=attemptQs(attempt), indexOf={};
  order.forEach(function(q,i){ indexOf[q.number]=i; });
  attemptSections(attempt).forEach(function(s){
    var inSec=order.filter(function(q){return q.number>=s.start&&q.number<=s.end;});
    if(!inSec.length) return;
    var lk=isSectionLocked(s.name);
    h+='<div class="palette-section-title '+secClass(s.name)+'">'+esc(s.name)+(lk? ' &middot; closed':'')+'</div><div class="palette-grid">';
    inSec.forEach(function(q){
      var idx=indexOf[q.number];
      var st=attempt.status[q.number]||'not_visited';
      h+='<button type="button" class="palette-btn '+st.replace(/_/g,'-')+(idx===attempt.currentIndex?' current':'')+(lk?' locked':'')+'" data-action="jump-index" data-index="'+idx+'" data-qnum="'+q.number+'" aria-label="Go to question '+q.number+'">'+q.number+'</button>';
    });
    h+='</div>';
  });
  h+='<div style="height:16px"></div><button class="btn btn-danger btn-block" data-action="open-submit-confirm">Submit test</button>';
  return h;
}
function renderDrawer(){
  if(!APP.drawerOpen) return '';

:null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"A","source":"pdf","topic":"Modern history","explanation":"The Deccan Riots of 1875 were against moneylenders."},{"number":51,"docOrder":50,"srcLabel":"Q.1","srcNum":1,"sectionName":"Quantitative Aptitude","page":null,"text":"The average height of some students in a group is 156 cm. If 5 students of average height 160 cm join the group, then the average height of all the students in the group increases by 0.8 cm. What is the number of students in the group, initially?","options":["10","15","20","25"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Averages","explanation":"156n + 800 = 156.8(n+5) gives 0.8n = 16, so n = 20."},{"number":52,"docOrder":51,"srcLabel":"Q.2","srcNum":2,"sectionName":"Quantitative Aptitude","page":null,"text":"In △ABC, DE ∥ AB, where D and E are the points on sides AC and BC, respectively. If AD = x − 3, AC = 2x, BE = x − 2 and BC = 2x + 3, then what is the value of x?","options":["10","9","12","8"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Geometry - similarity","explanation":"By the basic proportionality theorem AD/AC = BE/BC. Solving (x−3)(2x+3) = 2x(x−2) gives x = 9."},{"number":53,"docOrder":52,"srcLabel":"Q.3","srcNum":3,"sectionName":"Quantitative Aptitude","page":null,"text":"The data given in the table shows the number of boys and girls enrolled in three different streams in a school over 5 years.\n\nBy what percent is the total number of boys in Arts stream more than the total number of boys in Science stream in the years 2012 to 2020?","options":["5","4 16/21","0","2 18/41"],"optionFigures":[null,null,null,null],"figure":{"kind":"table","caption":"Enrolment by stream (Boys / Girls)","headers":["Year","Arts Boys","Arts Girls","Science Boys","Science Girls","Commerce Boys","Commerce Girls"],"rows":[["2012","48","36","40","35","35","45"],["2014","42","43","42","32","32","42"],["2016","45","42","38","30","36","38"],["2018","39","46","41","23","28","34"],["2020","36","43","39","30","39","41"]]},"passageId":null,"needsFigure":true,"figureDone":true,"correct":"A","source":"pdf","topic":"DI - table","explanation":"Arts boys = 210, Science boys = 200. (210−200)/200 × 100 = 5%."},{"number":54,"docOrder":53,"srcLabel":"Q.4","srcNum":4,"sectionName":"Quantitative Aptitude","page":null,"text":"A certain sum amounts to ₹291600 in 2 years and to ₹314928 in 3 years on compound interest compounded annually. How much will be the simple interest (in ₹) on ₹40000 at the same rate for 2 years?","options":["6400","8000","7500","9600"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"A","source":"pdf","topic":"Compound interest","explanation":"Rate = 23328/291600 = 8%. SI = 40000 × 8 × 2 / 100 = ₹6400."},{"number":55,"docOrder":54,"srcLabel":"Q.5","srcNum":5,"sectionName":"Quantitative Aptitude","page":null,"text":"The following Bar Graph represents the Production of Fertilizers by Company A and Company B (in 10000 tonnes) over the years from 2005 to 2010.\n\nWhat is the average production (in 10000 tonnes) of fertilizers in 2008, 2009 and 2010 of Company A?","options":["600","570","590","620"],"optionFigures":[null,null,null,null],"figure":{"kind":"chart","chartType":"bar","caption":"Production of fertilizers (in 10000 tonnes)","labels":["2005","2006","2007","2008","2009","2010"],"series":[{"name":"Company A","values":[240,320,250,460,580,670]},{"name":"Company B","values":[290,350,150,480,650,720]}]},"passageId":null,"needsFigure":true,"figureDone":true,"correct":"B","source":"pdf","topic":"DI - bar graph","explanation":"(460 + 580 + 670) / 3 = 1710 / 3 = 570."},{"number":56,"docOrder":55,"srcLabel":"Q.6","srcNum":6,"sectionName":"Quantitative Aptitude","page":null,"text":"If sin((2A+B)/2) = cos((2A−B)/2) = √3/2, with 0° < (2A+B)/2 < 90° and 0° < (2A−B)/2 < 90°, then find the value of sin[3(A − B)].","options":["√3/2","1/√2","1/2","1"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Trigonometry","explanation":"(2A+B)/2 = 60° and (2A−B)/2 = 30° give A = 45°, B = 30°. sin[3(15°)] = sin45° = 1/√2."},{"number":57,"docOrder":56,"srcLabel":"Q.7","srcNum":7,"sectionName":"Quantitative Aptitude","page":null,"text":"The given bar graph shows the imports and exports (in crore ₹) of steel for 5 years from 2014 to 2018.\n\nWhat is the ratio of average export to average import over the five years?","options":["247 : 109","247 : 218","109 : 247","218 : 247"],"optionFigures":[null,null,null,null],"figure":{"kind":"chart","chartType":"bar","caption":"Steel imports and exports (₹ crore)","labels":["2014","2015","2016","2017","2018"],"series":[{"name":"Import","values":[350,380,420,450,580]},{"name":"Export","values":[400,420,550,480,620]}]},"passageId":null,"needsFigure":true,"figureDone":true,"correct":"B","source":"pdf","topic":"DI - bar graph","explanation":"Exports total 2470, imports total 2180. Ratio 2470 : 2180 = 247 : 218."},{"number":58,"docOrder":57,"srcLabel":"Q.8","srcNum":8,"sectionName":"Quantitative Aptitude","page":null,"text":"In a factory, there are 39 workers who have been categorised into five groups (A, B, C, D, E) on the basis of the range of their daily wages (in multiples of ₹100). It is ensured that the daily wage of no worker is an exact multiple of ₹100. The distribution is presented through the given histogram.\n\nIf two Managers are engaged to supervise the workers, with daily wages ranging between ₹700 and ₹800, then what will be the average daily wage (nearest to a ₹) of all members of staff of the factory?","options":["₹445","₹400","₹455","₹467"],"optionFigures":[null,null,null,null],"figure":{"kind":"chart","chartType":"bar","caption":"Workers by daily wage group (₹ hundreds)","labels":["A 2-3","B 3-4","C 4-5","D 5-6","E 6-7"],"series":[{"name":"No. of workers","values":[5,9,12,11,2]}]},"passageId":null,"needsFigure":true,"figureDone":true,"correct":"C","source":"pdf","topic":"DI - histogram","explanation":"Using class midpoints: total wages 17150 for 39 workers, plus 2 × 750 = 18650 over 41 people ≈ ₹455."},{"number":59,"docOrder":58,"srcLabel":"Q.9","srcNum":9,"sectionName":"Quantitative Aptitude","page":null,"text":"A shopkeeper allows 16% discount on every item. Even after giving the discount, he makes a profit of 8%. If he gives 8% discount instead of 16% on an item marked for ₹1800, then what will be his profit percent? (correct to 2 decimal places)","options":["19","18.31","18","18.29"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"D","source":"pdf","topic":"Profit and loss","explanation":"CP = 1800 × 0.84 / 1.08 = 1400. New SP = 1656. Profit = 256/1400 = 18.29%."},{"number":60,"docOrder":59,"srcLabel":"Q.10","srcNum":10,"sectionName":"Quantitative Aptitude","page":null,"text":"If x + y = 2 and 1/x + 1/y = 18/5, then the value of (x³ + y³) is:","options":["4 2/3","4 3/5","3 1/5","3 1/3"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"A","source":"pdf","topic":"Algebra","explanation":"xy = 5/9. x³+y³ = 8 − 3(5/9)(2) = 8 − 10/3 = 14/3."},{"number":61,"docOrder":60,"srcLabel":"Q.11","srcNum":11,"sectionName":"Quantitative Aptitude","page":null,"text":"The value of 25 ÷ 15 of 4 × [4 ÷ 5 × (9 − 7)] − (20 ÷ 5 of 9) is:","options":["2/3","1/3","2/9","4/9"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Simplification","explanation":"Applying BODMAS with 'of' before division throughout gives 2/9."},{"number":62,"docOrder":61,"srcLabel":"Q.12","srcNum":12,"sectionName":"Quantitative Aptitude","page":null,"text":"If p − 2q = 3 and pq = 5, then what is the value of (p³ − 8q³)?","options":["-63","72","117","27"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Algebra","explanation":"p³−8q³ = (p−2q)³ + 6pq(p−2q) = 27 + 6(5)(3) = 117."},{"number":63,"docOrder":62,"srcLabel":"Q.13","srcNum":13,"sectionName":"Quantitative Aptitude","page":null,"text":"A boat goes 27 km upstream and 33 km downstream in 6 hours. In the same time it can go 36 km upstream and 22 km downstream. How much time will it take to go 36 km upstream and 44 km downstream?","options":["8 h 30 m","8 h 10 m","8 h","7 h 50 m"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Boats and streams","explanation":"Solving gives 1/9 h per km upstream and 1/11 h per km downstream: 36(1/9) + 44(1/11) = 4 + 4 = 8 h."},{"number":64,"docOrder":63,"srcLabel":"Q.14","srcNum":14,"sectionName":"Quantitative Aptitude","page":null,"text":"In a circle with centre O, AB and CD are two parallel chords on the same side of the diameter. If AB = 12 cm, CD = 18 cm and distance between the chords AB and CD is 3 cm, then find the radius of the circle (in cm).","options":["12","3√13","15","9"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Geometry - circles","explanation":"√(r²−36) − √(r²−81) = 3 gives r² = 117, so r = 3√13."},{"number":65,"docOrder":64,"srcLabel":"Q.15","srcNum":15,"sectionName":"Quantitative Aptitude","page":null,"text":"If x² + 4y² = 53 and x − 2y = 5, then what is the value of x³ − 8y³?","options":["155","335","-85","85"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Algebra","explanation":"(x−2y)² = 25 gives xy = 7. x³−8y³ = 125 + 6(7)(5) = 335."},{"number":66,"docOrder":65,"srcLabel":"Q.16","srcNum":16,"sectionName":"Quantitative Aptitude","page":null,"text":"The value of 4(sin⁴ 30° + cos⁴ 30°) − 3(sin² 45° − 2cos² 45°) is:","options":["0","4","2","1"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Trigonometry","explanation":"4(1/16 + 9/16) = 5/2 and −3(1/2 − 1) = 3/2. Total 4."},{"number":67,"docOrder":66,"srcLabel":"Q.17","srcNum":17,"sectionName":"Quantitative Aptitude","page":null,"text":"Samir and Puneet can complete the same work in 10 days and 15 days respectively. The work was assigned for ₹4500. After working together for 3 days Samir and Puneet involved Ashok. The work was completed in total 5 days. What amount (in ₹) was paid to Ashok?","options":["800","1500","750","1071"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Time and work","explanation":"In 5 days Samir and Puneet do 25 of 30 units; Ashok does 5 units, so 5/30 × 4500 = ₹750."},{"number":68,"docOrder":67,"srcLabel":"Q.18","srcNum":18,"sectionName":"Quantitative Aptitude","page":null,"text":"In △ABC, D is the mid-point of side AC and E is a point on side AB such that EC bisects BD at F. If AE = 30 cm, then the length of EB is:","options":["20 cm","10 cm","18 cm","15 cm"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"D","source":"pdf","topic":"Geometry - triangles","explanation":"By the midpoint construction AE : EB = 2 : 1, so EB = 15 cm."},{"number":69,"docOrder":68,"srcLabel":"Q.19","srcNum":19,"sectionName":"Quantitative Aptitude","page":null,"text":"△ABC is inscribed in a circle with center O, such that ∠ACB = 115°. O is joined to A. What is the measure of ∠OAB?","options":["25°","20°","35°","30°"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"A","source":"pdf","topic":"Geometry - circles","explanation":"Reflex angle at centre = 230°, so ∠AOB = 130°. Triangle OAB is isosceles, giving ∠OAB = 25°."},{"number":70,"docOrder":69,"srcLabel":"Q.20","srcNum":20,"sectionName":"Quantitative Aptitude","page":null,"text":"A trader bought two articles for ₹490. He sold one at a loss of 20% and the other at a profit of 16%. If the selling price of both articles is same, then the cost price (in ₹) of the article sold at 20% loss is:","options":["310","300","290","280"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"C","source":"pdf","topic":"Profit and loss","explanation":"0.8x = 1.16(490−x) gives x = ₹290."},{"number":71,"docOrder":70,"srcLabel":"Q.21","srcNum":21,"sectionName":"Quantitative Aptitude","page":null,"text":"If a number is first increased by 15%, then reduced by 15%, it results in 782. If the same number is first reduced by 25%, then increased by 25% and again reduced by 20%, then what will be the resulting number?","options":["712","150","750","600"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"D","source":"pdf","topic":"Percentage","explanation":"N × 0.9775 = 782 gives N = 800. Then 800 × 0.75 × 1.25 × 0.8 = 600."},{"number":72,"docOrder":71,"srcLabel":"Q.22","srcNum":22,"sectionName":"Quantitative Aptitude","page":null,"text":"Fourth proportion to 12, 18, and 6 is same as the third proportion to k and 6. What is the value of k?","options":["3√6","4","13.5","3"],"optionFigures":[null,null,null,null],"figure":null,"passageId":null,"needsFigure":false,"figureDone":false,"correct":"B","source":"pdf","topic":"Ratio and proportion","explanation":"Fourth proportional = 18×6/12 = 9. Third proportional to k and 6 is 36/k = 9, so k = 4."} les are (1)______ organically, so whatever you buy is (2)______ farm produced as the (3)______ of the population indulge in farming for (4)______,” says my taxi driver Karma Chime. “We use turmeric on wounds, also to dye (5)______ and it is added extensively in our cooking. Also, many believe it is anti-cancer and can treat tumours.","count":5}},"durationMinutes":60,"figureCount":11,"passageCount":1,"missing":[],"apiAvailable":true,"preloaded":true};
/* ============ ANALYSIS ============ */
function computeResults(paper,attempt){
  var _all=paper.questions;
  var _sub=attemptQs(attempt);
  if(_sub.length!==_all.length){
    paper=Object.create(paper);
    paper.questions=_sub;
    paper.sections=attemptSections(attempt);
  }
  var responses=attempt.responses||{}, tpq=attempt.timePerQ||{};
  var r={score:0,gained:0,lost:0,correct:0,wrong:0,unattempted:0,excluded:0,
    bySection:{},byTopic:{},items:[],
    totalTimeMs:0,timeCorrect:0,timeWrong:0,timeSkipped:0,
    fastWrong:0,slowWrong:0,markedUnanswered:0,changed:0};
  paper.sections.forEach(function(s){ r.bySection[s.name]={correct:0,wrong:0,unattempted:0,score:0,total:0,timeMs:0}; });
  paper.questions.forEach(function(q){
    var sec=sectionForNumber(paper.sections,q.number);
    if(!r.bySection[sec]) r.bySection[sec]={correct:0,wrong:0,unattempted:0,score:0,total:0,timeMs:0};
    var topic=(q.topic||'Untagged').trim()||'Untagged';
    if(!r.byTopic[topic]) r.byTopic[topic]={correct:0,wrong:0,unattempted:0,total:0,timeMs:0};
    var t=tpq[q.number]||0;
    var resp=responses[q.number]||null;
    var st=attempt.status[q.number]||'not_visited';
    var outcome;
    r.bySection[sec].total++; r.bySection[sec].timeMs+=t;
    r.byTopic[topic].total++; r.byTopic[topic].timeMs+=t;
    r.totalTimeMs+=t;
    if(!q.correct){ r.excluded++; outcome='nokey'; }
    else if(!resp){ r.unattempted++; r.bySection[sec].unattempted++; r.byTopic[topic].unattempted++; r.timeSkipped+=t; outcome='skip'; }
    else if(resp===q.correct){
      r.correct++; r.score+=MARK_CORRECT; r.gained+=MARK_CORRECT;
      r.bySection[sec].correct++; r.bySection[sec].score+=MARK_CORRECT;
      r.byTopic[topic].correct++; r.timeCorrect+=t; outcome='correct';
    }else{
      r.wrong++; r.score-=MARK_WRONG; r.lost+=MARK_WRONG;
      r.bySection[sec].wrong++; r.bySection[sec].score-=MARK_WRONG;
      r.byTopic[topic].wrong++; r.timeWrong+=t; outcome='wrong';
      if(t>0 && t<20000) r.fastWrong++;
      if(t>90000) r.slowWrong++;
    }
    if((st==='marked') && !resp) r.markedUnanswered++;
    if((attempt.changes||{})[q.number]) r.changed++;
    r.items.push({q:q,resp:resp,outcome:outcome,time:t,section:sec,topic:topic,status:st});
  });
  r.attempted=r.correct+r.wrong;
  r.maxScore=(paper.questions.length-r.excluded)*MARK_CORRECT;
  r.accuracy=pct(r.correct,r.attempted);
  r.attemptRate=pct(r.attempted,paper.questions.length);
  r.answeredTotal=0;
  Object.keys(responses).forEach(function(k){ if(responses[k]) r.answeredTotal++; });
  r.unseen=paper.questions.filter(function(q){ return (attempt.status[q.number]||'not_visited')==='not_visited'; }).length;
  r.avgOverall = paper.questions.length? r.totalTimeMs/paper.questions.length : 0;
  r.avgAttempted = r.attempted? (r.timeCorrect+r.timeWrong)/r.attempted : 0;
  r.avgCorrect = r.correct? r.timeCorrect/r.correct : 0;
  r.avgWrong = r.wrong? r.timeWrong/r.wrong : 0;
  r.slowest=r.items.slice().filter(function(i){return i.time>0;}).sort(function(a,b){return b.time-a.time;}).slice(0,5);
  return r;
}
function isPersonalBest(r){
  if(!APP.history || APP.history.length<2) return false;
  var prior=APP.history.slice(0,-1);
  var best=prior.reduce(function(a,b){ return b.score>a.score? b:a; });
  return r.score>best.score;
}
/* Counts the score up rather than stamping it down. It is the one moment in the
   app worth dramatising, and it lands in well under a second. */
function animateScore(){
  var el=document.getElementById('score-count');
  if(!el) return;
  var target=Number(el.dataset.target)||0;
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce || target<=0){ el.textContent=num(target); return; }
  var t0=null, dur=760;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var eased=1-Math.pow(1-k,3);
    el.textContent=num(Math.round(target*eased*2)/2);
    if(k<1) requestAnimationFrame(step); else el.textContent=num(target);
  }
  requestAnimationFrame(step);
}
function prevAnswerFor(qnum){
  var rec=APP.prevRecord;
  if(!rec || !rec.resp || !APP.paper) return null;
  var idx=-1, qs=APP.paper.questions;
  for(var i=0;i<qs.length;i++){ if(qs[i].number===Number(qnum)){ idx=i; break; } }
  if(idx<0 || idx>=rec.resp.length) return null;
  var ch=rec.resp.charAt(idx);
  return (ch==='-')? 'skipped' : ch;
}
function prevAnswerLine(q,it){
  var prev=prevAnswerFor(q.number);
  if(!prev) return '';
  var same=(prev===(it.resp||'skipped'));
  var wasRight=(prev===q.correct);
  var note = same? 'same as last time' : (wasRight? 'you had it right last time' : 'also wrong last time');
  if(prev==='skipped' && !same) note='you skipped it last time';
  return '<div class="tiny" style="margin-top:6px;color:'+((!wasRight&&!same)?'var(--warn)':'var(--ink-muted)')+';">Last attempt: <strong>'+esc(prev)+'</strong> \u2014 '+note+'.</div>';
}
function buildInsights(r,attempt,paper){
  var out=[];
  var secs=Object.keys(r.bySection).map(function(n){
    var b=r.bySection[n]; return {name:n,acc:pct(b.correct,b.correct+b.wrong),score:b.score,att:b.correct+b.wrong,time:b.timeMs};
  });
  var strong=secs.slice().filter(function(s){return s.att>=3;}).sort(function(a,b){return b.acc-a.acc;})[0];
  var weak=secs.slice().filter(function(s){return s.att>=3;}).sort(function(a,b){return a.acc-b.acc;})[0];
  if(strong && strong!==weak) out.push({k:'good',t:shortSec(strong.name)+' is carrying your score \u2014 '+strong.acc+'% of what you attempted there was right.'});
  if(weak && weak.acc<60) out.push({k:'bad',t:shortSec(weak.name)+' is the leak: '+weak.acc+'% accuracy on '+weak.att+' attempts, costing you '+num(r.bySection[weak.name].wrong*MARK_WRONG)+' in negative marks.'});
  if(r.accuracy>=85 && r.attemptRate<75) out.push({k:'warn',t:'Your accuracy is high ('+r.accuracy+'%) but you only attempted '+r.attemptRate+'%. Speed, not knowledge, is what\u2019s capping this score.'});
  if(r.accuracy<65 && r.attemptRate>85) out.push({k:'bad',t:'You attempted almost everything at '+r.accuracy+'% accuracy. Leaving the weakest 10 alone would have scored more than answering them.'});
  if(r.fastWrong>=5) out.push({k:'warn',t:r.fastWrong+' wrong answers took under 20 seconds each \u2014 that pattern is guessing, and each one costs 0.5.'});
  if(r.slowWrong>=3) out.push({k:'warn',t:r.slowWrong+' wrong answers took over 90 seconds each. Those are concept gaps, not careless errors \u2014 and they ate '+fmtDur(r.slowWrong*90000)+'+.'});
  if(r.unattempted>=15) out.push({k:'warn',t:r.unattempted+' questions were never answered. Check whether you ran out of time or ran out of confidence.'});
  if(r.markedUnanswered>=3) out.push({k:'warn',t:'You marked '+r.markedUnanswered+' questions for review and never came back to them.'});
  if(r.avgWrong>r.avgCorrect*1.6 && r.wrong>=5) out.push({k:'warn',t:'Wrong answers took '+fmtDur(r.avgWrong)+' on average against '+fmtDur(r.avgCorrect)+' for right ones. When it drags, move on.'});
  var topics=Object.keys(r.byTopic).map(function(n){ var b=r.byTopic[n]; return {name:n,acc:pct(b.correct,b.correct+b.wrong),att:b.correct+b.wrong,total:b.total}; })
    .filter(function(t){return t.att>=2 && t.name!=='Untagged';}).sort(function(a,b){return a.acc-b.acc;});
  if(topics.length && topics[0].acc<50){
    out.push({k:'bad',t:'Weakest topics: '+topics.slice(0,3).map(function(t){return t.name+' ('+t.acc+'%)';}).join(', ')+'. Revise these before the next set.'});
  }
  if((attempt.pauseCount||0)>0) out.push({k:'warn',t:'You paused '+attempt.pauseCount+' time(s) for '+fmtDur(attempt.pausedMs||0)+'. The real exam has no pause \u2014 try the next set without one.'});
  if(r.unseen>=10) out.push({k:'bad',t:r.unseen+' questions were never even opened. Anything you never saw is a mark you could not have scored \u2014 do a fast first pass over the whole paper next time.'});
  var used=(attempt.elapsedMs||0), limit=(attempt.durationMinutes||60)*60000;
  if(used<limit*0.8 && r.unattempted>=10) out.push({k:'warn',t:'You finished with '+fmtDur(limit-used)+' unused and still left '+r.unattempted+' blank. That time was worth marks.'});
  if(APP.prevRecord){
    var d=r.score-APP.prevRecord.score;
    if(Math.abs(d)>=1) out.push({k:d>0?'good':'warn',t:(d>0?'Up ':'Down ')+num(Math.abs(d))+' marks against your last attempt at this paper ('+num(APP.prevRecord.score)+').'});
  }
  if(!out.length) out.push({k:'good',t:'Balanced attempt with no obvious leak. Push the attempt count up and hold this accuracy.'});
  return out;
}
function hbar(value,max,color){
  var w=(max>0 && isFinite(value))? clamp(Math.round((value/max)*100),0,100):0;
  return '<div class="meter"><span style="width:'+w+'%;background:'+color+';"></span></div>';
}
