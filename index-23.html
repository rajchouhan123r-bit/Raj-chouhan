<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>CGL Mock Test</title>
<style>
  :root{
    /* Day. No pure white anywhere: a paper-warm off-white scatters far less
       glare than #FFF on a phone held close. */
    --paper:#F4F1EA; --surface:#FDFBF7; --surface-2:#EBE7DD;
    --ink:#1B1F26; --ink-muted:#59606D; --border:#DBD5C9;
    --govt-blue:#1E3A5F; --govt-blue-ink:#FFFFFF; --govt-blue-tint:#E6EDF5;
    --brass:#8F6416; --success:#1D6B37; --success-tint:#E4F1E8;
    --danger:#B03A22; --danger-tint:#FAE9E4;
    --warn:#7F5A00; --warn-tint:#F9EFD6;
    --not-visited:#CFC9BC; --not-answered:#C6462F; --answered:#2A7F47; --marked:#71399A;
    --sec-1:#4B4392; --sec-2:#0F6B70; --sec-3:#8A5A10; --sec-4:#9B3B62;
    --sec-1-tint:#ECEAF6; --sec-2-tint:#E2F0F0; --sec-3-tint:#F6EEDF; --sec-4-tint:#F8E9EE;
    --radius-sm:6px; --radius:10px; --radius-lg:18px;
    --shadow:0 1px 2px rgba(20,23,28,0.06), 0 6px 20px rgba(20,23,28,0.08);
    --serif:Georgia,'Times New Roman',Times,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Consolas,monospace;
    --fs:1;
    --ease:cubic-bezier(.22,.9,.28,1);
    --ease-spring:cubic-bezier(.34,1.32,.5,1);
    --t-fast:140ms; --t-med:260ms; --t-slow:520ms;
  }
  /* Warm. Same layout, blue pulled out of the light. For reading at night
     without the screen acting like a small window onto noon. */
  [data-theme="warm"]{
    --paper:#F1E7D5; --surface:#FAF2E2; --surface-2:#E6D9BF;
    --ink:#2B2318; --ink-muted:#6A5A43; --border:#D9C9AB;
    --govt-blue:#2A4A5E; --govt-blue-ink:#FDF8EE; --govt-blue-tint:#E3E9E6;
    --brass:#8A5C10; --success:#3F6B2E; --success-tint:#E7EFDC;
    --danger:#A63E20; --danger-tint:#F6E4DA;
    --warn:#7A5405; --warn-tint:#F4E7C9;
    --not-visited:#CDBE9F; --not-answered:#B34A2C; --answered:#4A7C3C; --marked:#7A4A82;
    --sec-1:#4C4176; --sec-2:#1F6060; --sec-3:#8A5A10; --sec-4:#8E3D57;
    --sec-1-tint:#E8E2EE; --sec-2-tint:#DFEAE4; --sec-3-tint:#F2E6CC; --sec-4-tint:#F3E2E2;
    --shadow:0 1px 2px rgba(70,50,20,0.07), 0 6px 20px rgba(70,50,20,0.10);
  }
  /* Night. Charcoal, never #000: pure black beside light text makes the text
     bloom. Body text is softened off white for the same reason. */
  [data-theme="dark"]{
    --paper:#14171C; --surface:#1B1F26; --surface-2:#242932;
    --ink:#DFE3E9; --ink-muted:#98A1AE; --border:#303640;
    --govt-blue:#82A4CB; --govt-blue-ink:#0D0F12; --govt-blue-tint:#1D2836;
    --brass:#D2A44E; --success:#4FBB77; --success-tint:#132C1D;
    --danger:#E86B54; --danger-tint:#301C17;
    --warn:#DBAB42; --warn-tint:#2D2513;
    --not-visited:#3B404A; --not-answered:#C6503A; --answered:#35915A; --marked:#9463C6;
    --sec-1:#9A93E0; --sec-2:#4FB9BC; --sec-3:#D6A44E; --sec-4:#DE7EA0;
    --sec-1-tint:#20203A; --sec-2-tint:#122C2E; --sec-3-tint:#2C2415; --sec-4-tint:#301D26;
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;}
  .container{padding:18px 18px 28px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 4px;}
  h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em;}
  h2{font-size:18px;margin:0 0 10px;}
  h3{font-size:14px;margin:0 0 8px;}
  .muted{color:var(--ink-muted);font-size:13.5px;}
  .tiny{font-size:11.5px;color:var(--ink-muted);}
  .top-header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px;gap:10px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--ink-muted);cursor:pointer;flex:none;
  }
  .icon-btn:active{background:var(--surface-2);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 18px;border-radius:var(--radius);border:1px solid transparent;
    font-size:14.5px;font-weight:600;cursor:pointer;line-height:1.2;
  }
  .btn-primary{background:var(--govt-blue);color:var(--govt-blue-ink);}
  .btn-primary:active{opacity:.88;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .btn-ghost{background:transparent;color:var(--govt-blue);border-color:transparent;padding-left:6px;padding-right:6px;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{display:flex;width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .card-flat{box-shadow:none;}
  .ticket{border-left:4px solid var(--brass);position:relative;}
  .ticket-id{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);}
  .empty-state{text-align:center;padding:38px 16px;}
  .empty-state .icon-wrap{color:var(--ink-muted);margin-bottom:10px;display:flex;justify-content:center;}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .spacer{flex:1;}
  .divider{height:1px;background:var(--border);margin:14px 0;border:0;}
  .dropzone{
    border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:34px 16px;text-align:center;
    background:var(--surface);cursor:pointer;display:block;position:relative;overflow:hidden;
  }
  /* The input itself sits on top, invisible but full-size, so the tap lands
     directly on it. Hidden inputs fired through a label get blocked in
     sandboxed webviews, which is what stopped the picker opening. */
  .file-input-overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;z-index:3;
    cursor:pointer;font-size:0;
  }
  .dropzone-content{position:relative;z-index:1;pointer-events:none;}
  .dropzone .icon-wrap{color:var(--govt-blue);margin-bottom:10px;}
  input[type="text"], input[type="number"]{
    font-family:var(--sans);font-size:14.5px;padding:10px 12px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);color:var(--ink);width:100%;
  }
  select{
    font-family:var(--sans);font-size:13.5px;padding:8px 10px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
  }
  label.field-label{font-size:12.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px;}
  textarea{
    font-family:var(--mono);font-size:12px;line-height:1.45;padding:10px 12px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);color:var(--ink);width:100%;resize:vertical;
  }
  input[type="range"]{width:100%;accent-color:var(--govt-blue);}
  input[type="checkbox"]{width:18px;height:18px;accent-color:var(--govt-blue);flex:none;}
  .progress-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
  .progress-fill{height:100%;background:var(--govt-blue);transition:width .25s ease;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .badge-pdf{background:var(--success-tint);color:var(--success);}
  .badge-ai{background:var(--govt-blue-tint);color:var(--govt-blue);}
  .badge-unset{background:var(--danger-tint);color:var(--danger);}
  .badge-warn{background:var(--warn-tint);color:var(--warn);}
  table.review-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.review-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);padding:6px 6px;border-bottom:1px solid var(--border);}
  table.review-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.review-table tr:last-child td{border-bottom:none;}
  .qtext-trunc{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .section-edit-row{display:grid;grid-template-columns:1fr 60px 60px;gap:8px;align-items:center;margin-bottom:8px;}
  .section-edit-row input[type=number]{text-align:center;padding:8px 4px;}
  .notice{border-radius:var(--radius);padding:11px 13px;font-size:13px;line-height:1.45;margin-bottom:12px;}
  .notice-warn{background:var(--warn-tint);color:var(--warn);border:1px solid rgba(138,97,0,.25);}
  .notice-ok{background:var(--success-tint);color:var(--success);border:1px solid rgba(30,107,55,.2);}
  .notice-bad{background:var(--danger-tint);color:var(--danger);border:1px solid rgba(178,58,34,.22);}

  /* Test screen */
  .test-top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--border);}
  .test-top-inner{padding:10px 16px;}
  .paper-name-sm{font-size:12.5px;color:var(--ink-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
  .timer{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.02em;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2);}
  .timer.danger{color:#fff;background:var(--danger);animation:pulse 1.4s ease-in-out infinite;}
  .timer.paused{color:var(--warn);background:var(--warn-tint);}
  /* Sectional papers show two clocks: this section, and the paper. */
  .timer-stack{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .timer-sub{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-muted);letter-spacing:.02em;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.72;}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
  .section-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;-webkit-overflow-scrolling:touch;}
  .section-tabs::-webkit-scrollbar{display:none;}
  .section-tab{
    flex:none;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:600;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);white-space:nowrap;cursor:pointer;
  }
  .section-tab.active{background:var(--govt-blue);border-color:var(--govt-blue);color:var(--govt-blue-ink);}
  .q-wrap{padding:18px 18px 120px;flex:1;}
  .q-meta{font-size:12.5px;color:var(--ink-muted);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.03em;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .q-text{font-family:var(--serif);font-size:calc(18px * var(--fs));line-height:1.55;margin-bottom:18px;white-space:pre-wrap;overflow-wrap:anywhere;}
  .option-row{
    display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--border);
    border-radius:var(--radius);background:var(--surface);margin-bottom:10px;cursor:pointer;
  }
  .option-row.selected{border-color:var(--govt-blue);background:var(--govt-blue-tint);}
  .option-bubble{
    flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-muted);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-muted);
  }
  .option-row.selected .option-bubble{background:var(--govt-blue);border-color:var(--govt-blue);color:var(--govt-blue-ink);}
  .option-text{font-family:var(--serif);font-size:calc(16px * var(--fs));line-height:1.5;color:var(--ink);padding-top:2px;flex:1;min-width:0;overflow-wrap:anywhere;}
  .option-fig{max-width:150px;}
  .test-footer{
    position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6;
  }
  .test-footer-inner{max-width:720px;margin:0 auto;display:flex;gap:8px;}
  .btn-lg{padding:17px 20px;font-size:16.5px;border-radius:var(--radius);}
  .nav-icon{flex:none;width:46px;padding-left:0;padding-right:0;}
  .fab-grid{
    position:fixed;right:16px;bottom:96px;width:48px;height:48px;border-radius:50%;
    background:var(--govt-blue);color:var(--govt-blue-ink);display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);cursor:pointer;z-index:6;
  }
  .overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,12,16,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
  .drawer{
    background:var(--paper);width:100%;max-width:720px;max-height:82vh;border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;
  }
  .drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);}
  .legend-dot{width:12px;height:12px;border-radius:4px;flex:none;}
  .palette-section-title{font-size:12px;font-weight:700;color:var(--ink-muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
  .palette-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .palette-btn{
    aspect-ratio:1;border-radius:8px;border:2px solid transparent;font-weight:700;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:var(--not-visited);
    padding:0;font-family:inherit;   /* it is a real <button> now, so reset the UA padding */
  }
  .palette-btn.not-visited{color:var(--ink);}
  .palette-btn.not-answered{background:var(--not-answered);}
  .palette-btn.answered{background:var(--answered);}
  .palette-btn.marked{background:var(--marked);}
  .palette-btn.answered-marked{background:var(--answered);box-shadow:inset 0 0 0 3px var(--marked);}
  .palette-btn.current{border-color:var(--brass);}
  .center-modal-wrap{align-items:center;padding:20px;}
  .modal-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow);}

  /* Passage + figures */
  .passage-card{
    border:1px solid var(--border);border-left:4px solid var(--govt-blue);background:var(--surface);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;
  }
  .passage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;}
  .passage-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--govt-blue);}
  .passage-body{font-family:var(--serif);font-size:calc(15.5px * var(--fs));line-height:1.6;margin-top:10px;white-space:pre-wrap;max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .figure-card{
    border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);
    padding:12px;margin-bottom:16px;text-align:center;
  }
  .figure-card svg{max-width:100%;height:auto;display:block;margin:0 auto;}
  .figure-cap{font-size:11.5px;color:var(--ink-muted);margin-top:8px;text-align:center;}
  table.fig-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);}
  table.fig-table th,table.fig-table td{border:1px solid var(--border);padding:7px 8px;text-align:center;}
  table.fig-table th{background:var(--govt-blue-tint);font-weight:700;font-size:12px;}
  .fig-regen{margin-top:8px;}

  /* Pause */
  .pause-wrap{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--paper);
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .pause-inner{max-width:340px;}
  .pause-clock{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.02em;margin:10px 0 4px;}

  /* Results */
  .score-hero{text-align:center;padding:22px 16px 6px;}
  .score-num{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;}
  .score-den{font-family:var(--serif);font-size:22px;color:var(--ink-muted);}
  .stat-row{display:flex;gap:10px;margin:16px 0;}
  .stat{flex:1;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;}
  .stat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
  .stat-val{font-size:19px;font-weight:700;font-family:var(--serif);}
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;}
  .kpi-val{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.1;}
  .kpi-lab{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .meter{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex;}
  .meter span{height:100%;display:block;}
  table.sec-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.sec-table th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-muted);padding:6px 4px;border-bottom:1px solid var(--border);font-weight:700;}
  table.sec-table td{padding:8px 4px;border-bottom:1px solid var(--border);}
  table.sec-table tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;}
  .insight{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);}
  .insight:last-child{border-bottom:none;}
  .insight-ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
  .insight-ic.good{background:var(--success-tint);color:var(--success);}
  .insight-ic.bad{background:var(--danger-tint);color:var(--danger);}
  .insight-ic.warn{background:var(--warn-tint);color:var(--warn);}
  .insight-txt{font-size:13.5px;line-height:1.45;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);white-space:nowrap;
  }
  .chip.active{background:var(--govt-blue);border-color:var(--govt-blue);color:var(--govt-blue-ink);}
  .review-item{border-bottom:1px solid var(--border);padding:10px 2px;}
  .review-item:last-child{border-bottom:none;}
  .result-icon{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .result-icon.ok{background:var(--success);}
  .result-icon.bad{background:var(--danger);}
  .result-icon.skip{background:var(--not-visited);color:var(--ink);}
  .review-detail{margin-top:8px;padding:12px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:14px;line-height:1.5;}
  .ans-pill{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:700;font-size:12.5px;font-family:var(--mono);}
  .ans-pill.ok{background:var(--success-tint);color:var(--success);}
  .ans-pill.bad{background:var(--danger-tint);color:var(--danger);}

  /* Dragging a file anywhere over the window. */

  /* ---------------- motion ----------------

  @keyframes riseIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  @keyframes fromRight{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  @keyframes fromLeft{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
  @keyframes popIn{0%{transform:scale(.55);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);opacity:1;}}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @keyframes shimmer{0%{background-position:-220px 0;}100%{background-position:220px 0;}}
  @keyframes ringFlash{0%,100%{transform:scale(1);}45%{transform:scale(1.14);}}

  .screen-anim{animation:riseIn var(--t-med) var(--ease) both;}
  .q-anim.fwd{animation:fromRight var(--t-med) var(--ease) both;}
  .q-anim.back{animation:fromLeft var(--t-med) var(--ease) both;}
  .stagger>*{animation:riseIn var(--t-med) var(--ease) backwards;}
  .stagger>*:nth-child(1){animation-delay:0ms;}
  .stagger>*:nth-child(2){animation-delay:45ms;}
  .stagger>*:nth-child(3){animation-delay:90ms;}
  .stagger>*:nth-child(4){animation-delay:135ms;}
  .stagger>*:nth-child(5){animation-delay:180ms;}
  .stagger>*:nth-child(6){animation-delay:215ms;}
  .stagger>*:nth-child(n+7){animation-delay:250ms;}

  /* a tap should feel like it landed */
  .btn,.chip,.option-row,.palette-btn,.icon-btn,.fs-btn,.section-tab{
    transition:transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease),

  .toast{animation:toastUp 220ms var(--ease) both;}

  .meter span{transition:width var(--t-slow) var(--ease);}
  .progress-fill,.mini-bar span{transition:width var(--t-slow) var(--ease);}
  .hbar-fill{transition:width var(--t-slow) var(--ease);}

  .ring-wrap{position:relative;width:38px;height:38px;flex:none;}

  .ring-num{
    position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;

    background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);

  /* One hue per section, carried across tabs, palette, results and charts so a

  .sec-c2{--sec:var(--sec-2);--sec-tint:var(--sec-2-tint);}
  .sec-c3{--sec:var(--sec-3);--sec-tint:var(--sec-3-tint);}
  .sec-c4{--sec:var(--sec-4);--sec-tint:var(--sec-4-tint);}
  .section-tab .sec-icon{color:var(--sec,var(--ink-muted));}

  .section-tab.active .sec-icon{color:var(--sec,var(--govt-blue));}
  .sec-chip{display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--sec,var(--govt-blue));margin-right:7px;vertical-align:-2px;}
  .palette-section-title{color:var(--sec,var(--ink-muted));}
  td .sec-icon{color:var(--sec,var(--ink-muted));}
  @supports not (aspect-ratio: 1 / 1){ .palette-btn{height:42px;} }
  /* Everything tappable clears 44px. A mis-tap on a section tab during a timed

  .icon-btn{min-width:44px;min-height:44px;}
  .section-tab{min-height:44px;display:inline-flex;align-items:center;}

  .chip{min-height:40px;display:inline-flex;align-items:center;}
  .fs-btn{width:44px;height:44px;}
  .nav-icon{width:52px;}
  .palette-btn{min-height:44px;}

    min-width:44px;min-height:44px;border-radius:8px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;
  }

    clip:rect(0 0 0 0);white-space:nowrap;border:0;

  .page-shot{

  .hidden{display:none !important;}
  .footer-note{text-align:center;padding:18px 16px 30px;font-size:12px;color:var(--ink-muted);}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:40;

    box-shadow:var(--shadow);max-width:90%;text-align:center;

  [data-view="desktop"] .section-tabs{padding:8px 34px 10px;}
  [data-view="desktop"] .test-body{
    display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;

    .test-footer,.fab-grid,.icon-btn,.btn,.chips{display:none !important;}

<div id="app"></div>
<div id="toast-host" role="status" aria-live="polite"></div>
<div id="sr-live" aria-live="polite" class="visually-hidden"></div>
<script>
/* ==========================================================================
   CGL Mock Test — one file, no build step, no dependencies to install.

   It reads a question paper out of a PDF, draws its diagrams, fills in an
   answer key, then runs the paper as a timed, scored mock test. Everything is
   kept on the device.

   The file is one script on purpose: it has to work opened from a phone's
   Downloads folder with no server, and a single file is the only thing that
   reliably does. Read it in this order — each section is marked with a banner
   comment of the same name.

     PDF READER            fetching pdf.js, only when a PDF is actually chosen
     ICONS, CONSTANTS      inline SVG, marking scheme, app state
     UTIL                  formatting, escaping, small helpers
     STORAGE               IndexedDB, with localStorage and memory behind it
     CLAUDE API            the in-conversation engine, used when no key is set
     INSTALLING/UPDATES    service worker, install prompt, stray-copy warning
     DIAGNOSIS             what is actually wrong, asked one question at a time
     BACKUP                one file that carries a whole library between devices
     ANSWER ENGINE         the key pool: providers, lanes, scheduler, transport
     PDF READING           layout-aware text extraction and page rendering
     PARSERS               three parsers, scored against each other
     FIGURE REDRAW         cropping a question out and rebuilding its diagram
     READING A PAGE        the fallbacks: text-to-model, then picture-to-model
     PIPELINE              processPdf: everything above, in order
     ANSWER KEY            compact marking, brute-force rounds, cross-checking
     PROGRESS / PRACTICE   history across papers, drills, section timing
     SECTIONS / SCORING    marking, results, insights
     RENDER                one function per screen, all strings
     ACTIONS               everything a tap can do
     SECTIONAL TIMING      per-section clocks
     BACKGROUND            wake lock and notifications
     TIMER, THEME, VIEW    clocks, colour schemes, phone/desktop layout
     EVENTS                one delegated listener, keyboard, swipe, drag-drop
     INIT                  storage first, then everything else
   ========================================================================== */

/* ============ PDF READER, LOADED ONLY IF IT IS NEEDED ============
   pdf.js is about a third of a megabyte and it used to be fetched from a CDN
   before the page could paint — on every single start, including the ones that
   never touch a PDF. The built-in paper, every .json paper and every attempt
   already saved need it not at all. It is now fetched the moment the upload
   screen opens, in the background, and awaited only when a PDF is actually
   chosen. Cold start no longer waits on the network. */
var PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
var PDF_LIB={state:'idle',error:''};   // idle | loading | ready | failed
var _pdfLibPromise=null;
function ensurePdfLib(){
  if(typeof pdfjsLib!=='undefined'){
    PDF_LIB.state='ready';
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js'; }catch(e){}
    return Promise.resolve(pdfjsLib);
  }
  if(_pdfLibPromise) return _pdfLibPromise;
  PDF_LIB.state='loading';
  _pdfLibPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src=PDFJS_BASE+'pdf.min.js';
    s.async=true;
    s.onload=function(){
      if(typeof pdfjsLib==='undefined'){
        PDF_LIB.state='failed'; _pdfLibPromise=null;
        reject(new Error('The PDF reader loaded but did not start.'));
        return;
      }
      PDF_LIB.state='ready';
      try{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js'; }catch(e){}
      resolve(pdfjsLib);
    };
    s.onerror=function(){
      PDF_LIB.state='failed'; _pdfLibPromise=null;
      PDF_LIB.error='The PDF reader could not be downloaded.';
      reject(new Error('The PDF reader could not be downloaded. Check your connection, or load a .json paper file instead — those need no internet.'));
    };
    document.head.appendChild(s);
  });
  return _pdfLibPromise;
}
/* Warm it up as soon as the upload screen is opened, so choosing a PDF finds
   it already there rather than starting the download then. */
function prefetchPdfLib(){ if(PDF_LIB.state==='idle') ensurePdfLib().catch(function(){}); }

/* ============ ICONS ============ */
var ICON = {

/* Runs jobs with a small concurrency cap so 100 questions don't fire at once. */
async function pMap(items,fn,concurrency){

    workers.push((async function(){

/* ============ STORAGE ============
   Four tiers so the same file works everywhere: Claude's artifact storage when
   it exists, otherwise IndexedDB, otherwise the browser's localStorage,
   otherwise memory.

   megabytes — which is why page pictures were thrown away mid-import, why a
   paper could fail to save at all, and why the library was capped around fifty

   rather than blocking, and is what browsers actually intend for this. Anything

  return navigator.storage.estimate().then(function(e){
    STORAGE_QUOTA={usage:e.usage||0,quota:e.quota||0,at:Date.now()};
    return STORAGE_QUOTA;
  },function(){ return STORAGE_QUOTA; });
}
function measureUsage(){
  if(_usage.at && (Date.now()-_usage.at)<5000) return _usage;
  var total=0, per={};
  if(STORAGE_TIER==='indexeddb'){
    var idx=sizeIndex();
    Object.keys(idx).forEach(function(k){
      var len=idx[k]+k.length;
      total+=len;
      var m=k.match(/^(?:paper|paperfig|paperpages):(.+)$/);
      if(m) per[m[1]]=(per[m[1]]||0)+len;
    });
  }else{
    try{
      Object.keys(localStorage).forEach(function(k){
        if(k.indexOf('cgl:')!==0) return;
        var len=(localStorage.getItem(k)||'').length+k.length;
        total+=len;
        var m2=k.match(/^cgl:(?:paper|paperfig|paperpages):(.+)$/);
        if(m2) per[m2[1]]=(per[m2[1]]||0)+len;
      });
    }catch(e){ total=0; per={}; }
  }
  _usage={at:Date.now(),total:total,perPaper:per};
  return _usage;
}
function storageUsageBytes(){ return measureUsage().total; }
function paperSizeBytes(id){ return measureUsage().perPaper[id]||0; }
function storageCapBytes(){
  if(STORAGE_TIER==='indexeddb' && STORAGE_QUOTA.quota) return STORAGE_QUOTA.quota;
  if(STORAGE_TIER==='indexeddb') return 200*1048576;    // conservative until the browser says
  return 5*1048576;
}
function fmtKB(b){
  if(b>1073741824) return (b/1073741824).toFixed(1)+' GB';
  return b>1048576? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';
}
function storageTierName(){
  return {artifact:'this conversation',indexeddb:'this device (IndexedDB)',
          localstorage:'this browser (small store)',memory:'nowhere — this tab only'}[STORAGE_TIER]||STORAGE_TIER;
}

/* ============ CLAUDE API ============ */
/* Retries on rate-limit / overload so a single blip doesn't silently drop a
   question, which is what left blanks in the answer key before. */
/* Once we know the API can't be reached (running as a plain file in a browser,
   where there's no key and CORS blocks it), fail instantly instead of grinding
   through hundreds of doomed retries and looking frozen. */
var API_UNAVAILABLE=false;
var CLAUDE_MODEL='claude-sonnet-5';
async function probeApi(){
  /* One token is enough to learn whether the endpoint answers at all. Asking
     for a whole sentence meant waiting on real inference just to find out
     there was no route to it.

     A failed probe used to latch API_UNAVAILABLE for the rest of the session,
     so one blip on a train meant "no answer engine" until the app was
     reopened. Only an outright refusal is permanent now; anything else is
     worth trying again. */
  try{ await callClaude('ok',null,0,{maxTokens:4}); API_UNAVAILABLE=false; return true; }
  catch(e){ return false; }
}
async function callClaude(text,imageBase64,attempt,opts){
  attempt=attempt||0; opts=opts||{};
  if(API_UNAVAILABLE) throw new Error('Claude is not reachable from here');
  var content=[];
  if(imageBase64){ content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageBase64}}); }
  content.push({type:'text',text:text});
  var resp;
  try{
    resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:opts.maxTokens||2000,messages:[{role:'user',content:content}]})
    });
  }catch(netErr){
    if(attempt<2){ await sleep(700*(attempt+1)); return callClaude(text,imageBase64,attempt+1,opts); }
    throw new Error('Network error reaching Claude');
  }
  if(resp.status===429 || resp.status===529 || resp.status>=500){
    if(attempt<4){ await sleep(1200*Math.pow(1.7,attempt)); return callClaude(text,imageBase64,attempt+1,opts); }
  }
  if(resp.status===401||resp.status===403){ API_UNAVAILABLE=true; throw new Error('No API access from here'); }
  if(!resp.ok){
    var t=''; try{ t=await resp.text(); }catch(e){}
    throw new Error('API error '+resp.status+' '+t.slice(0,140));
  }
  var data=await resp.json();
  return (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
}
/* Tolerates fences, stray prose, and responses cut off mid-object. */
function extractJsonLoose(raw){
  if(!raw) return null;
  var t=String(raw).trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{ return JSON.parse(t); }catch(e){}
  var arrM=t.match(/\[[\s\S]*\]/); if(arrM){ try{ return JSON.parse(arrM[0]); }catch(e){} }
  var objM=t.match(/\{[\s\S]*\}/); if(objM){ try{ return JSON.parse(objM[0]); }catch(e){} }
  // salvage a truncated array/object by trimming back to the last complete entry
  var cut=t.lastIndexOf('}');
  if(cut>0){
    var head=t[0]==='['?'[':'{';
    var body=t.slice(t.indexOf(head), cut+1);
    try{ return JSON.parse(body+(head==='['?']':'}')); }catch(e){}
  }
  return null;
}
/* ============ INSTALLING ============
   Served from a real address this registers a service worker, which is what
   lets Chrome offer "Install app" and what makes the whole thing work with no
   connection. Opened as a plain file it all quietly does nothing. */
function isStandalone(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  }catch(e){ return false; }
}
function canInstall(){ return !!APP.installPrompt && !isStandalone(); }
function initPwa(){
  APP.installed=isStandalone();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      APP.swReady=true;
      reg.addEventListener('updatefound',function(){
        var w=reg.installing;
        if(!w) return;
        w.addEventListener('statechange',function(){
          if(w.state==='installed' && navigator.serviceWorker.controller){
            APP.updateReady=true;
            toast('A new version is ready \u2014 reopen the app to use it.');
          }
        });
      });
    }).catch(function(){});
  }
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    APP.installPrompt=e;
    if(APP.screen==='home'||APP.screen==='settings'){ APP._keepScroll=true; renderApp(); }
  });
  window.addEventListener('appinstalled',function(){
    APP.installPrompt=null; APP.installed=true;
    requestPersistence(true);
    toast('Installed. Open it from your home screen from now on.');
    APP._keepScroll=true; renderApp();
  });
}
async function doInstall(){
  var p=APP.installPrompt;
  if(!p){ toast('Use Chrome\u2019s menu \u203a Add to Home screen.'); return; }
  APP.installPrompt=null;
  try{
    p.prompt();
    var res=await p.userChoice;
    if(res && res.outcome==='accepted'){ APP.installed=true; }
    else { toast('You can install later from Chrome\u2019s menu.'); }
  }catch(e){}
  APP._keepScroll=true; renderApp();
}

/* ============ UPDATES ============

function renderUpdateCard(){

/* ============ DIAGNOSIS ============
   Guessing at why a request failed has cost days. This asks the questions
   directly and reports exactly what came back, in a form that can be copied
   and sent on. */
async function diagnoseLane(lane){
  var p=providerOf(lane);
  var out={key:!!lane.key, provider:p.id, providerName:p.name, shape:null,
           status:null, message:null, models:null, verdict:''};
  if(!lane.key){ out.verdict='No key saved.'; return out; }
  out.shape = (p.detect && p.detect.test(lane.key))? ('looks like a '+p.name+' key')
            : (p.detect? ('does NOT look like a '+p.name+' key') : 'shape not checkable for this service');
  if(!isOnline()){ out.verdict='This device reports no internet connection.'; return out; }
  var r=await probeLane(lane,18000);
  out.status=r.status;
  out.message=r.error||null;
  if(r.ok){
    out.models=(r.models||[]).length;
    if(r.models && r.models.length){
      lane.models=r.models.filter(function(m){ return !DEAD_MODELS[m]; });
      if(!lane.model || DEAD_MODELS[lane.model] || lane.models.indexOf(lane.model)<0){
        lane.model=pickDefaultModel(lane.models,lane.provider);
      }
    }
    /* Listing the models proves the key is valid. It does not prove the model
       this key is SET to still works, and that is the failure that was
       actually happening: the diagnosis said "working" on every key while
       every real request came back "gemini-2.5-flash-lite is no longer
       available to new users". A check that cannot see the thing that is
       broken is worse than no check, because it sends you looking elsewhere.

       So it now sends one real request on the key's own model. If that model
       has been retired the recovery above moves the key and the verdict says
       so — which makes this button the thing that actually unsticks the app
       rather than the thing that reassures you while it stays stuck. */
    var was=lane.model;
    try{
      await providerPost(lane,{text:'Reply with the single word ok.',json:false,
                               maxTokens:8,temperature:0,think:0},0,
                         {timeout:15000,budget:16000,netTries:0,rateTries:0});
      out.model=lane.model;
      out.movedFrom=(lane.model!==was)? was : null;
      out.verdict=out.movedFrom
        ? ('Working. '+out.movedFrom+' had been retired by '+p.maker+', so this key was moved to '+lane.model+'.')
        : ('Working on '+lane.model+'.');
    }catch(e){
      var em=(e&&e.message)||String(e);
      out.model=lane.model;
      out.movedFrom=(lane.model!==was)? was : null;
      if(e&&e.quotaSpent){
        out.verdict='The key is valid, but its free allowance for today is used up. Google resets these at midnight US Pacific time.';
      }else if(e&&e.rateLimited){
        out.verdict='The key works but is rate limited this minute. It will carry on by itself.';
      }else{
        out.verdict='The key is valid, but a request on '+lane.model+' failed \u2014 '+em;
      }
    }
  }else if(r.blocked || r.status===0){
    out.verdict=p.name+' could not be reached from a web page. '+browserBlockNote(p);
  }else if(r.status===400){
    out.verdict=p.name+' rejected the key as malformed. Make a new one at '+p.where+'.';
  }else if(r.status===401||r.status===403){
    out.verdict=p.name+' refused the key. Either it is not a '+p.maker+' API key, or its billing or free tier is not active.';
  }else if(r.status===429){
    out.verdict='The key works but is rate limited right now. Wait a minute.';
  }else{
    out.verdict=p.name+' answered with status '+r.status+(r.error? (' — '+r.error):'')+'.';
  }
  return out;
}
async function runDiagnostics(){
  APP.diag={running:true};
  renderApp();
  var d={
    at:new Date().toISOString(),
    build:APP_VERSION,
    where:hostKind(),
    url:location.origin,
    online:isOnline(),
    standalone:isStandalone(),
    serviceWorker:('serviceWorker' in navigator)? (APP.swReady? 'active':'not registered') : 'unsupported',
    pdfReader:{ready:'loaded',loading:'still downloading',failed:'could NOT be downloaded',idle:'not needed yet (loads when a PDF is chosen)'}[PDF_LIB.state],
    storagePersisted:STORAGE_STATE.persisted,
    quotaMB:STORAGE_STATE.quotaMB,
    papers:APP.library.length
  };
  /* Every key is checked, not just the first: "the app cannot reach Google" and
     "the third key you pasted is a Maps key" look identical from one probe. */
  try{
    d.keys=await Promise.all(AI.keys.map(function(l,i){
      return diagnoseLane(l).then(function(g){ g.name=laneName(l,i); return g; },
        function(e){ return {name:laneName(l,i),verdict:'Check failed: '+((e&&e.message)||e)}; });
    }));
  }catch(e){ d.keys=[]; }
  d.gemini=(d.keys&&d.keys.length)? (d.keys.filter(function(g){return /Working/.test(g.verdict||'');})[0]||d.keys[0])
                                  : {key:false,verdict:'No key saved yet.'};
  d.keysWorking=(d.keys||[]).filter(function(g){ return /Working/.test(g.verdict||''); }).length;
  APP.diag={running:false,data:d};
  renderApp();
}

function renderDiagCard(){

       row('Google reachable',g.reachable===null?'not tested':(g.reachable?'yes':'no'),g.reachable)+
       (g.status? row('Google replied',g.status+(g.message?(' \u2014 '+String(g.message).slice(0,90)):''),g.status===200):'')+
       '</div>'+
       ((d.keys&&d.keys.length>1)

           }).join('')+'</div>'
         : '')+
       '<div class="notice '+(/Working/.test(g.verdict||'')?'notice-ok':'notice-warn')+'" style="margin-top:10px;margin-bottom:0;">'+esc(g.verdict||'')+'</div>'+
       '<div style="height:10px"></div>'+

/* ============ BACKUP ============
   A downloaded page does not always get the same storage back when it is
   reopened, and a new build is a new file. One backup file carries everything
   across: papers, attempts, scores and settings — and it is the same file that
   moves a whole library from a phone to a laptop. */
var BACKUP_TAG='cgl-backup-v1';
async function collectBackup(){
  var data={};
  if(STORAGE_TIER==='indexeddb'){
    try{
      var ks=(await idbKeys())||[], vs=(await idbValues())||[];
      for(var i=0;i<ks.length;i++){
        var k=String(ks[i]);
        if(k.indexOf('__')===0) continue;
        if(typeof vs[i]==='string') data[k]=vs[i];
      }
    }catch(e){}
  }
  try{
    Object.keys(localStorage).forEach(function(k){
      if(k.indexOf('cgl:')!==0) return;
      var kk=k.slice(4);
      if(data[kk]===undefined) data[kk]=localStorage.getItem(k);
    });
  }catch(e){}
  for(var mk in _memStore){ if(_memStore.hasOwnProperty(mk) && data[mk]===undefined) data[mk]=_memStore[mk]; }
  return {tag:BACKUP_TAG,savedAt:Date.now(),papers:(APP.library||[]).length,data:data};
}
function backupFileName(){
  var d=new Date();
  return 'cgl-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
}
async function saveBackup(){
  var b=await collectBackup();
  var n=Object.keys(b.data).length;
  if(!n){ toast('There is nothing saved to back up yet.'); return; }
  var okDl=downloadText(backupFileName(),JSON.stringify(b),'application/json');
  toast(okDl? ('Backup saved \u2014 '+b.papers+' paper(s), '+n+' items.') : 'Couldn\u2019t save the file here.');
}
/* Straight into whatever the device uses to move a file — AirDrop, Nearby
   Share, WhatsApp, Drive. Getting a library from a phone onto a laptop was a
   download, a cable and a file manager; now it is one tap and a share sheet. */
async function shareBackup(){
  var b=await collectBackup();
  var n=Object.keys(b.data).length;
  if(!n){ toast('There is nothing saved to send yet.'); return; }
  var json=JSON.stringify(b);
  var name=backupFileName();
  try{
    if(navigator.canShare && typeof File!=='undefined'){
      var f=new File([json],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:'CGL Mock Test backup',
          text:b.papers+' paper(s). Open the app on the other device, go to settings, and restore from this file.'});
        return;
      }
    }
  }catch(e){
    if(e && e.name==='AbortError') return;      // the share sheet was dismissed
  }
  var ok=downloadText(name,json,'application/json');
  toast(ok? 'This device has no share sheet \u2014 the backup was saved to your files instead.'
          : 'Couldn\u2019t share or save the backup here.');
}
async function applyBackup(obj){
  if(!obj || obj.tag!==BACKUP_TAG || !obj.data || typeof obj.data!=='object'){
    throw new Error('That is not a backup file from this app.');
  }
  var keys=Object.keys(obj.data), written=0;
  for(var i=0;i<keys.length;i++){
    var raw=obj.data[keys[i]];
    try{
      var val=JSON.parse(raw);
      var ok=await storSet(keys[i],val);
      if(ok) written++;
    }catch(e){}
  }
  return written;
}
async function restoreBackupFromText(txt){
  var obj=null;
  try{ obj=JSON.parse(txt); }catch(e){ obj=extractJsonLoose(txt); }
  if(!obj) throw new Error('That file could not be read.');
  var n=await applyBackup(obj);
  toast(n+' items restored. Reloading\u2026');
  setTimeout(function(){ try{ location.reload(); }catch(e){} },900);
  return n;
}
async function restoreBackupFile(file){
  try{
    var txt=await readFileAsText(file);
    await restoreBackupFromText(txt);
  }catch(err){
    APP.settingsMsg={ok:false,text:(err && err.message)||'Restore failed.'};
    renderApp();
  }
}
async function restorePastedBackup(){
  var el=document.getElementById('backup-paste-input');
  var txt=(el && el.value || '').trim();
  if(!txt){ toast('Paste the backup text first.'); return; }
  try{ await restoreBackupFromText(txt); }
  catch(err){ APP.settingsMsg={ok:false,text:(err && err.message)||'Restore failed.'}; renderApp(); }
}

/* ============ ANSWER ENGINE ============

function scoreModel(n){

  if(/pro|opus/i.test(n)) s-=20;

     often a few dozen requests a day, sometimes none at all, against a
     thousand for a stable lite model. On a paid key it barely matters; on the
     free tier it is the whole difference between finishing a paper and running
     dry on page four. They go last. */
  if(/preview|exp\b|experimental|-\d{4}|latest-\d/i.test(n)) s-=34;
  /* "lite" used to be marked DOWN here, as the lower-quality option. That is
     the right call when requests are unlimited and the wrong one on a free
     key, where a lite model's daily allowance is several times larger — and
     running dry half way through a paper costs far more than the small
     difference in how well it reads a multiple-choice question. This app is
     built around free keys, so lite leads. The model dropdown on each key
     overrides it for anyone on a paid plan. */
  /* Worth less than one major version step (six), so a lite model one whole
     generation behind does not out-rank a current one. It decides ties and
     near-ties, which is where it belongs. */
  if(/lite/i.test(n)) s+=4;
  if(/thinking|reason/i.test(n)) s-=6;

function pickDefaultModel(list,provider){

     the side is not one of them. */

    columns:regions.length, colBounds:colBounds, gaps:gaps, imgOps:imgOps, pathOps:pathOps,

/* Pages are independent, so they are pulled several at a time instead of one
   after another. On a sixty-page paper this is the difference between a long
   blank wait and a progress bar that actually moves. */

    while(true){

      catch(e){ pages[i]={pageNum:i+1,text:'',lines:[],width:600,height:850,gutter:0,gaps:[],imgOps:0,pathOps:0,graphic:false}; }

   has no text layer. They are never shown during a test and only the small
   copies are saved with the paper.

   because browser storage stops at about five megabytes. The copy that gets
   sent to be read is rendered as large as the scan-quality setting allows,
   because a model cannot read a graph axis off a thumbnail — which is most of
   why diagrams used to come back wrong or invented. */

   follows costs almost nothing by comparison, and takes a thousand times
   longer. Tying the two together meant a whole pool of keys sat idle behind a

/* ---- taking the answer off the page ----

   right option, red crosses on the other three, and on these papers the option
   text itself is coloured to match. That is why the page was hidden during a
   test — showing it hands over the answer.

   But the marks are exactly what the key reader already finds, to the point, so
   they can be taken off instead of the whole page being withheld. The colour is
   drained out of the marked rows so a coloured option reads as ordinary text,
   and the tick or cross itself — a small isolated blob out at the margin — is
   painted out. What is left is the question, the diagram and the four options,
   which is the page the candidate was meant to see.

   it most: the ones with no text layer, where every question is a picture and

       the blob only as far as a real break, or it swallows the "1." after it —
       which left options with no numbers at all. */

             leaving that behind left a ghost whose SHAPE still said which
             option it was — a tick reads differently from a cross even in
             outline. */

/* Beside each question these papers print a box: Question ID, Status, and
   "Chosen Option" — what the candidate who sat it picked. That is not the key,
   but it is a strong hint at it, and it has no business being visible while
   somebody is trying to answer the question themselves.

   It has no text layer to find it by on these scans, so it is found by its
   border: a light grey rule running across the right-hand part of the page,
   with its pair below it. The block around the question itself is ruled the
   same way but runs nearly the full width, which is what tells them apart. */
function findMetaBoxes(ctx,scale,W,H){
  var d;
  try{ d=ctx.getImageData(0,0,W,H).data; }catch(e){ return []; }

      var mx=Math.max(R,G,B), mn=Math.min(R,G,B);

         whose border happened to sit under the logo was the one box left
         showing its "Chosen Option". */
      var grey=(mx-mn)<62 && mx>=138 && mx<=232;
      if(grey){ if(start<0){ start=x; run=0; } run++; gap=0; }
      else if(start>=0 && ++gap>2){

        start=-1; run=0;
      }
    }
    if(start>=0 && (!best || run>best.run)) best={x0:start,x1:W-1,run:run};
    if(!best) continue;
    var w=best.x1-best.x0+1;
    /* Wide enough to be a box side, narrow enough not to be the question
       block, and out to the right of the page. */
    if(w<W*0.22 || w>W*0.62 || best.x0<W*0.42) continue;
    var last=edges[edges.length-1];
    if(last && (y-last.y1)<=2 && Math.abs(last.x0-best.x0)<W*0.06){ last.y1=y; continue; }
    edges.push({y0:y,y1:y,x0:best.x0,x1:best.x1});

     line above a question pairs with one below it and the "box" blanked out the
     question's own text — which is worse than anything it was hiding. */

    if(x<0||x>=W) return 0;

      var i=(y*W+x)*4, R=d[i], G=d[i+1], B=d[i+2];

    var x0=Math.min(a.x0,b.x0), x1=Math.max(a.x1,b.x1);
    var ya=a.y1+2, yb=b.y0-2;
    if(yb<=ya) continue;
    if(sideRuns(x0+1,ya,yb)<0.7 || sideRuns(x1-1,ya,yb)<0.7) continue;
    boxes.push({x0:x0, x1:x1, y0:a.y0, y1:b.y1});
    e++;

}
/* The same page, with the printed key taken off it. */

/* rect is in unscaled page units, top-down. */
/* The box that actually has something in it. Anything paler than the cutoff
   counts as paper — which includes the very faint watermark these papers carry
   diagonally across the page, and that is deliberate: trimming to a watermark
   would leave the whole page every time. */
function inkBounds(ctx,w,h){
  var pad=6, step=Math.max(1,Math.round(Math.min(w,h)/260));
  var d;
  try{ d=ctx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  var nx=Math.ceil(w/step), ny=Math.ceil(h/step);
  var col=new Uint16Array(nx), row=new Uint16Array(ny);
  var any=false;
  for(var y=0,ry=0;y<h;y+=step,ry++){
    var base=y*w*4;
    for(var x=0,rx=0;x<w;x+=step,rx++){
      var i=base+x*4;
      /* Ink, not tint: the pink watermark is light and, more to the point,
         barely differs across its channels once printed faintly. A real mark
         is dark in all three. */
      if(d[i]<205 && d[i+1]<205 && d[i+2]<205){ col[rx]++; row[ry]++; any=true; }
    }
  }
  if(!any) return null;
  /* These papers box every question in a frame, and that frame runs the full
     height and width of the crop. It is ink, so a plain bounding box stops at
     it and the trim achieves nothing — the right-hand rule alone was holding
     two thirds of an empty page open. A line spanning almost the whole crop is
     a rule, not content, so it does not get a vote on where the edges are.
     Nothing in a question is shaped like that: option boxes are a fraction of
     the height, and text is nowhere near solid. */
  var vRule=Math.max(6,Math.round(ny*0.72)), hRule=Math.max(6,Math.round(nx*0.72));
  var x0=-1,x1=-1,y0=-1,y1=-1,c;
  for(c=0;c<nx;c++){ if(col[c] && col[c]<vRule){ x0=c; break; } }
  for(c=nx-1;c>=0;c--){ if(col[c] && col[c]<vRule){ x1=c; break; } }
  for(c=0;c<ny;c++){ if(row[c] && row[c]<hRule){ y0=c; break; } }
  for(c=ny-1;c>=0;c--){ if(row[c] && row[c]<hRule){ y1=c; break; } }
  /* All of it read as rules — a page of pure frame. Leave it alone. */
  if(x0<0||x1<0||y0<0||y1<0) return null;
  return {x0:Math.max(0,x0*step-pad), y0:Math.max(0,y0*step-pad),

}

  var sh=clamp(Math.ceil((rect.y1-rect.y0)*s),8,big.canvas.height-sy);

     series routinely reaches past the widest line of text and guessing where
     it stops loses half a diagram. That is the right call for finding the
     content and the wrong one for keeping it: two thirds of the picture ends
     up empty paper, which on a phone means the diagram itself is rendered
     tiny and has to be pinched open every single time.

     cut off. Sampled every few pixels — this is finding a margin, not reading

}
/* One question's patch of the page, with the printed answers already off it. */
function renderRegionImageSafe(pdf,pageNum,rect){
  return renderRegionImage(pdf,pageNum,rect,true);

/* ============ PARSERS ============

   the order it appears. Numbers printed in the paper restart at 1 in each
   section, so they are stored as a label only — the global 1..N numbering is
   assigned by position, which is what keeps the sequence identical to the PDF.

}
function sectionNameAt(markers,pos){
  var name='General';
  for(var i=0;i<markers.length;i++){ if(markers[i].pos<=pos) name=markers[i].name; else break; }
  return name;
}
function pageAt(pageRanges,pos){
  for(var i=0;i<pageRanges.length;i++){ if(pos>=pageRanges[i].start && pos<pageRanges[i].end) return pageRanges[i].pageNum; }
  return pageRanges.length? pageRanges[pageRanges.length-1].pageNum : null;
}
/* Options come labelled half a dozen ways depending on who typeset the paper.
   Each is tried in turn rather than assuming the "1. 2. 3. 4." export layout,
   which is what left ordinary papers with one giant option A and three blanks. */
var OPTION_PATTERNS=[
  /(?:^|\s)1\s*[.)]\s*([\s\S]*?)(?:^|\s)2\s*[.)]\s*([\s\S]*?)(?:^|\s)3\s*[.)]\s*([\s\S]*?)(?:^|\s)4\s*[.)]\s*([\s\S]*)$/,
  /(?:^|\s)\(1\)\s*([\s\S]*?)(?:^|\s)\(2\)\s*([\s\S]*?)(?:^|\s)\(3\)\s*([\s\S]*?)(?:^|\s)\(4\)\s*([\s\S]*)$/,
  /(?:^|\s)\(?[aA]\)\s*([\s\S]*?)(?:^|\s)\(?[bB]\)\s*([\s\S]*?)(?:^|\s)\(?[cC]\)\s*([\s\S]*?)(?:^|\s)\(?[dD]\)\s*([\s\S]*)$/,
  /(?:^|\s)[aA]\s*[.)]\s*([\s\S]*?)(?:^|\s)[bB]\s*[.)]\s*([\s\S]*?)(?:^|\s)[cC]\s*[.)]\s*([\s\S]*?)(?:^|\s)[dD]\s*[.)]\s*([\s\S]*)$/
];
function splitFourOptions(raw){
  var txt=String(raw||'');
  for(var i=0;i<OPTION_PATTERNS.length;i++){
    var m=txt.match(OPTION_PATTERNS[i]);
    if(m) return [m[1],m[2],m[3],m[4]].map(function(x){ return String(x).replace(/\s+/g,' ').trim(); });
  }
  return [txt.replace(/\s+/g,' ').trim(),'','',''];
}
/* Text sitting between two question blocks. In these papers that gap is where
   comprehension passages, cloze passages and "Directions (Q.76-80)" notes live
   — the old build threw this away, which is why passages went missing. */
function cleanGap(raw){
  return String(raw||'')
    .replace(/Section\s*:\s*[A-Za-z&,\-\/ ]+/g,' ')
    .replace(/Question\s*ID\s*:\s*\d+/g,' ')
    .replace(/Sub\s*Question\s*(?:No|Number)\s*[:.]?\s*\d+/gi,' ')
    .replace(/Status\s*:\s*(Answered|Not Answered|Marked For Review|Not Visited)/gi,' ')
    .replace(/Chosen\s*Option\s*:\s*(\d+|--)/g,' ')
    .replace(/Correct\s*(?:Option|Answer)\s*:\s*[1-4A-Da-d]/g,' ')
    .replace(/Response\s*Time\s*:\s*[^ ]+/g,' ')
    .replace(/Page\s*\d+\s*of\s*\d+/gi,' ')
    .replace(/\s+/g,' ').trim();
}
/* Solved exports print the key beside each question. "Chosen Option" is what
   the candidate picked and is worth nothing here; "Correct Option" is the key
   itself, and a key printed on the paper beats anything a model works out. */
function printedAnswerIn(tail){
  var m=String(tail||'').match(/Correct\s*(?:Option|Answer)\s*(?:ID)?\s*[:\-]?\s*([1-4]|[A-Da-d])\b/);
  return m? normLetter(m[1]) : null;
}
function gapIsPassage(txt){
  if(!txt) return false;
  if(/^(Comprehension|Direction|Directions|Read the following|Read the given|In the following passage|Study the following)/i.test(txt)) return true;
  return txt.length>=140;
}
function gapRange(txt){
  var m=txt.match(/Q\.?\s*(\d{1,3})\s*(?:to|-|–|—|and)\s*Q?\.?\s*(\d{1,3})/i);
  if(!m) return null;
  var a=Number(m[1]), b=Number(m[2]);
  if(b>=a && b-a<=12) return [a,b];
  return null;
}

/* Parser A — the "Section : / Q.n / Ans / Question ID" export layout.

   Driven by the "Q.n" markers rather than by "Question ID", which is what it
   used to key off. On a paper whose options are pictures there is no text at
   all between one question's "Ans 1. 2. 3. 4." and the next question's, so a
   block that ran to the next "Question ID" swallowed the following question
   whole and it vanished from the paper. A block now ends where the next
   question begins, whatever else is or is not printed in between. */
function parseExportFormat(combined,ranges){
  var markRe=/(?:^|\n)[ \t]*Q\.[ \t]*(\d{1,3})(?=[\s\n]|$)/g;
  var marks=[], m;
  while((m=markRe.exec(combined))){
    var at=m.index + m[0].indexOf('Q.');
    marks.push({num:Number(m[1]), start:at, after:markRe.lastIndex});
  }
  if(marks.length<10) return null;
  var markers=findSectionMarkers(combined);
  var out=[];
  for(var i=0;i<marks.length;i++){
    var b=marks[i];
    var blockEnd=(i+1<marks.length)? marks[i+1].start : combined.length;
    var body=combined.slice(b.after,blockEnd);
    /* The metadata trailer belongs to THIS question and to no other, which is
       the whole reason it is cut away here rather than looked for later. */
    var metaAt=body.search(/(?:^|\n)\s*(?:Question\s*ID|Sub\s*Question\s*(?:No|Number)|Status|Chosen\s*Option|Correct\s*(?:Option|Answer))\s*[:.]/i);
    var meta='', live=body, lead='';
    if(metaAt>=0){
      live=body.slice(0,metaAt);
      /* The trailer runs until a line that is not metadata. Anything after it
         is the lead-in to the NEXT question — a "Comprehension:" passage, or a
         "Directions (Q.76-80)" note — and is handed on rather than counted as
         part of this one. */
      var tail=body.slice(metaAt).split('\n'), k=0;
      while(k<tail.length && (!tail[k].trim() || META_LINE_RE.test(tail[k]))) k++;
      meta=tail.slice(0,k).join('\n');
      lead=tail.slice(k).join('\n');
    }
    var ansAt=live.search(/(?:^|[\s\n])Ans\b/);
    var stem = ansAt>=0? live.slice(0,ansAt) : live;
    var optRaw = ansAt>=0? live.slice(ansAt).replace(/^[\s\n]*Ans\b/,'') : '';
    out.push({
      srcNum:b.num, srcLabel:'Q.'+b.num,
      text:stem.replace(/\s+/g,' ').trim(),
      options:splitFourOptions(optRaw),
      section:sectionNameAt(markers,b.start),
      page:pageAt(ranges,b.start),
      ans:printedAnswerIn(meta),
      /* Whatever the previous question left over, plus anything printed
         between the two — never the page header, which is not a passage. */
      gap:cleanGap((i>0? (out[i-1]._lead||'') : '')),
      _lead:lead,
      spanStart:b.start, spanEnd:blockEnd
    });
  }
  return out;
}

/* Parser B — ordinary papers: a numbered stem followed by four options. */
function parsePlainFormat(combined,ranges){
  var patterns=[
    /\(a\)([\s\S]*?)\(b\)([\s\S]*?)\(c\)([\s\S]*?)\(d\)([\s\S]*?)(?=\s*(?:\(a\)|Q\.?\s*\d{1,3}[.)]|\d{1,3}[.)]\s)|$)/gi,
    /\(1\)([\s\S]*?)\(2\)([\s\S]*?)\(3\)([\s\S]*?)\(4\)([\s\S]*?)(?=\s*(?:\(1\)|Q\.?\s*\d{1,3}[.)])|$)/g,
    /\bA[.)]\s([\s\S]*?)\bB[.)]\s([\s\S]*?)\bC[.)]\s([\s\S]*?)\bD[.)]\s([\s\S]*?)(?=\s*(?:\bA[.)]\s|Q\.?\s*\d{1,3}[.)])|$)/g
  ];
  var best=null;
  patterns.forEach(function(re){
    re.lastIndex=0; var got=[]; var m;
    while((m=re.exec(combined))){ got.push({m:m,start:m.index,end:m.index+m[0].length}); }
    if(!best || got.length>best.length) best=got;
  });
  if(!best || best.length<10) return null;
  var markers=findSectionMarkers(combined);
  var out=[];
  for(var i=0;i<best.length;i++){
    var b=best[i];
    var prevEnd = i===0? 0 : best[i-1].end;
    var lead=combined.slice(prevEnd,b.start);
    /* The stem's own number is the LAST marker before it. Taking the first one
       swallowed headers like "Directions (Q. 1 to 5):" into the stem and lost
       the passage that followed. */
    var markRe=/(?:^|\s)(?:Q\.?\s*)?(\d{1,3})\s*[.)]\s+/g, mm, last=null;
    while((mm=markRe.exec(lead))){ last={num:Number(mm[1]),start:mm.index,end:mm.index+mm[0].length}; }
    var srcNum = last? last.num : (i+1);
    var stem = last? lead.slice(last.end) : lead;
    var before = last? lead.slice(0,last.start) : '';
    var tailEnd = (i+1<best.length)? best[i+1].start : combined.length;
    out.push({
      srcNum:srcNum, srcLabel:'Q.'+srcNum,
      text:stem.replace(/\s+/g,' ').trim(),
      options:[b.m[1],b.m[2],b.m[3],b.m[4]].map(function(x){return String(x).replace(/\s+/g,' ').trim();}),
      section:sectionNameAt(markers,b.start),
      page:pageAt(ranges,b.start),
      ans:printedAnswerIn(combined.slice(b.end,tailEnd)),
      gap:cleanGap(before),
      spanStart:(prevEnd + (last? last.start:0)), spanEnd:tailEnd
    });
  }
  return out;
}

/* Parser C — line-led papers, which is most of what is printed rather than
   exported. Now that the reader keeps line breaks and column order this is both
   the simplest and the most forgiving of the three, and it catches the layouts
   that used to fall through to "unfamiliar layout, reading page by page" and
   cost a hundred model calls for a paper that never needed one.

   The awkward part is that "1. Canvas" — an option — looks exactly like "1.
   Select the odd one out" — a question. They are told apart by company: four
   labelled lines running 1,2,3,4 (or a,b,c,d) in order are an option block, and
   nothing inside one can be the start of a question. */
var Q_START_RE=/^(?:Q\s*[.\-–]?\s*)?(\d{1,3})\s*[.)\]]\s+(\S[\s\S]*)$/;
var OPT_START_RE=/^\(?([1-4a-dA-D])\)?\s*[.)\]]?\s+(\S[\s\S]*)$/;
function optLabelIndex(lab){
  lab=String(lab);
  if(/[1-4]/.test(lab)) return Number(lab)-1;
  return LETTERS.indexOf(lab.toUpperCase());
}
function optLabelStyle(lab){ return /[1-4]/.test(String(lab))? 'num':'alpha'; }
/* Every group of four option lines on the page, with the line each label sits
   on and the last line the block covers. */
function findOptionRuns(lines){
  var runs=[], i=0;
  while(i<lines.length){
    var m=lines[i].match(OPT_START_RE);
    if(!m || optLabelIndex(m[1])!==0){ i++; continue; }
    var style=optLabelStyle(m[1]);
    var labelLines=[i], want=1, j=i+1, slack=0, restart=-1;
    while(j<lines.length && want<4){
      var m2=lines[j].match(OPT_START_RE);
      if(m2 && optLabelStyle(m2[1])===style){
        if(optLabelIndex(m2[1])===want){ labelLines.push(j); want++; slack=0; j++; continue; }
        /* A second "1." before any "2." means the first one was never an
           option — it was a question stem that happens to be numbered 1. This
           is the case that swallowed the first question of every paper whose
           options are numbered the same way its questions are. */
        if(optLabelIndex(m2[1])===0 && want===1){ restart=j; break; }
      }
      /* An option long enough to wrap. A couple of wrapped lines is normal; a
         handful means the run ended and this is ordinary prose. */
      if(slack<3){ slack++; j++; continue; }
      break;
    }
    if(want===4){
      runs.push({start:labelLines[0],labels:labelLines,end:j-1});
      i=j;
    }else{
      i=(restart>i)? restart : (i+1);
    }
  }
  return runs;
}
function parseLineFormat(combined,ranges){
  var lines=combined.split('\n');
  /* Offsets of each line inside the combined text, so a block can be traced
     back to its rectangle on the page. */
  var offs=[], at=0;
  lines.forEach(function(L){ offs.push(at); at+=L.length+1; });
  var optRuns=findOptionRuns(lines);
  var inOption={};
  optRuns.forEach(function(r){ for(var k=r.start;k<=r.end;k++) inOption[k]=r; });

  var starts=[];
  for(var i=0;i<lines.length;i++){
    if(inOption[i]) continue;
    var m=lines[i].match(Q_START_RE);
    if(!m) continue;
    starts.push({line:i,num:Number(m[1])});
  }
  if(starts.length<8) return null;
  var markers=findSectionMarkers(combined);
  var out=[];
  for(var s=0;s<starts.length;s++){
    var st=starts[s];
    var endLine=(s+1<starts.length)? starts[s+1].line : lines.length;
    /* The option block belonging to this question is the first one that starts
       inside it. Anything after that block is the next question's business. */
    var run=null;
    for(var r=0;r<optRuns.length;r++){
      if(optRuns[r].start>=st.line && optRuns[r].start<endLine){ run=optRuns[r]; break; }
    }
    var opts=['','','',''];
    var stemEnd = run? run.start : endLine;
    if(run){
      for(var o=0;o<4;o++){
        var from=run.labels[o];
        var to=(o<3)? run.labels[o+1] : (run.end+1);
        var piece=lines.slice(from,to).join(' ');
        var mm=piece.match(OPT_START_RE);
        opts[o]=(mm? mm[2] : piece).replace(/\s+/g,' ').trim();
      }
    }
    var stem=lines.slice(st.line,stemEnd).join(' ').replace(Q_START_RE,'$2').replace(/\s+/g,' ').trim();
    if(!run){
      /* Some papers put all four options on one line. */
      var four=splitFourOptions(lines.slice(st.line,endLine).join(' '));
      if(four[1] && four[2] && four[3]){
        opts=four;
        stem=stem.slice(0,Math.max(0,stem.length-(four.join(' ').length))).trim()||stem;
      }
    }
    var filled=opts.filter(function(x){ return x; }).length;
    if(filled<2) continue;                       // not a real question block
    var spanStart=offs[st.line];
    var spanEnd=(s+1<starts.length)? offs[starts[s+1].line] : combined.length;
    var prevEnd = out.length? out[out.length-1].spanEnd : 0;
    out.push({
      srcNum:st.num, srcLabel:'Q.'+st.num,
      text:stem,
      options:opts,
      section:sectionNameAt(markers,spanStart),
      page:pageAt(ranges,spanStart),
      ans:printedAnswerIn(combined.slice(spanStart,spanEnd)),
      gap:cleanGap(combined.slice(prevEnd,spanStart)),
      spanStart:spanStart, spanEnd:spanEnd
    });
  }
  return out.length>=8? out : null;
}
/* Whichever parser found the most complete questions wins, rather than the
   first one that scraped past ten. A parser that finds 100 stems with three
   blank options each was beating one that found 98 proper ones. */
function scoreBlocks(list){
  if(!list || !list.length) return -1;
  var full=0;
  list.forEach(function(b){
    var opts=(b.options||[]).filter(function(o){ return String(o||'').trim(); }).length;
    if(String(b.text||'').trim() && opts>=4) full+=2;
    else if(opts>=2) full+=1;
  });
  return full;
}
function parseBest(combined,ranges){
  var cands=[];
  try{ cands.push(parseExportFormat(combined,ranges)); }catch(e){}
  try{ cands.push(parseLineFormat(combined,ranges)); }catch(e){}
  try{ cands.push(parsePlainFormat(combined,ranges)); }catch(e){}
  var best=null, bestScore=-1;
  cands.forEach(function(c){
    var s=scoreBlocks(c);
    if(s>bestScore){ bestScore=s; best=c; }
  });
  return best;
}

/* Turns parsed blocks into finished questions: passages attached, figures
   flagged, sections rebuilt, numbering assigned strictly by position. */
function assemble(blocks){
  var passages={}, pid=0, seenPassage={};
  var carry=null, carryLeft=0;
  blocks.forEach(function(b,i){
    if(gapIsPassage(b.gap)){
      /* Exports reprint the whole passage above every question of its set, so
         a five-question cloze arrives as five copies of the same two thousand
         characters. Kept as one, they are one passage the five questions share
         — which is both what the screen should show and ten kilobytes less to
         send with every answer-key request. */
      var norm=b.gap.replace(/\s+/g,' ').trim().toLowerCase();
      var known=seenPassage[norm];
      if(known){
        b.passageId=known;
        passages[known].count++;
        carry={id:known,range:gapRange(b.gap)};
        carryLeft=0;
        return;
      }
      pid++;
      var id='p'+pid;
      var rng=gapRange(b.gap);
      passages[id]={id:id,text:b.gap,fromIndex:i,count:0};
      seenPassage[norm]=id;
      carry={id:id, range:rng};
      carryLeft = rng? (rng[1]-rng[0]+1) : 5;
      if(rng && b.srcNum>rng[0]) carryLeft = rng[1]-b.srcNum+1;
    }else if(b.gap && b.gap.length>40){
      carry=null; carryLeft=0;   // a fresh instruction line ends the previous set
    }
    if(carry && carryLeft>0){
      var sameSet = !carry.range || (b.srcNum>=carry.range[0] && b.srcNum<=carry.range[1]);
      if(sameSet){ b.passageId=carry.id; passages[carry.id].count++; carryLeft--; }
      else { carry=null; carryLeft=0; }
    }
  });

  var questions=[]; var sectionOrder=[]; var sectionCount={};
  blocks.forEach(function(b,i){
    var filled=(b.options||[]).filter(function(o){ return String(o||'').trim(); }).length;
    var hasText=!!String(b.text||'').trim();
    /* Two separate things used to be conflated. "This question could not be
       read" is a parse failure; "this question has a diagram" is a fact about
       the page. Telling them apart is what lets the figure pass go after the
       right questions — and stop inventing diagrams for questions that never
       had one. */
    var thin = !hasText || filled<4;
    var graphic = !!(b.hasGraphic);
    questions.push({
      number:i+1, docOrder:i, srcLabel:b.srcLabel, srcNum:b.srcNum,
      sectionName:b.section||'General', page:b.page,
      text:b.text, options:(b.options||['','','','']).slice(0,4),
      optionFigures:[null,null,null,null], figure:null,
      passageId:b.passageId||null,
      needsFigure:!!(thin||graphic), thin:thin, hasGraphic:graphic, figureDone:false,
      byMark:!!b.byMark,
      rect:b.rect||null, spanStart:b.spanStart, spanEnd:b.spanEnd,
      correct:normLetter(b.ans),
      source:normLetter(b.ans)? 'pdf':'unset', topic:'', explanation:''
    });
    var sec=b.section||'General';
    if(sectionCount[sec]===undefined){ sectionCount[sec]=0; sectionOrder.push(sec); }
    sectionCount[sec]++;
  });
  var sections=[], cursor=1;
  sectionOrder.forEach(function(name){
    sections.push({name:name,start:cursor,end:cursor+sectionCount[name]-1});
    cursor+=sectionCount[name];
  });
  // Gaps in the paper's own numbering mean a question was skipped by the parser.
  var missing=[];
  var bySec={};
  questions.forEach(function(q){ (bySec[q.sectionName]=bySec[q.sectionName]||[]).push(q.srcNum); });
  Object.keys(bySec).forEach(function(s){
    var nums=bySec[s].slice().sort(function(a,b){return a-b;});
    for(var n=1;n<=nums[nums.length-1];n++){ if(nums.indexOf(n)<0) missing.push(s+' '+n); }
  });
  return {
    questions:questions, sections:sections, passages:passages,
    missing:missing,
    figureCount:questions.filter(function(q){return q.needsFigure;}).length,
    passageCount:Object.keys(passages).length
  };
}

/* ---- questions that are not questions ----
   A paper came back reporting "50 problems worth fixing" out of a hundred,
   every one of them a duplicate label with no text, no options and no picture
   kept. They were not badly read questions; there was nothing there at all.
   The parser had split the paper into more blocks than it has questions, and
   each empty one was shipped as a question you were told to repair by hand.

   A question with no text, no options, no diagram and no picture of any kind
   cannot be answered, cannot be repaired, and is not worth a row on the check
   screen. It is dropped, and the paper honestly reports the number of
   questions it actually found.

   Only the completely empty ones. A question with any one of those four things
   is answerable — even if only by reading it off its own crop — and stays. */
function dropEmptyQuestions(built){
  var figs=built.figSources||{}, pages=built.pageImages||{};
  var keep=built.questions.filter(function(q){
    if(String(q.text||'').trim()) return true;
    if((q.options||[]).some(function(o){ return String(o||'').trim(); })) return true;
    if(q.figure || (q.optionFigures||[]).some(Boolean)) return true;
    if(figs[q.number]) return true;
    if(q.page && pages[q.page]) return true;
    return false;
  });
  var dropped=built.questions.length-keep.length;
  if(!dropped) return 0;
  /* Everything empty means the page split failed completely rather than
     over-split; dropping the lot would hand back nothing. */
  if(!keep.length) return 0;

  var newFigs={};
  keep.forEach(function(q,i){
    var was=q.number;
    q.number=i+1; q.docOrder=i;
    if(figs[was]) newFigs[q.number]=figs[was];
  });
  built.questions=keep;
  built.figSources=newFigs;

  /* Sections are ranges over the numbering, so they are rebuilt from the
     questions that survived rather than patched. */
  var secs=[], cur=null;
  keep.forEach(function(q,i){
    if(!cur || cur.name!==q.sectionName){
      if(cur) secs.push(cur);
      cur={name:q.sectionName,start:i+1,end:i+1};
    }else cur.end=i+1;
  });
  if(cur) secs.push(cur);
  built.sections=secs;
  built.figureCount=keep.filter(function(q){ return q.needsFigure; }).length;
  built.droppedEmpty=dropped;
  return dropped;
}

/* ============ FIGURE REDRAW ============
   The figure is rebuilt as vector SVG / a real table / a real chart from the
   page image, then the image is discarded. Nothing from the PDF is displayed. */
var SVG_OK_TAGS=['svg','g','path','rect','circle','ellipse','line','polyline','polygon','text','tspan','defs','marker','symbol','use','title','desc'];
function sanitizeSvg(svgText){
  if(!svgText || typeof svgText!=='string') return '';
  if(svgText.indexOf('<svg')<0) return '';
  var root=null;
  try{
    var doc=new DOMParser().parseFromString(svgText,'image/svg+xml');
    if(!doc.querySelector('parsererror')) root=doc.querySelector('svg');
  }catch(e){}
  if(!root){                       // strict XML failed — retry leniently
    try{
      var hdoc=new DOMParser().parseFromString('<div>'+svgText+'</div>','text/html');
      root=hdoc.querySelector('svg');
    }catch(e2){}
  }
  if(!root) return '';
  function cleanAttrs(el){
    Array.prototype.slice.call(el.attributes).forEach(function(at){
      var n=at.name.toLowerCase(), v=String(at.value);
      if(n.indexOf('on')===0) el.removeAttribute(at.name);
      else if((n==='href'||n==='xlink:href') && v.trim()[0]!=='#') el.removeAttribute(at.name);
      else if(/url\s*\(\s*['"]?\s*(?!#)/i.test(v)) el.removeAttribute(at.name);
    });
  }
  cleanAttrs(root);
  (function walk(node){
    Array.prototype.slice.call(node.children||[]).forEach(function(el){
      var tag=(el.tagName||'').toLowerCase();
      if(SVG_OK_TAGS.indexOf(tag)<0){ el.remove(); return; }
      cleanAttrs(el);
      walk(el);
    });
  })(root);
  if(!root.getAttribute('viewBox')){

/* The rectangle a question occupies on its page, grown to swallow the blank
   band underneath it — which is where the diagram is sitting. */
function rectForQuestion(q,pageInfo){
  if(!pageInfo || !q) return null;
  var pad=10;
  var r=q.rect;
  if(!r) return null;
  var x0=Math.max(0,r.x0-pad), x1=Math.min(pageInfo.width,r.x1+pad);
  var y0=Math.max(0,r.y0-pad), y1=Math.min(pageInfo.height,r.y1+pad);
  /* Widened to the column the question sits in, because an option diagram
     often reaches further right than any of the question's own text. The
     column is taken from the blank band the question touches, which was found
     inside that column and knows how wide it is. */
  /* Column bounds are measured from text, and a diagram routinely reaches past
     the widest line of text near it — so on a page with only one column of
     content the crop simply takes the whole width. Cutting a figure series in
     half to save a few kilobytes is the one outcome worth avoiding here. On a
     genuine two-column page the column still wins, because the alternative is
     handing over the neighbouring column as well. */
  var cols=pageInfo.colBounds||[];
  if(cols.length<=1){
    x0=0; x1=pageInfo.width;
  }else{
    var col=null, bestOv=0;
    cols.forEach(function(c){
      var ov=Math.min(c.x1,x1)-Math.max(c.x0,x0);
      if(ov>bestOv){ bestOv=ov; col=c; }
    });
    if(col){
      /* Out to the column's edge, plus a little of the gutter for a figure
         that overhangs it. */
      var slack=Math.min(24,pageInfo.width*0.04);
      x0=Math.max(0,Math.min(x0,col.x0-pad));
      x1=Math.min(pageInfo.width,Math.max(x1,col.x1+slack));
    }
    if((x1-x0)<pageInfo.width*0.3){ x0=0; x1=pageInfo.width; }
  }
  if((y1-y0)<40){ y1=Math.min(pageInfo.height,y0+40); }
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
/* Several questions in one request share one picture, so the crop has to cover
   all of them. Only ever grouped when they are neighbours on the same page. */
/* One question's own patch, fenced in by its neighbours.

   rectForQuestion pads a question's box and, on a single-column page, widens
   it to the full page width — sensible when a figure series reaches past the
   text, but it does nothing about what is ABOVE and BELOW. On the first
   question of a page that swept in the exam-details table and the Adda247
   banner; everywhere else it reached into the next question. So the crop gets
   fenced: it may not start above where the previous question on the page
   ended, and may not run past where the next one starts. */
function fencedRect(q,pageInfo,onPage){
  var r=rectForQuestion(q,pageInfo);
  if(!r) return null;
  var mine=q.rect;
  if(!mine) return r;
  var above=-Infinity, below=Infinity;
  onPage.forEach(function(o){
    if(o===q || !o.rect) return;
    if(o.rect.y1<=mine.y0+1) above=Math.max(above,o.rect.y1);
    else if(o.rect.y0>=mine.y1-1) below=Math.min(below,o.rect.y0);
  });
  if(above>-Infinity) r.y0=Math.max(r.y0,above+2);
  else r.y0=Math.max(r.y0,mine.y0-14);   /* first on the page: no banner, no table */
  if(below<Infinity)  r.y1=Math.min(r.y1,below-2);
  if(r.y1-r.y0<12) return rectForQuestion(q,pageInfo);
  return r;
}
function rectForGroup(qs,pageInfo){
  var boxes=qs.map(function(q){ return rectForQuestion(q,pageInfo); }).filter(Boolean);
  if(!boxes.length) return null;
  var r={x0:Infinity,y0:Infinity,x1:-Infinity,y1:-Infinity};
  boxes.forEach(function(b){
    r.x0=Math.min(r.x0,b.x0); r.y0=Math.min(r.y0,b.y0);
    r.x1=Math.max(r.x1,b.x1); r.y1=Math.max(r.y1,b.y1);
  });

/* The page pictures are kept with the paper, so a redraw needs no PDF. The old

/* A paper made of page pictures. Crude by design: the questions are spread

function buildPageBlocks(pageCount,qCount){
