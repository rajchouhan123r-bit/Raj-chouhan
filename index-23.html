      toast(AI.reqCap? ('A paper may use up to '+AI.reqCap+' requests.') : 'No request ceiling.');
      APP._keepScroll=true; renderApp();
      return;
    }
    var nameInput=e.target.closest('#pending-name-input');
    if(nameInput){ APP.pendingFileName=nameInput.value; return; }
    var ansSel=e.target.closest('[data-answer-select]');
    if(ansSel && APP.reviewDraft){
      var qn=Number(ansSel.dataset.answerSelect);
      APP.reviewDraft.answerMap[qn]=ansSel.value||null;
      APP.reviewDraft.answerSource[qn]='manual';
      var cov=coverageCounts(APP.paper,APP.reviewDraft.answerMap);
      var covEl=document.getElementById('coverage-summary');
      if(covEl) covEl.textContent=cov.withKey+' of '+cov.total+' set.';
      return;
    }
    var laneModelSel=e.target.closest('[data-lane-model]');
    if(laneModelSel){
      var ln=laneById(laneModelSel.getAttribute('data-lane-model'));
      if(ln){ ln.model=laneModelSel.value; saveAiSettings(); }
      return;
    }
    var secMin=e.target.closest('[data-sec-minutes]');
    if(secMin && APP.reviewDraft){
      setSectionMinutes(secMin.getAttribute('data-sec-minutes'),secMin.value);
      secMin.value=secMinutesFor(APP.reviewDraft,secMin.getAttribute('data-sec-minutes'));
      refreshSecTotals();
      return;
    }
    var secField=e.target.closest('[data-sec-field]');
    if(secField && APP.reviewDraft){
      var i=Number(secField.dataset.secIndex), field=secField.dataset.secField;
      APP.reviewDraft.sections[i][field] = field==='name'? secField.value : Number(secField.value);
      var msgEl=document.getElementById('section-coverage-msg');
      if(msgEl) msgEl.textContent=sectionCoverageMsg(APP.reviewDraft.sections,APP.paper.questions.length);
      return;
    }
  });

  appEl.addEventListener('input',function(e){
    /* Number fields only fire change on blur, which on a phone may never come. */
    var cnt=e.target.closest('#pending-count-input');
    if(cnt){ APP.pendingCount=clamp(Number(cnt.value)||100,1,300); return; }
    var nm=e.target.closest('#pending-name-input');
    if(nm){ APP.pendingFileName=nm.value; return; }
    /* Number fields fire change only on blur, which on a phone may never come,
       so the total is kept live from input as well. */
    var secMinIn=e.target.closest('[data-sec-minutes]');
    if(secMinIn && APP.reviewDraft){
      setSectionMinutes(secMinIn.getAttribute('data-sec-minutes'),secMinIn.value);
      refreshSecTotals();
      return;
    }
    var slider=e.target.closest('#duration-slider');
    if(slider && APP.reviewDraft){
      APP.reviewDraft.durationMinutes=Number(slider.value);
      if(APP.reviewDraft.mode==='full') APP.reviewDraft.fullMinutes=Number(slider.value);
      var out=document.getElementById('duration-readout');
      if(out) out.textContent=fmtMinutes(slider.value);
      Array.prototype.forEach.call(appEl.querySelectorAll('[data-action="set-duration"]'),function(c){
        c.classList.toggle('active', Number(c.dataset.min)===Number(slider.value));
      });
      var sum=document.getElementById('review-summary-line');
      if(sum && APP.paper) sum.textContent=reviewSummaryLine(APP.paper,APP.reviewDraft,coverageCounts(APP.paper,APP.reviewDraft.answerMap));
    }
  });

  document.addEventListener('keydown',function(e){
    if(APP.screen!=='test' || !APP.attempt || APP.confirm) return;
    if(e.target && /input|select|textarea/i.test(e.target.tagName)) return;
    var k=(e.key||'').toUpperCase();
    if(APP.attempt.paused){ if(e.key===' '||k==='P'){ e.preventDefault(); resumeTest(); } return; }
    if(APP.drawerOpen){ if(e.key==='Escape'){ APP.drawerOpen=false; renderApp(); } return; }
    if(LETTERS.indexOf(k)>-1){ e.preventDefault(); selectOption(k); }
    else if(['1','2','3','4'].indexOf(e.key)>-1){ e.preventDefault(); selectOption(LETTERS[Number(e.key)-1]); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); goToRelative(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); goToRelative(-1); }
    else if(k==='P'){ e.preventDefault(); pauseTest(); }
    else if(k==='U'){ e.preventDefault(); goNextUnanswered(); }
    else if(k==='M'){ e.preventDefault(); markAndNext(); }
    else if(k==='C'){ e.preventDefault(); clearResponseAction(); }
  });

  /* Enter/Space on a focused option, for keyboard and screen-reader use. */
  appEl.addEventListener('keydown',function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var row=e.target.closest && e.target.closest('.option-row[data-action="select-option"]');
    if(!row) return;
    e.preventDefault(); selectOption(row.dataset.letter);
  });

  /* Swipe between questions. Ignored inside anything that scrolls sideways
     or takes input, so passages and tables still behave normally. */
  var _swX=0,_swY=0,_swT=0,_swOn=false;
  appEl.addEventListener('touchstart',function(e){
    _swOn=false;
    if(APP.screen!=='test' || APP.drawerOpen || APP.confirm || isPaused()) return;
    if(!e.touches || e.touches.length!==1) return;
    if(e.target.closest && e.target.closest('.passage-body,table,input,select,textarea,.section-tabs,.chips,.test-footer')) return;
    _swOn=true; _swX=e.touches[0].clientX; _swY=e.touches[0].clientY; _swT=Date.now();
  },{passive:true});
  appEl.addEventListener('touchend',function(e){
    if(!_swOn) return; _swOn=false;
    var t=e.changedTouches && e.changedTouches[0]; if(!t) return;
    var dx=t.clientX-_swX, dy=t.clientY-_swY;
    if(Date.now()-_swT>800) return;
    if(Math.abs(dx)<70 || Math.abs(dy)>55) return;
    if(dx<0) goToRelative(1); else goToRelative(-1);
  },{passive:true});

  // The clock stops while the app is in the background, so closing it mid-test
  // no longer burns the whole time limit.
  document.addEventListener('visibilitychange',function(){
    var a=APP.attempt;
    if(!a || a.submitted || APP.screen!=='test') return;
    if(document.hidden){
      commitQuestionTime();
      if(!a.paused && a.runningSince){ a.elapsedMs=elapsedMs(a); a.runningSince=null; a._away=Date.now(); }
      storSet('attempt:'+a.paperId,a);
    }else if(!a.paused){
      if(a._away){ a.awayMs=(a.awayMs||0)+(Date.now()-a._away); a._away=null; }
      a.runningSince=Date.now(); a.qEnteredAt=Date.now();
      acquireWakeLock();
      APP._keepScroll=true; renderApp();
    }
  });
  /* Drop a backup or a paper file anywhere on the window. On a laptop this is
     the natural way to move a library across, and it needs no file picker. */
  ['dragenter','dragover'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')<0) return;
      e.preventDefault();
      document.body.classList.add('dropping');
    });
  });
  ['dragleave','dragend'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(e.relatedTarget) return;
      document.body.classList.remove('dropping');
    });
  });
  window.addEventListener('drop',function(e){
    if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    document.body.classList.remove('dropping');
    var f=e.dataTransfer.files[0];
    if(/cgl-backup|backup/i.test(f.name) && /\.json$/i.test(f.name)){ restoreBackupFile(f); return; }
    var isPdf=/\.pdf$/i.test(f.name) || f.type==='application/pdf';
    var isJson=/\.(json|txt)$/i.test(f.name);
    if(!isPdf && !isJson){ toast('Drop a .pdf paper, a .json paper file, or a backup.'); return; }
    APP.pendingKind=isPdf? 'pdf':'json';
    APP.pendingFile=f;
    APP.pendingFileName=f.name.replace(/\.(cglpaper\.)?(json|txt|pdf)$/i,'').replace(/[_-]+/g,' ').trim()||'Untitled paper';
    APP.screen='upload'; prefetchPdfLib(); renderApp();
  });
  /* Coming back to the tab: nudge the scheduler, which may have been sitting on
     a timer the browser slowed to a crawl in the background. */
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) wakeScheduler();
  });
  window.addEventListener('online',function(){ if(APP.screen==='results'||APP.screen==='review'||APP.screen==='settings'){ APP._keepScroll=true; renderApp(); } });
  window.addEventListener('offline',function(){ if(APP.screen==='results'||APP.screen==='review'||APP.screen==='settings'){ APP._keepScroll=true; renderApp(); } });
  window.addEventListener('pagehide',function(){
    var a=APP.attempt;
    if(a && !a.submitted){ commitQuestionTime(); a.elapsedMs=elapsedMs(a); a.runningSince=null; storSet('attempt:'+a.paperId,a); }
  });
}

/* ============ INIT ============ */
async function init(){
  appEl=document.getElementById('app');
  wireEvents();
  /* Before anything reads or writes: works out which store this browser can
     give us and moves anything an older build left behind. */
  await initStorage();
  refreshQuota();
  initPwa();
  checkStoragePersistence().then(function(st){
    if(st.persisted===false && isStandalone()){
      /* Installed to the home screen is exactly when Android is willing. */
      requestPersistence(true);
    }
  });
  await initTheme();
  await initViewMode();
  var fs=Number(await storGet('fontScale'))||1;
  setFontScale(fs);
  reqLoad();
  await loadAiSettings();
  APP.library=(await storGet('library_index'))||[];
  /* Older saved libraries predate the history fields. */
  APP.library.forEach(function(e){
    if(e.scores===undefined) e.scores=(e.lastScore!=null? [e.lastScore]:[]);
    if(e.bestScore===undefined) e.bestScore=(e.lastScore!=null? e.lastScore:null);
    if(e.attempts===undefined) e.attempts=(e.lastScore!=null?1:0);
    if(e.inProgress===undefined) e.inProgress=false;
  });

  if(typeof PRELOADED_PAPER!=='undefined' && PRELOADED_PAPER){
    var entry=APP.library.filter(function(p){return p.id===PRELOADED_PAPER.id;})[0];
    var storedV=await storGet('preloaded_version');
    if(!entry){
      await storSet('paper:'+PRELOADED_PAPER.id,PRELOADED_PAPER);
      entry=libEntry(PRELOADED_PAPER);
      APP.library.push(entry);
    }else if(storedV!==PRELOADED_VERSION){
      /* A newer build of this file carries a corrected copy of the built-in
         paper. Refresh it, but never mid-attempt. */
      var live=await storGet('attempt:'+PRELOADED_PAPER.id);
      if(!live || live.submitted){
        var fresh=JSON.parse(JSON.stringify(PRELOADED_PAPER));
        fresh.durationMinutes=entry.durationMinutes||fresh.durationMinutes;
        await storSet('paper:'+fresh.id,fresh);
        entry.name=fresh.name;
        entry.questionCount=fresh.questions.length;
      }
    }
    await storSet('preloaded_version',PRELOADED_VERSION);
  }

  /* The "in progress" flag on a card is only trustworthy if it matches what is
     actually saved, so it is checked once at startup. */
  for(var i=0;i<APP.library.length;i++){
    var at=await storGet('attempt:'+APP.library[i].id);
    APP.library[i].inProgress=!!(at && !at.submitted);
    APP.library[i].pendingScore=!!(at && at.submitted && at.unscored);
  }
  await storSet('library_index',APP.library);
  renderApp();
}
init();
</script>
